<text x="48.0" y="916.0" font-size="13" fill="#888780" text-anchor="start">注：多数脚本的退出码不是判定，各脚本的判定看哪一行见 §1.1。本章只讲用什么测、怎么判，测到的结果见第 19～22 章。</text>
