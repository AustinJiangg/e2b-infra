<text x="347.8" y="454.0" font-size="13.5" fill="#534AB7" text-anchor="middle">Go 与 Python 的单元测试</text>
<rect x="529.5" y="404.0" width="319.5" height="62.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.6"/>
