<text x="689.2" y="454.0" font-size="13.5" fill="#534AB7" text-anchor="middle">四个 verify_* 脚本</text>
<rect x="871.0" y="404.0" width="319.5" height="62.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.6"/>
<text x="1030.8" y="432.0" font-size="19" fill="#3C3489" font-weight="600" text-anchor="middle">性能</text>
<text x="1030.8" y="454.0" font-size="13.5" fill="#534AB7" text-anchor="middle">demo_checkpoint_perf、exp_gsd_swap</text>
<rect x="1212.5" y="404.0" width="319.5" height="62.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.6"/>
<text x="1372.2" y="432.0" font-size="19" fill="#3C3489" font-weight="600" text-anchor="middle">压测与探针</text>
<text x="1372.2" y="454.0" font-size="13.5" fill="#534AB7" text-anchor="middle">四个 stress_*、十几个 probe_*</text>
<text x="68.0" y="519.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">回答什么</text>
<rect x="188.0" y="482.0" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="347.8" y="507.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">gsd 以为自己做了什么</text>
<text x="347.8" y="534.2" font-size="13" fill="#534AB7" text-anchor="middle">用假的 /proc 和假的 criu 断言编排</text>
<rect x="529.5" y="482.0" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="689.2" y="507.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">做一件事，结果对不对</text>
<text x="689.2" y="534.2" font-size="13" fill="#534AB7" text-anchor="middle">进程是否回来、文件是否回滚</text>
<rect x="871.0" y="482.0" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1030.8" y="507.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">时间花在哪</text>
<text x="1030.8" y="534.2" font-size="13" fill="#534AB7" text-anchor="middle">各分段耗时，两个版本之间的差</text>
<rect x="1212.5" y="482.0" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1372.2" y="507.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">并发下会不会坏</text>
<text x="1372.2" y="534.2" font-size="13" fill="#534AB7" text-anchor="middle">压测撞竞态；探针各复现一个具体问题</text>
<text x="68.0" y="615.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">在哪跑</text>
<rect x="188.0" y="577.5" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="347.8" y="602.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">有 Go 工具链的机器</text>
<text x="347.8" y="629.7" font-size="13" fill="#534AB7" text-anchor="middle">不需要 guest</text>
<rect x="529.5" y="577.5" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="689.2" y="602.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">进程级栈运行中的宿主机</text>
<text x="689.2" y="629.7" font-size="13" fill="#534AB7" text-anchor="middle">起真实沙箱</text>
<rect x="871.0" y="577.5" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1030.8" y="602.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">进程级栈运行中的宿主机</text>
<text x="1030.8" y="629.7" font-size="13" fill="#534AB7" text-anchor="middle">起真实沙箱</text>
<rect x="1212.5" y="577.5" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1372.2" y="602.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">进程级栈运行中的宿主机</text>
<text x="1372.2" y="629.7" font-size="13" fill="#534AB7" text-anchor="middle">压测另在调试内核上跑一遍</text>
<text x="68.0" y="710.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">能抓到</text>
<rect x="188.0" y="673.0" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="347.8" y="698.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">编排与失败路径</text>
<text x="347.8" y="725.2" font-size="13" fill="#534AB7" text-anchor="middle">清理、状态文件、增量父子关系、SDK 错误映射</text>
<rect x="529.5" y="673.0" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="689.2" y="698.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">端到端行为</text>
<text x="689.2" y="725.2" font-size="13" fill="#534AB7" text-anchor="middle">错误码与 SDK 异常、增量是否漏页</text>
<rect x="871.0" y="673.0" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1030.8" y="698.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">分段与一致性</text>
<text x="1030.8" y="725.2" font-size="13" fill="#534AB7" text-anchor="middle">SDK 返回的分段与 gsd 日志是否一致</text>
<rect x="1212.5" y="673.0" width="319.5" height="65.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1372.2" y="698.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">内核侧竞态</text>
<text x="1372.2" y="725.2" font-size="13" fill="#534AB7" text-anchor="middle">切换与并发文件操作、释放后使用、死锁、泄漏</text>
<text x="68.0" y="806.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">抓不到</text>
<rect x="188.0" y="768.5" width="319.5" height="65.5" rx="10" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="347.8" y="793.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">真实 CRIU、内核补丁</text>
<text x="347.8" y="820.7" font-size="13" fill="#534AB7" text-anchor="middle">以及模板注入的实际效果</text>
<rect x="529.5" y="768.5" width="319.5" height="65.5" rx="10" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="689.2" y="793.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">内核竞态</text>
<text x="689.2" y="820.7" font-size="13" fill="#534AB7" text-anchor="middle">每项只跑几秒到几十秒</text>
<rect x="871.0" y="768.5" width="319.5" height="65.5" rx="10" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1030.8" y="793.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">未覆盖的程序或内核行为</text>
<text x="1030.8" y="820.7" font-size="13" fill="#534AB7" text-anchor="middle">也不能替代功能验收</text>
<rect x="1212.5" y="768.5" width="319.5" height="65.5" rx="10" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1372.2" y="793.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">功能语义的全面覆盖</text>
<text x="1372.2" y="820.7" font-size="13" fill="#534AB7" text-anchor="middle">压测只盯几条不变量</text>
