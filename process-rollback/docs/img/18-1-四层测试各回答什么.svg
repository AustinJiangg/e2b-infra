</defs>
<rect width="1600" height="948" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">四层测试各回答一个问题，没有一层能同时看见全部四处</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">gsd 的正确性分散在四个地方。单测只看得见 gsd 自己以为做了什么；最严重的几个问题在内核补丁里，要靠压测在并发文件操作下连续撞出来。</text>
