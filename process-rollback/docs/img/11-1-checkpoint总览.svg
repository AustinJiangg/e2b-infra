<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">CreateCheckpoint 全程持操作锁。checkpoint 没有不可逆的步骤：任何一步失败，收尾之后进程在跑、文件系统没变、没有多出条目。</text>
