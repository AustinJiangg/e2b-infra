<text x="48.0" y="1301.0" font-size="13" fill="#888780" text-anchor="start">注：没有用户进程时，多树预检、容量预检、dump、clear_refs、SIGCONT 都跳过，做只有文件系统的 checkpoint；upper 为空时不下沉。dump 或下沉失败时：放开进程、删掉整个 &lt;id&gt;_mem、回退改名、清空 lastTrees，下一次全量。</text>
