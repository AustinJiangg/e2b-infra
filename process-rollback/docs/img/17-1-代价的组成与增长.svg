<rect x="272.0" y="918.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="336.0" y="943.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 2 dump</text>
<rect x="404.0" y="918.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="468.0" y="943.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 3 dump</text>
<text x="548.0" y="944.5" font-size="13.5" fill="#5F5E5A" text-anchor="start">≈ 3 × 每棵树一段</text>
<path d="M270.0 964.5 L270.0 972.5 L532.0 972.5 L532.0 964.5" fill="none" stroke="#7F77DD" stroke-width="1.6"/>
<text x="270.0" y="996.5" font-size="13.5" fill="#534AB7" font-weight="600" text-anchor="start">树 1 dump 完后一直停到最后一棵 dump 完：</text>
<text x="270.0" y="1016.5" font-size="13.5" fill="#534AB7" font-weight="600" text-anchor="start">stopped_ms ≈ 其余各棵的 dump 时间之和（图 13-3）</text>
<text x="824.0" y="782.5" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">restore</text>
<text x="902.7" y="782.5" font-size="13.5" fill="#888780" text-anchor="start">逐棵 criu restore</text>
<text x="824.0" y="832.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">1 棵树</text>
<rect x="916.0" y="806.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="980.0" y="831.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 1 restore</text>
<text x="1060.0" y="832.5" font-size="13.5" fill="#5F5E5A" text-anchor="start">≈ 1 × 每棵树一段</text>
<text x="824.0" y="888.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">2 棵树</text>
<rect x="916.0" y="862.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="980.0" y="887.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 1 restore</text>
<rect x="1048.0" y="862.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1112.0" y="887.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 2 restore</text>
<text x="1192.0" y="888.5" font-size="13.5" fill="#5F5E5A" text-anchor="start">≈ 2 × 每棵树一段</text>
<text x="824.0" y="944.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">3 棵树</text>
<rect x="916.0" y="918.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="980.0" y="943.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 1 restore</text>
<rect x="1048.0" y="918.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1112.0" y="943.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 2 restore</text>
<rect x="1180.0" y="918.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1244.0" y="943.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 3 restore</text>
<text x="1324.0" y="944.5" font-size="13.5" fill="#5F5E5A" text-anchor="start">≈ 3 × 每棵树一段</text>
<line x1="48" y1="1072.5" x2="1552" y2="1072.5" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1098.5" font-size="13" fill="#888780" text-anchor="start">注：单树 restore 的 total_ms 约等于 criu_restore_ms 加 kill_ms，其余三项合起来很小；单树 checkpoint 的 total_ms 约等于 criu_dump_ms 加很小的其余部分。多树时 precheck_ms 还要查树间共享的管道和 socket，随树数略增。THP 为</text>
<text x="48.0" y="1118.5" font-size="13" fill="#888780" text-anchor="start">never 使 criu_restore_ms 里多出一部分缺页（§6）。</text>
