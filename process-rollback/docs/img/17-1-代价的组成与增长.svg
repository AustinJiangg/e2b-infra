<rect x="272.0" y="862.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="336.0" y="887.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 2 dump</text>
<text x="416.0" y="888.5" font-size="13.5" fill="#5F5E5A" text-anchor="start">≈ 2 × 每棵树一段</text>
<text x="48.0" y="944.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">3 棵树</text>
