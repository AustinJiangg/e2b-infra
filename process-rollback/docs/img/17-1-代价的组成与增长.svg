<rect x="448.0" y="479.5" width="51.3" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="473.6" y="495.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">CRIU</text>
<rect x="448.0" y="584.5" width="316.0" height="26.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="606.0" y="601.5" font-size="13" fill="#3C3489" font-weight="500" text-anchor="middle">全量：全部匿名内存；增量：上次以来的脏页</text>
<text x="606.0" y="532.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">criu dump：写出页面</text>
<text x="606.0" y="560.8" font-size="14" fill="#5F5E5A" text-anchor="middle">随本次要写出的页数</text>
<line x1="780.0" y1="543.5" x2="818.0" y2="543.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="824.0" y="468.5" width="340.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="836.0" y="479.5" width="120.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="896.4" y="495.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd → guest 内核</text>
<text x="994.0" y="540.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">沉下 upper</text>
<text x="994.0" y="568.3" font-size="14" fill="#5F5E5A" text-anchor="middle">一次改名加一次 ioctl；可写打开的文件按大小</text>
<text x="994.0" y="589.3" font-size="14" fill="#5F5E5A" text-anchor="middle">拷贝（§4）</text>
<line x1="1168.0" y1="543.5" x2="1206.0" y2="543.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1212.0" y="468.5" width="340.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1224.0" y="479.5" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1243.4" y="495.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="1382.0" y="550.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">清 soft-dirty，放开进程</text>
<text x="1382.0" y="578.8" font-size="14" fill="#5F5E5A" text-anchor="middle">重写 clear_refs，再 SIGCONT</text>
<rect x="48.0" y="634.5" width="728.0" height="40.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="412.0" y="659.5" font-size="14.5" fill="#3C3489" font-weight="600" text-anchor="middle">criu_dump_ms：dump 期间进程已被冻结</text>
<rect x="824.0" y="634.5" width="728.0" height="40.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="1188.0" y="659.5" font-size="14.5" fill="#3C3489" font-weight="600" text-anchor="middle">stopped_ms：从 dump 结束算起</text>
<circle cx="63" cy="720.5" r="15" fill="#2C2C2A"/>
<text x="63.0" y="726.0" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="90.0" y="727.5" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">多棵树：每棵树一次 dump、一次 restore，串行</text>
<text x="549.7" y="726.5" font-size="14.5" fill="#888780" text-anchor="start">这条线性关系的依据只到三棵树</text>
<text x="48.0" y="782.5" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">checkpoint</text>
<text x="154.4" y="782.5" font-size="13.5" fill="#888780" text-anchor="start">逐棵 criu dump</text>
<text x="48.0" y="832.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">1 棵树</text>
<rect x="140.0" y="806.5" width="128.0" height="40.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="204.0" y="831.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="middle">树 1 dump</text>
<text x="284.0" y="832.5" font-size="13.5" fill="#5F5E5A" text-anchor="start">≈ 1 × 每棵树一段</text>
<text x="48.0" y="888.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">2 棵树</text>
