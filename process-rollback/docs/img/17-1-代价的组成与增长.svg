<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1150" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">代价的形状：restore 随进程内存总量增长，checkpoint 随本次写出的页数增长，多棵树线性叠加</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">把一次 restore、一次 checkpoint 拆成 gsd 自报的各个计时项，标出每一项随什么增长。只画结构，框的宽度不代表耗时；各项的量级见本章各节，判定值见第 20 章。</text>
<circle cx="63" cy="144" r="15" fill="#2C2C2A"/>
<text x="63.0" y="149.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="151.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">单树 restore：两大项都随进程内存增长</text>
<rect x="477.1" y="134.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="514.1" y="150.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<text x="567.1" y="150.0" font-size="14.5" fill="#888780" text-anchor="start">按执行顺序</text>
<rect x="48.0" y="172.0" width="268.8" height="166.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="183.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="79.4" y="198.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<rect x="60.0" y="304.5" width="244.8" height="26.0" rx="6" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="182.4" y="321.5" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle">小项</text>
<text x="182.4" y="234.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">precheck_ms</text>
<text x="182.4" y="262.0" font-size="14" fill="#5F5E5A" text-anchor="middle">检查镜像、建目录；随树数与增量</text>
<text x="182.4" y="283.0" font-size="14" fill="#5F5E5A" text-anchor="middle">链深度</text>
<line x1="320.8" y1="255.2" x2="350.8" y2="255.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="356.8" y="172.0" width="268.8" height="166.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="368.8" y="183.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="388.2" y="198.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<rect x="368.8" y="304.5" width="244.8" height="26.0" rx="6" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="491.2" y="321.5" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle">小项</text>
<text x="491.2" y="234.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">find_pids_ms</text>
<text x="491.2" y="262.0" font-size="14" fill="#5F5E5A" text-anchor="middle">扫描用户进程；随 guest 里的用户</text>
<text x="491.2" y="283.0" font-size="14" fill="#5F5E5A" text-anchor="middle">进程数</text>
<line x1="629.6" y1="255.2" x2="659.6" y2="255.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="665.6" y="172.0" width="268.8" height="166.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="677.6" y="183.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="697.0" y="198.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<rect x="677.6" y="304.5" width="244.8" height="26.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="800.0" y="321.5" font-size="13" fill="#3C3489" font-weight="500" text-anchor="middle">主要项</text>
<text x="800.0" y="234.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">kill_ms</text>
<text x="800.0" y="262.0" font-size="14" fill="#5F5E5A" text-anchor="middle">杀掉全部用户进程，等内核归还它们</text>
<text x="800.0" y="283.0" font-size="14" fill="#5F5E5A" text-anchor="middle">的页；随被杀进程的内存总量</text>
<line x1="938.4" y1="255.2" x2="968.4" y2="255.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="974.4" y="172.0" width="268.8" height="166.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="986.4" y="183.0" width="120.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1046.8" y="198.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd → guest 内核</text>
<rect x="986.4" y="304.5" width="244.8" height="26.0" rx="6" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1108.8" y="321.5" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle">小项</text>
<text x="1108.8" y="244.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">overlay_restore_ms</text>
<text x="1108.8" y="272.5" font-size="14" fill="#5F5E5A" text-anchor="middle">切回层栈，一次 ioctl；基本恒定</text>
<line x1="1247.2" y1="255.2" x2="1277.2" y2="255.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1283.2" y="172.0" width="268.8" height="166.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1295.2" y="183.0" width="51.3" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1320.8" y="198.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">CRIU</text>
<rect x="1295.2" y="304.5" width="244.8" height="26.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="1417.6" y="321.5" font-size="13" fill="#3C3489" font-weight="500" text-anchor="middle">主要项</text>
<text x="1417.6" y="234.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">criu_restore_ms</text>
<text x="1417.6" y="262.0" font-size="14" fill="#5F5E5A" text-anchor="middle">逐棵重建、读回页面并缺页映射；随</text>
<text x="1417.6" y="283.0" font-size="14" fill="#5F5E5A" text-anchor="middle">整条增量链合起来的页数</text>
<rect x="48.0" y="354.5" width="1504.0" height="40.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="800.0" y="380.5" font-size="14.5" fill="#3C3489" font-weight="600" text-anchor="middle">restore 总是杀掉全部进程、恢复全部内存：耗时取决于目标 checkpoint 时进程有多大，与上次 checkpoint 之后改了多少几乎无关</text>
<circle cx="63" cy="440.5" r="15" fill="#2C2C2A"/>
<text x="63.0" y="446.0" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="447.5" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">单树 checkpoint：随本次要写出的页数增长</text>
<text x="511.8" y="446.5" font-size="14.5" fill="#888780" text-anchor="start">按执行顺序</text>
<rect x="48.0" y="468.5" width="340.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="479.5" width="51.3" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="85.6" y="495.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">CRIU</text>
<text x="218.0" y="540.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">criu dump：固定部分</text>
<text x="218.0" y="568.3" font-size="14" fill="#5F5E5A" text-anchor="middle">冻结进程、遍历页表、写元数据；不改内存时只剩</text>
<text x="218.0" y="589.3" font-size="14" fill="#5F5E5A" text-anchor="middle">这一部分</text>
<line x1="392.0" y1="543.5" x2="430.0" y2="543.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
