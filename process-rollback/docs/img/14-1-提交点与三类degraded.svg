<rect width="1600" height="1527" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">失败之后沙箱在哪：提交点之前什么都没动，之后返回 data_loss 并进入 degraded</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">checkpoint 没有不可逆步骤，任何失败都回到“进程照常运行、列表没有变化”；restore 以杀进程为提交点。degraded 指 gsd 能应答、但暂时不该做 checkpoint 或 restore，有三个独立的原因。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">正常顺序</text>
<line x1="192.0" y1="125.0" x2="232.0" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="242.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">在这一步失败</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">checkpoint：没有不可逆步骤</text>
<text x="385.5" y="184.0" font-size="14.5" fill="#888780" text-anchor="start">dump 一旦开始，失败之后下一次 checkpoint 每棵树都是全量</text>
<rect x="48.0" y="212.0" width="343.0" height="108.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="223.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="79.4" y="238.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="219.5" y="263.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">检查与预检</text>
<text x="219.5" y="290.4" font-size="13" fill="#5F5E5A" text-anchor="middle">degraded 检查、扫描 /proc、多树预检、容量预</text>
<text x="219.5" y="310.4" font-size="13" fill="#5F5E5A" text-anchor="middle">检、建镜像目录</text>
<line x1="395.0" y1="266.0" x2="429.0" y2="266.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="435.0" y="212.0" width="343.0" height="108.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="447.0" y="223.0" width="51.3" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="472.6" y="238.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">CRIU</text>
<text x="606.5" y="273.6" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">逐棵 criu dump</text>
<text x="606.5" y="300.4" font-size="13" fill="#534AB7" text-anchor="middle">dump 完留在停止状态</text>
<line x1="782.0" y1="266.0" x2="816.0" y2="266.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="822.0" y="212.0" width="343.0" height="108.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="834.0" y="223.0" width="82.4" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="875.2" y="238.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">gsd → 内核</text>
<text x="993.5" y="263.6" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">沉下 upper</text>
<text x="993.5" y="290.4" font-size="13" fill="#534AB7" text-anchor="middle">改名 L&lt;n&gt; + checkpoint 模式 ioctl；含层栈深</text>
<text x="993.5" y="310.4" font-size="13" fill="#534AB7" text-anchor="middle">度预检</text>
<line x1="1169.0" y1="266.0" x2="1203.0" y2="266.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1209.0" y="212.0" width="343.0" height="108.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1221.0" y="223.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1240.4" y="238.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="1380.5" y="273.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">清 soft-dirty、放开、入池</text>
<text x="1380.5" y="300.4" font-size="13" fill="#5F5E5A" text-anchor="middle">成功</text>
<line x1="219.5" y1="322.0" x2="219.5" y2="368.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<line x1="606.5" y1="322.0" x2="606.5" y2="368.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<line x1="993.5" y1="322.0" x2="993.5" y2="368.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<rect x="48.0" y="374.0" width="343.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="219.5" y="402.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">什么都没动</text>
<text x="219.5" y="429.4" font-size="13" fill="#5F5E5A" text-anchor="middle">进程没有被停过；错误码 failed_precondition、</text>
<text x="219.5" y="449.4" font-size="13" fill="#5F5E5A" text-anchor="middle">resource_exhausted 或 internal</text>
<rect x="435.0" y="374.0" width="730.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="800.0" y="412.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">进程放开、文件系统和列表没动，但增量起点丢了</text>
<text x="800.0" y="439.4" font-size="13" fill="#5F5E5A" text-anchor="middle">放开 dump 前不是停止状态的进程；discardFailedCheckpoint 删掉整个镜像目录并清空增量父镜像记录</text>
<circle cx="63" cy="512" r="15" fill="#2C2C2A"/>
<text x="63.0" y="517.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="519.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">restore：杀进程就是提交点</text>
<rect x="370.9" y="502.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="407.9" y="518.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<text x="460.9" y="518.0" font-size="14.5" fill="#888780" text-anchor="start">两段的逐步内容见 12-1</text>
<rect x="48.0" y="546.0" width="343.0" height="108.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="557.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="79.4" y="572.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="219.5" y="597.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">第一段：检查与准备</text>
<text x="219.5" y="624.4" font-size="13" fill="#5F5E5A" text-anchor="middle">degraded 检查、找目标、checkImages、</text>
<text x="219.5" y="644.4" font-size="13" fill="#5F5E5A" text-anchor="middle">PrepareRestore、扫描</text>
<line x1="395.0" y1="600.0" x2="429.0" y2="600.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="435.0" y="546.0" width="343.0" height="108.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<rect x="447.0" y="557.0" width="106.4" height="22.0" rx="11" fill="#FFFFFF" stroke="#D85A30" stroke-width="0.8"/>
<text x="500.2" y="572.5" font-size="12" fill="#993C1D" font-weight="500" text-anchor="middle">gsd → 用户进程</text>
<text x="606.5" y="607.6" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">killTrees</text>
<text x="606.5" y="634.4" font-size="13" fill="#993C1D" text-anchor="middle">杀掉当前全部用户进程：不可逆</text>
<line x1="782.0" y1="600.0" x2="816.0" y2="600.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="822.0" y="546.0" width="343.0" height="108.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="834.0" y="557.0" width="82.4" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="875.2" y="572.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">gsd → 内核</text>
<text x="993.5" y="607.6" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">CommitRestore</text>
<text x="993.5" y="634.4" font-size="13" fill="#534AB7" text-anchor="middle">restore 模式 ioctl，切到目标层栈</text>
<line x1="1169.0" y1="600.0" x2="1203.0" y2="600.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1209.0" y="546.0" width="343.0" height="108.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="1221.0" y="557.0" width="51.3" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="1246.6" y="572.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">CRIU</text>
<text x="1380.5" y="607.6" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">逐棵 criu restore</text>
<text x="1380.5" y="634.4" font-size="13" fill="#534AB7" text-anchor="middle">成功后解除 degraded</text>
<line x1="413.0" y1="540.0" x2="413.0" y2="672.0" stroke="#E24B4A" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="413.0" y="690.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">提交点</text>
<line x1="219.5" y1="656.0" x2="219.5" y2="702.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<line x1="993.5" y1="656.0" x2="993.5" y2="702.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="1005.5" y="684.0" font-size="13" fill="#D85A30" font-weight="600" text-anchor="start">文件系统 old</text>
<line x1="1380.5" y1="656.0" x2="1380.5" y2="702.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="1392.5" y="684.0" font-size="13" fill="#D85A30" font-weight="600" text-anchor="start">文件系统 target</text>
<rect x="48.0" y="708.0" width="343.0" height="116.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="219.5" y="748.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">什么都没动</text>
<text x="219.5" y="775.4" font-size="13" fill="#5F5E5A" text-anchor="middle">错误信息含 nothing was changed；可以直接重试或</text>
<text x="219.5" y="795.4" font-size="13" fill="#5F5E5A" text-anchor="middle">换目标</text>
<rect x="822.0" y="708.0" width="730.0" height="116.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1187.0" y="748.6" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">data_loss：用户进程已经没了</text>
<text x="1187.0" y="775.4" font-size="13" fill="#993C1D" text-anchor="middle">信息写明文件系统在 old 还是 target；多树时前 i 棵已恢复并运行、第 i 棵失败、其余未尝试；criu 超时也走这里。</text>
<text x="1187.0" y="795.4" font-size="13" fill="#993C1D" text-anchor="middle">gsd 进入“restore 半途失败”，只能再 restore 一次</text>
<text x="606.5" y="738.0" font-size="13.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">killTrees 自己报的错</text>
<text x="606.5" y="760.0" font-size="13.5" fill="#5F5E5A" text-anchor="middle">只记日志，不中断 restore</text>
<text x="606.5" y="790.0" font-size="13" fill="#888780" text-anchor="middle">没杀任何进程时切层失败：</text>
<text x="606.5" y="810.0" font-size="13" fill="#888780" text-anchor="middle">按普通错误返回，不进 degraded</text>
<circle cx="63" cy="870" r="15" fill="#2C2C2A"/>
<text x="63.0" y="875.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="90.0" y="877.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">三类 degraded：各拦什么、怎么解除</text>
<text x="448.7" y="876.0" font-size="14.5" fill="#888780" text-anchor="start">DegradedReason 把非空的几个用分号连起来报告</text>
<rect x="48.0" y="896.0" width="1504.0" height="537.0" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<rect x="218.0" y="916.0" width="423.3" height="62.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6"/>
<text x="429.7" y="944.0" font-size="19" fill="#712B13" font-weight="600" text-anchor="middle">fatal</text>
<text x="429.7" y="966.0" font-size="13.5" fill="#993C1D" text-anchor="middle">状态不可信</text>
<rect x="663.3" y="916.0" width="423.3" height="62.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6"/>
<text x="875.0" y="944.0" font-size="19" fill="#712B13" font-weight="600" text-anchor="middle">restore 半途失败</text>
<text x="875.0" y="966.0" font-size="13.5" fill="#993C1D" text-anchor="middle">沙箱处在中间态</text>
<rect x="1108.7" y="916.0" width="423.3" height="62.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.6"/>
<text x="1320.3" y="944.0" font-size="19" fill="#3C3489" font-weight="600" text-anchor="middle">状态文件写失败</text>
<text x="1320.3" y="966.0" font-size="13.5" fill="#534AB7" text-anchor="middle">磁盘上的那份落后了</text>
<text x="68.0" y="1041.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">何时进入</text>
<rect x="218.0" y="994.0" width="423.3" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="429.7" y="1019.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">初始化或加载失败</text>
<text x="429.7" y="1046.2" font-size="13" fill="#993C1D" text-anchor="middle">overlay 管理器初始化失败；state.json 读不了、解析不了、版</text>
<text x="429.7" y="1066.2" font-size="13" fill="#993C1D" text-anchor="middle">本不认识或记录的目录不存在</text>
<rect x="663.3" y="994.0" width="423.3" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="875.0" y="1029.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">restore 杀进程之后失败</text>
<text x="875.0" y="1056.2" font-size="13" fill="#993C1D" text-anchor="middle">上面第 2 段的 data_loss</text>
<rect x="1108.7" y="994.0" width="423.3" height="85.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1320.3" y="1029.3" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">最近一次写 state.json 失败</text>
<text x="1320.3" y="1056.2" font-size="13" fill="#534AB7" text-anchor="middle">内存里的状态是对的</text>
<text x="68.0" y="1157.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">怎么解除</text>
<rect x="218.0" y="1109.5" width="423.3" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="429.7" y="1144.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">重启 gsd</text>
<text x="429.7" y="1171.7" font-size="13" fill="#993C1D" text-anchor="middle">重启后重新判断；fatal 下不写状态文件、不回收镜像</text>
<rect x="663.3" y="1109.5" width="423.3" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="875.0" y="1134.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">一次成功的 restore</text>
<text x="875.0" y="1161.7" font-size="13" fill="#993C1D" text-anchor="middle">clearRestoreFailure；原因存进 state.json 的</text>
<text x="875.0" y="1181.7" font-size="13" fill="#993C1D" text-anchor="middle">restore_failure，跨 gsd 重启保留</text>
<rect x="1108.7" y="1109.5" width="423.3" height="85.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1320.3" y="1144.8" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">任何一次写成功</text>
<text x="1320.3" y="1171.7" font-size="13" fill="#534AB7" text-anchor="middle">重启后按磁盘上的旧文件加载</text>
<line x1="68" y1="1227.0" x2="1532" y2="1227.0" stroke="#D3D1C7" stroke-width="1"/>
<text x="68.0" y="1261.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="start">各操作是否放行</text>
<rect x="62.0" y="1279.0" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="1307.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">checkpoint</text>
<text x="429.7" y="1307.0" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">拒</text>
<text x="875.0" y="1307.0" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">拒：中间态不能存成 checkpoint</text>
<text x="1320.3" y="1307.0" font-size="15" fill="#2C2C2A" text-anchor="middle">先重试写入，仍失败才拒</text>
<text x="68.0" y="1351.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">restore</text>
<text x="429.7" y="1351.0" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">拒</text>
<text x="875.0" y="1351.0" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">允许：回到完整状态的唯一手段</text>
<text x="1320.3" y="1351.0" font-size="15" fill="#2C2C2A" text-anchor="middle">先重试写入，仍失败才拒</text>
<rect x="62.0" y="1367.0" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
