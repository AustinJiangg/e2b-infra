<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1107" viewBox="0 0 1600 1107" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1107" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">restore 分两段：杀掉当前用户进程就是提交点</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">被杀掉的进程无法复原，所以 RestoreCheckpoint 把能提前做、又不改变任何东西的检查和准备，全部放到杀进程之前。提交点之前失败，调用方可以当它没发生过；之后失败返回 DataLoss，gsd 进入 degraded。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">执行顺序</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">第一段：杀进程之前</text>
<text x="290.0" y="184.0" font-size="14.5" fill="#888780" text-anchor="start">失败时什么都没动，返回普通错误，不进入 degraded</text>
<rect x="48.0" y="206.0" width="262.4" height="151.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="217.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="79.4" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="179.2" y="289.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">持操作锁 opMu</text>
<text x="179.2" y="317.0" font-size="14" fill="#5F5E5A" text-anchor="middle">与 checkpoint、delete 互斥</text>
<line x1="314.4" y1="281.8" x2="352.4" y2="281.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="358.4" y="206.0" width="262.4" height="151.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="370.4" y="217.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="389.8" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="489.6" y="268.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">检查健康状态，查条目</text>
<text x="489.6" y="296.0" font-size="14" fill="#5F5E5A" text-anchor="middle">checkReady(true)：上一次</text>
<text x="489.6" y="317.0" font-size="14" fill="#5F5E5A" text-anchor="middle">restore 半途失败不拦；目标不存在</text>
<text x="489.6" y="338.0" font-size="14" fill="#5F5E5A" text-anchor="middle">→ NotFound</text>
<line x1="624.8" y1="281.8" x2="662.8" y2="281.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="668.8" y="206.0" width="262.4" height="151.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="680.8" y="217.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="700.2" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="800.0" y="278.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">逐棵检查镜像与父链</text>
<text x="800.0" y="306.5" font-size="14" fill="#5F5E5A" text-anchor="middle">checkImages：inventory.img 可</text>
<text x="800.0" y="327.5" font-size="14" fill="#5F5E5A" text-anchor="middle">读，沿 parent 链一路查到底</text>
<line x1="935.2" y1="281.8" x2="973.2" y2="281.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="979.2" y="206.0" width="262.4" height="151.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="991.2" y="217.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1010.6" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="1110.4" y="278.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">PrepareRestore</text>
<text x="1110.4" y="306.5" font-size="14" fill="#5F5E5A" text-anchor="middle">预检选项串长度、检查层目录、建好</text>
<text x="1110.4" y="327.5" font-size="14" fill="#5F5E5A" text-anchor="middle">新的 upper 与 work</text>
<line x1="1245.6" y1="281.8" x2="1283.6" y2="281.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1289.6" y="206.0" width="262.4" height="151.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1301.6" y="217.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1321.0" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="1420.8" y="278.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">扫描 /proc</text>
<text x="1420.8" y="306.5" font-size="14" fill="#5F5E5A" text-anchor="middle">列出全部用户进程；紧挨着杀进程，</text>
<text x="1420.8" y="327.5" font-size="14" fill="#5F5E5A" text-anchor="middle">结果直接当第一轮</text>
<rect x="48.0" y="373.5" width="1504.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="800.0" y="399.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">以上失败：错误信息带 nothing was changed，错误码 NotFound / FailedPrecondition / ResourceExhausted / Internal</text>
<line x1="48" y1="447.5" x2="1552" y2="447.5" stroke="#D85A30" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="619.5" y="430.5" width="361.1" height="34.0" rx="17" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.4"/>
<text x="800.0" y="453.0" font-size="15" fill="#D85A30" font-weight="600" text-anchor="middle">提交点：从这里起无法回到 restore 之前的状态</text>
<circle cx="63" cy="503.5" r="15" fill="#2C2C2A"/>
<text x="63.0" y="509.0" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="510.5" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">杀进程</text>
<rect x="170.0" y="493.5" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="207.0" y="509.5" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<text x="260.0" y="509.5" font-size="14.5" fill="#888780" text-anchor="start">不管目标有没有进程镜像，当前用户进程一律杀掉</text>
<rect x="48.0" y="531.5" width="728.0" height="145.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="542.5" width="106.4" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="113.2" y="558.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd → 用户进程</text>
<rect x="60.0" y="643.0" width="704.0" height="26.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="412.0" y="660.0" font-size="13" fill="#3C3489" font-weight="500" text-anchor="middle">没有用户进程时跳过</text>
<text x="412.0" y="593.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">killTrees</text>
<text x="412.0" y="621.5" font-size="14" fill="#5F5E5A" text-anchor="middle">先冻住，反复扫描到没有新进程，整体 SIGKILL，等进程号释放</text>
<line x1="780.0" y1="604.2" x2="818.0" y2="604.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="824.0" y="531.5" width="728.0" height="145.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="836.0" y="542.5" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="855.4" y="558.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="1188.0" y="611.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">清空 lastTrees</text>
<text x="1188.0" y="639.5" font-size="14" fill="#5F5E5A" text-anchor="middle">原来那些进程的 soft-dirty 历史不再有意义</text>
<rect x="48.0" y="693.0" width="1504.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="800.0" y="719.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">killTrees 报告的错误只记一条告警，restore 继续往下走：部分进程已经被杀，停下来不比做完更好</text>
<circle cx="63" cy="779.0" r="15" fill="#2C2C2A"/>
<text x="63.0" y="784.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="90.0" y="786.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">第二段：切换与恢复</text>
<text x="290.0" y="785.0" font-size="14.5" fill="#888780" text-anchor="start">以下失败：DataLoss，进入 degraded</text>
<rect x="48.0" y="807.0" width="340.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="818.0" width="120.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="120.4" y="833.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd → guest 内核</text>
<text x="218.0" y="878.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">CommitRestore</text>
<text x="218.0" y="906.8" font-size="14" fill="#5F5E5A" text-anchor="middle">restore 模式的切换 ioctl，lowerdir 是目标</text>
<text x="218.0" y="927.8" font-size="14" fill="#5F5E5A" text-anchor="middle">的完整层栈</text>
<line x1="392.0" y1="882.0" x2="430.0" y2="882.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="436.0" y="807.0" width="340.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="448.0" y="818.0" width="51.3" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="473.6" y="833.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">CRIU</text>
<text x="606.0" y="878.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">逐棵 criu restore</text>
<text x="606.0" y="906.8" font-size="14" fill="#5F5E5A" text-anchor="middle">按 dump 时的顺序串行；--restore-detached，</text>
<text x="606.0" y="927.8" font-size="14" fill="#5F5E5A" text-anchor="middle">按原进程号重建</text>
<line x1="780.0" y1="882.0" x2="818.0" y2="882.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="824.0" y="807.0" width="340.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="836.0" y="818.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="855.4" y="833.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="994.0" y="878.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">重建增量父镜像，解除 degraded</text>
<text x="994.0" y="906.8" font-size="14" fill="#5F5E5A" text-anchor="middle">用恢复出的根进程号与启动时间替换</text>
<text x="994.0" y="927.8" font-size="14" fill="#5F5E5A" text-anchor="middle">lastTrees；clearRestoreFailure</text>
<line x1="1168.0" y1="882.0" x2="1206.0" y2="882.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1212.0" y="807.0" width="340.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1224.0" y="818.0" width="38.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1243.4" y="833.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">gsd</text>
<text x="1382.0" y="889.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">写 state.json，放锁</text>
<text x="1382.0" y="917.3" font-size="14" fill="#5F5E5A" text-anchor="middle">由 defer 执行</text>
<rect x="48.0" y="973.0" width="1504.0" height="40.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="800.0" y="999.0" font-size="14.5" fill="#3C3489" font-weight="600" text-anchor="middle">以上失败：DataLoss，信息写明用户进程已经没了、文件系统处在 old 还是 target；degraded 期间 checkpoint 被拒绝，restore 和 delete 仍然允许，直到下一次 restore 成功</text>
<line x1="48" y1="1049.0" x2="1552" y2="1049.0" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1075.0" font-size="13" fill="#888780" text-anchor="start">注：唯一的例外是 CommitRestore 失败而 killTrees 一个进程都没杀（沙箱本来就没有用户进程）：进程没动、文件系统没切成，返回普通错误，不进入 degraded。没有进程镜像的目标到 CommitRestore 就结束。</text>
</svg>