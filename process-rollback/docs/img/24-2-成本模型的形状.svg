<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="724" viewBox="0 0 1600 724" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
</defs>
<rect width="1600" height="724" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">两套 restore 的耗时由不同的量决定：沙箱级看回滚量，进程级看进程大小和树数</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">示意图：只画随什么增长，没有数值刻度；两条线的高低和交点不表示哪套更快。R：restore 时当前状态与目标之间的回滚量；P：被保存的用户进程自己的内存大小（一棵树）；N：用户进程树的数量。</text>
<line x1="48" y1="123" x2="88" y2="123" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
<text x="98.0" y="128.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">沙箱级</text>
<line x1="178.5" y1="123" x2="218.5" y2="123" stroke="#7F77DD" stroke-width="3" stroke-linecap="round"/>
<text x="228.5" y="128.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">进程级（gsd）</text>
<circle cx="63" cy="176" r="15" fill="#2C2C2A"/>
<text x="63.0" y="181.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="183.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">每次只变一个量，看两套的 restore 怎么变</text>
<rect x="503.5" y="166.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="540.5" y="182.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<rect x="48.0" y="210.0" width="482.7" height="400.0" rx="12" fill="#FAFAF7" stroke="#E2E0D8" stroke-width="1"/>
<text x="66.0" y="238.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">横轴：回滚量 R</text>
<line x1="112.0" y1="476" x2="494.6666666666667" y2="476" stroke="#888780" stroke-width="1.4"/>
<line x1="112.0" y1="276" x2="112.0" y2="476" stroke="#888780" stroke-width="1.4"/>
<text x="100.0" y="282.0" font-size="13" fill="#888780" text-anchor="end">耗时</text>
<text x="494.7" y="502.0" font-size="13.5" fill="#5F5E5A" text-anchor="end">回滚量 R →</text>
<path d="M112.0 452.0 L494.7 376.0" fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
<circle cx="112.0" cy="452.0" r="4" fill="#1D9E75"/>
<circle cx="494.7" cy="376.0" r="4" fill="#1D9E75"/>
<path d="M112.0 344.0 L494.7 344.0" fill="none" stroke="#7F77DD" stroke-width="3" stroke-linecap="round"/>
<circle cx="112.0" cy="344.0" r="4" fill="#7F77DD"/>
<circle cx="494.7" cy="344.0" r="4" fill="#7F77DD"/>
<text x="66.0" y="538.0" font-size="14" fill="#0F6E56" font-weight="600" text-anchor="start">沙箱级：固定开销 + 与 R 成正比，退得近就快</text>
<text x="66.0" y="565.0" font-size="14" fill="#534AB7" font-weight="600" text-anchor="start">进程级：杀进程 + 与 P 成正比，与改动量无关，只退一步也要整个重建</text>
<rect x="558.7" y="210.0" width="482.7" height="400.0" rx="12" fill="#FAFAF7" stroke="#E2E0D8" stroke-width="1"/>
<text x="576.7" y="238.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">横轴：进程内存 P</text>
<line x1="622.6666666666667" y1="476" x2="1005.3333333333335" y2="476" stroke="#888780" stroke-width="1.4"/>
<line x1="622.6666666666667" y1="276" x2="622.6666666666667" y2="476" stroke="#888780" stroke-width="1.4"/>
<text x="610.7" y="282.0" font-size="13" fill="#888780" text-anchor="end">耗时</text>
<text x="1005.3" y="502.0" font-size="13.5" fill="#5F5E5A" text-anchor="end">进程内存 P →</text>
<path d="M622.7 396.0 L1005.3 396.0" fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
<circle cx="622.7" cy="396.0" r="4" fill="#1D9E75"/>
<circle cx="1005.3" cy="396.0" r="4" fill="#1D9E75"/>
<path d="M622.7 452.0 L1005.3 300.0" fill="none" stroke="#7F77DD" stroke-width="3" stroke-linecap="round"/>
<circle cx="622.7" cy="452.0" r="4" fill="#7F77DD"/>
<circle cx="1005.3" cy="300.0" r="4" fill="#7F77DD"/>
<text x="576.7" y="538.0" font-size="14" fill="#0F6E56" font-weight="600" text-anchor="start">沙箱级：R 不变时，与进程多大无关</text>
<text x="576.7" y="565.0" font-size="14" fill="#534AB7" font-weight="600" text-anchor="start">进程级：重建时读回全部内存，杀进程也随内存增长</text>
<rect x="1069.3" y="210.0" width="482.7" height="400.0" rx="12" fill="#FAFAF7" stroke="#E2E0D8" stroke-width="1"/>
<text x="1087.3" y="238.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">横轴：进程树数量 N</text>
<line x1="1133.3333333333335" y1="476" x2="1516.0000000000002" y2="476" stroke="#888780" stroke-width="1.4"/>
<line x1="1133.3333333333335" y1="276" x2="1133.3333333333335" y2="476" stroke="#888780" stroke-width="1.4"/>
<text x="1121.3" y="282.0" font-size="13" fill="#888780" text-anchor="end">耗时</text>
<text x="1516.0" y="502.0" font-size="13.5" fill="#5F5E5A" text-anchor="end"></text>
<line x1="1209.9" y1="476" x2="1209.9" y2="482" stroke="#888780" stroke-width="1.2"/>
<text x="1209.9" y="502.0" font-size="13.5" fill="#5F5E5A" text-anchor="middle">1</text>
<line x1="1305.5" y1="476" x2="1305.5" y2="482" stroke="#888780" stroke-width="1.2"/>
<text x="1305.5" y="502.0" font-size="13.5" fill="#5F5E5A" text-anchor="middle">2</text>
<line x1="1401.2" y1="476" x2="1401.2" y2="482" stroke="#888780" stroke-width="1.2"/>
<text x="1401.2" y="502.0" font-size="13.5" fill="#5F5E5A" text-anchor="middle">3</text>
<line x1="1500.7" y1="476" x2="1500.7" y2="482" stroke="#888780" stroke-width="1.2"/>
<text x="1500.7" y="502.0" font-size="13.5" fill="#5F5E5A" text-anchor="middle">N →</text>
<path d="M1209.9 406.0 L1500.7 406.0" fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
<circle cx="1209.9" cy="406.0" r="4" fill="#1D9E75"/>
<circle cx="1500.7" cy="406.0" r="4" fill="#1D9E75"/>
<path d="M1209.9 416.0 L1305.5 366.0 L1401.2 316.0" fill="none" stroke="#7F77DD" stroke-width="3" stroke-linecap="round"/>
<circle cx="1209.9" cy="416.0" r="4" fill="#7F77DD"/>
<circle cx="1305.5" cy="366.0" r="4" fill="#7F77DD"/>
<circle cx="1401.2" cy="316.0" r="4" fill="#7F77DD"/>
<path d="M1401.2 316.0 L1500.7 280.0" fill="none" stroke="#7F77DD" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="1087.3" y="538.0" font-size="14" fill="#0F6E56" font-weight="600" text-anchor="start">沙箱级：与树数无关</text>
<text x="1087.3" y="565.0" font-size="14" fill="#534AB7" font-weight="600" text-anchor="start">进程级：逐棵串行，checkpoint 和 restore 都随 N 线性增长</text>
<text x="1087.3" y="592.0" font-size="14" fill="#888780" text-anchor="start">虚线：依据只到三棵树</text>
<line x1="48" y1="646" x2="1552" y2="646" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="672.0" font-size="13" fill="#888780" text-anchor="start">注：checkpoint 两套都随改动量增长，沙箱级与整台 guest 改过的内存量 D 成正比，进程级与其中属于用户进程的 d 成正比（d ≤ D）；两者的单位数据处理代价不同，不画在同一坐标里，实测见 §4。第一次 checkpoint 都是全量：沙箱级与 guest 内存 M</text>
<text x="48.0" y="692.0" font-size="13" fill="#888780" text-anchor="start">成正比，进程级与 P 成正比。文件一侧两套都不搬数据。</text>
</svg>