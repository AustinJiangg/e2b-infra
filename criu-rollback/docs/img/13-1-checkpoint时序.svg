<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1233" viewBox="0 0 1600 1233" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-back" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F6E56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1233" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">一次 checkpoint 的跨组件时序：请求进到 guest，由 gsd 独自完成</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">宿主代理只在最外圈转发；虚机全程不暂停，Firecracker 不参与。用户进程只在 CRIU 冻结到 SIGCONT 之间不运行。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">调用、读写</text>
<line x1="205.5" y1="125.0" x2="245.5" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="255.5" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">冻结用户进程</text>
<line x1="376.5" y1="125.0" x2="416.5" y2="125.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="426.5" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">返回、放开进程</text>
<rect x="59.0" y="156.0" width="191.7" height="58.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="154.8" y="181.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">Python SDK</text>
<text x="154.8" y="202.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">调用方</text>
<rect x="272.7" y="156.0" width="191.7" height="58.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="368.5" y="181.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">宿主代理</text>
<text x="368.5" y="202.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">只转发请求和响应</text>
<rect x="486.3" y="156.0" width="191.7" height="58.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.4"/>
<text x="582.2" y="181.0" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">gsd</text>
<text x="582.2" y="202.0" font-size="12.5" fill="#534AB7" text-anchor="middle">guest 里，编排全程</text>
<rect x="700.0" y="156.0" width="191.7" height="58.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.4"/>
<text x="795.8" y="181.0" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">CRIU</text>
<text x="795.8" y="202.0" font-size="12.5" fill="#534AB7" text-anchor="middle">每棵树一个子进程</text>
<rect x="913.7" y="156.0" width="191.7" height="58.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="1009.5" y="181.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">guest 内核</text>
<text x="1009.5" y="202.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">/proc、overlay 切换</text>
<rect x="1127.3" y="156.0" width="191.7" height="58.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="1223.2" y="181.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">用户进程树</text>
<text x="1223.2" y="202.0" font-size="12.5" fill="#5F5E5A" text-anchor="middle">回滚范围内的进程</text>
<text x="1360.0" y="181.0" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start">计时键</text>
<text x="1360.0" y="202.0" font-size="12.5" fill="#888780" text-anchor="start">gsd 在 guest 里自己量</text>
<line x1="154.8" y1="214" x2="154.8" y2="1119" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="368.5" y1="214" x2="368.5" y2="1119" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="582.2" y1="214" x2="582.2" y2="1119" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="795.8" y1="214" x2="795.8" y2="1119" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="1009.5" y1="214" x2="1009.5" y2="1119" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="1223.2" y1="214" x2="1223.2" y2="1119" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="261.7" y="250.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">CreateCheckpoint</text>
<line x1="157.8" y1="258.0" x2="364.5" y2="258.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="475.3" y="292.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">按端口 49984 原样转发</text>
<line x1="371.5" y1="300.0" x2="578.2" y2="300.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="795.8" y="334.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">读 MMDS，校验 access token</text>
<line x1="585.2" y1="342.0" x2="1005.5" y2="342.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="432.2" y="366.0" width="300.0" height="35.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="582.2" y="388.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">排队取操作锁，然后检查健康状态</text>
<text x="795.8" y="427.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">扫描 /proc，找根，记录各进程状态</text>
<line x1="585.2" y1="435.0" x2="1005.5" y2="435.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1360.0" y="439.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">find_pids_ms</text>
<rect x="432.2" y="459.0" width="300.0" height="35.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="582.2" y="481.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">多树预检、容量预检</text>
<text x="1360.0" y="484.5" font-size="13.5" fill="#5F5E5A" text-anchor="start">precheck_ms</text>
<rect x="483.3" y="510.0" width="838.7" height="32.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="902.7" y="531.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">以上什么都没动</text>
<text x="689.0" y="602.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">criu dump --leave-stopped</text>
<line x1="585.2" y1="610.0" x2="791.8" y2="610.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1009.5" y="644.0" font-size="13.5" fill="#D85A30" font-weight="600" text-anchor="middle">冻结，写镜像，清 soft-dirty，留在停止状态</text>
<line x1="798.8" y1="652.0" x2="1219.2" y2="652.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="689.0" y="686.0" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">退出码</text>
<line x1="792.8" y1="694.0" x2="586.2" y2="694.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<rect x="489.3" y="558.0" width="826.7" height="158.0" rx="8" fill="none" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="489.3" y="558.0" width="152.0" height="24.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="565.3" y="575.0" font-size="13" fill="#3C3489" font-weight="600" text-anchor="middle">逐棵：按根进程号升序</text>
<text x="1360.0" y="639.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">criu_dump_ms（各棵之和）</text>
<rect x="483.3" y="732.0" width="838.7" height="32.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.4"/>
<text x="902.7" y="753.0" font-size="14.5" fill="#3C3489" font-weight="600" text-anchor="middle">全部树停着</text>
<text x="795.8" y="790.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">upper 改名成层，再发 ckpt 模式的 ioctl</text>
<line x1="585.2" y1="798.0" x2="1005.5" y2="798.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1360.0" y="802.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">overlay_sink_ms</text>
<text x="795.8" y="832.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">对停着的进程写 clear_refs</text>
<line x1="585.2" y1="840.0" x2="1005.5" y2="840.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="902.7" y="874.0" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">SIGCONT</text>
<line x1="585.2" y1="882.0" x2="1219.2" y2="882.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<rect x="483.3" y="906.0" width="838.7" height="32.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="902.7" y="927.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">用户进程恢复运行</text>
<rect x="432.2" y="954.0" width="300.0" height="54.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="582.2" y="976.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">量镜像大小，更新增量父镜像，条目入池，</text>
<text x="582.2" y="995.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">组响应</text>
<rect x="432.2" y="1024.0" width="300.0" height="35.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="582.2" y="1046.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">defer：写 state.json，放锁</text>
<text x="368.5" y="1085.0" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">经代理返回 checkpoint_id 与 timings</text>
<line x1="579.2" y1="1093.0" x2="158.8" y2="1093.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<path d="M1518 694 H1526 V882 H1518" fill="none" stroke="#7F77DD" stroke-width="1.8"/>
<text x="1360.0" y="694.0" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="start">stopped_ms 起</text>
<text x="1360.0" y="882.0" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="start">stopped_ms 止</text>
<path d="M1544 383.5 H1552 V981.0 H1544" fill="none" stroke="#7F77DD" stroke-width="1.8"/>
<text x="1360.0" y="383.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="start">total_ms 起</text>
<text x="1360.0" y="981.0" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="start">total_ms 止</text>
<line x1="48" y1="1155" x2="1552" y2="1155" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1181.0" font-size="13" fill="#888780" text-anchor="start">注：total_ms 从拿到操作锁算起，stopped_ms 从第一棵树 dump 完算起。SDK 量到的墙钟时间 = 网络与代理 + 鉴权 + 排队 + total_ms，再加末尾写 state.json 的时间。stopped_ms 与 criu_dump_ms、overlay_sink_ms 有重叠，不能相加。各步骤</text>
<text x="48.0" y="1201.0" font-size="13" fill="#888780" text-anchor="start">的细节见第 11 章。</text>
</svg>