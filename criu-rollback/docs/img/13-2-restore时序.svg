<line x1="1009.5" y1="214" x2="1009.5" y2="1010" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="1223.2" y1="214" x2="1223.2" y2="1010" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="261.7" y="250.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">RestoreCheckpoint</text>
<line x1="157.8" y1="258.0" x2="364.5" y2="258.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="475.3" y="292.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">按端口 49984 原样转发</text>
<line x1="371.5" y1="300.0" x2="578.2" y2="300.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="795.8" y="334.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">读 MMDS，校验 access token</text>
<line x1="585.2" y1="342.0" x2="1005.5" y2="342.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="432.2" y="366.0" width="300.0" height="35.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="582.2" y="388.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">排队取操作锁，检查健康状态，查条目</text>
<rect x="432.2" y="417.0" width="300.0" height="35.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="582.2" y="439.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">检查镜像与父链，建好新的 upper 与 work</text>
<text x="1360.0" y="442.5" font-size="13.5" fill="#5F5E5A" text-anchor="start">precheck_ms</text>
<text x="795.8" y="478.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">扫描 /proc，列出全部用户进程</text>
<line x1="585.2" y1="486.0" x2="1005.5" y2="486.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1360.0" y="490.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">find_pids_ms</text>
<rect x="483.3" y="510.0" width="838.7" height="32.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="902.7" y="531.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">以上什么都没动</text>
<text x="902.7" y="568.0" font-size="13.5" fill="#D85A30" font-weight="600" text-anchor="middle">先 SIGSTOP 冻住，清点，再 SIGKILL，等进程号释放</text>
<line x1="585.2" y1="576.0" x2="1219.2" y2="576.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="1360.0" y="580.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">kill_ms</text>
<rect x="483.3" y="600.0" width="838.7" height="32.0" rx="8" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.4"/>
<text x="902.7" y="621.0" font-size="14.5" fill="#D85A30" font-weight="600" text-anchor="middle">提交点：之后的失败都是 DataLoss</text>
<text x="795.8" y="658.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">restore 模式的 ioctl，切回目标层栈</text>
<line x1="585.2" y1="666.0" x2="1005.5" y2="666.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1360.0" y="670.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">overlay_restore_ms</text>
<text x="689.0" y="734.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">criu restore --restore-detached</text>
<line x1="585.2" y1="742.0" x2="791.8" y2="742.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1009.5" y="776.0" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">按原进程号重建，写回内存，重新打开文件</text>
<line x1="798.8" y1="784.0" x2="1219.2" y2="784.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="689.0" y="818.0" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">退出码与根进程号</text>
<line x1="792.8" y1="826.0" x2="586.2" y2="826.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<rect x="489.3" y="690.0" width="826.7" height="158.0" rx="8" fill="none" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="489.3" y="690.0" width="164.2" height="24.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="571.4" y="707.0" font-size="13" fill="#3C3489" font-weight="600" text-anchor="middle">逐棵：按 dump 时的顺序</text>
<text x="1360.0" y="771.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">criu_restore_ms（各棵之和）</text>
<rect x="432.2" y="864.0" width="300.0" height="35.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="582.2" y="886.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">重建增量父镜像，解除 degraded，组响应</text>
<rect x="432.2" y="915.0" width="300.0" height="35.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="582.2" y="937.0" font-size="13.5" fill="#2C2C2A" text-anchor="middle">defer：写 state.json，放锁</text>
<text x="368.5" y="976.0" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">经代理返回 success 与 timings</text>
<line x1="579.2" y1="984.0" x2="158.8" y2="984.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<path d="M1544 383.5 H1552 V881.5 H1544" fill="none" stroke="#7F77DD" stroke-width="1.8"/>
<text x="1360.0" y="383.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="start">total_ms 起</text>
<text x="1360.0" y="881.5" font-size="13.5" fill="#3C3489" font-weight="600" text-anchor="start">total_ms 止</text>
<line x1="48" y1="1046" x2="1552" y2="1046" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1072.0" font-size="13" fill="#888780" text-anchor="start">注：total_ms 从拿到操作锁算起。precheck_ms 与 find_pids_ms 在 restore 里的顺序与 checkpoint 相反、内容也不同，不要跨操作比较。目标没有进程镜像时，切换文件系统之后就结束，没有 criu restore。各步骤的细节见第 12 章。</text>
</svg>