<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">950 同机：两套方案的增量 checkpoint 与 restore 客户端墙钟随档位变化</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">950（Kunpeng 950 7592C），2026-11-17 test950.sh standard 同一轮：沙箱级 16:48 起，进程级 17:03 起。客户端墙钟，单位 ms；进程级取三轮中位数。沙箱级每档 n = 30（0～</text>
<text x="48.0" y="120.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">32 MiB）、20（64～256 MiB）；进程级每档 n = 3。两侧的内存与文件负载、沙箱与次序、模板和脏页后端（hdbss 与 soft-dirty）都不同（§4.6），图中的高低只描述这组实测。</text>
