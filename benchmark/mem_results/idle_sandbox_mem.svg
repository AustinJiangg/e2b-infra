<text x="728.3" y="392.0" font-size="15.5" fill="#0C447C" font-weight="600" text-anchor="start">orchestrator 所在的 Nomad cgroup · 194 MiB</text>
<text x="1090.2" y="392.0" font-size="13.5" fill="#888780" text-anchor="start">计入 memory.max = 32 GiB，超了会 OOM</text>
