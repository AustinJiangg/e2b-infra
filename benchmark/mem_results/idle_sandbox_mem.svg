<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1399" viewBox="0 0 1600 1399" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
</defs>
<rect width="1600" height="1399" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">空闲 2U2G 沙箱：每个让宿主机多用约 350 MiB，并发先撞上 orchestrator 的 32 GiB 内存上限</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">base 模板（ubuntu 22.04 + envd，cpu_count=2，memory_mb=2048）· 宿主机 2.4 TiB 内存，静态大页池 200064 × 2 MiB · 2026-11-10 两轮实测，N = 1、10、50，每次空闲 300 s，全部在宿主机侧读数</text>
<rect x="48.0" y="128.0" width="361.0" height="138.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="68.0" y="174.0" font-size="30" fill="#085041" font-weight="700" text-anchor="start">350 MiB</text>
<text x="68.0" y="204.0" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start">每个空闲沙箱的边际内存</text>
<text x="68.0" y="228.0" font-size="13" fill="#0F6E56" text-anchor="start">大页 157 + cgroup 普通内存 194；三个 N 拟合，偏差</text>
<text x="68.0" y="247.0" font-size="13" fill="#0F6E56" text-anchor="start">≤ 4 MiB</text>
<rect x="429.0" y="128.0" width="361.0" height="138.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="449.0" y="174.0" font-size="30" fill="#085041" font-weight="700" text-anchor="start">157 / 2048</text>
<text x="449.0" y="204.0" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start">客户机内存真正落地的 MiB</text>
<text x="449.0" y="228.0" font-size="13" fill="#0F6E56" text-anchor="start">memory_mb 只是上限；按需缺页，不预留</text>
<rect x="810.0" y="128.0" width="361.0" height="138.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="830.0" y="174.0" font-size="30" fill="#712B13" font-weight="700" text-anchor="start">≈ 89 个</text>
<text x="830.0" y="204.0" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start">orchestrator cgroup 到 32 GiB</text>
<text x="830.0" y="228.0" font-size="13" fill="#993C1D" text-anchor="start">开始回收旧缓存；超过约 167 个就要回收沙箱自己在</text>
<text x="830.0" y="247.0" font-size="13" fill="#993C1D" text-anchor="start">用的页</text>
<rect x="1191.0" y="128.0" width="361.0" height="138.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="1211.0" y="174.0" font-size="30" fill="#712B13" font-weight="700" text-anchor="start">32 + 0.19·X GiB</text>
<text x="1211.0" y="204.0" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start">template-manager 的 memory 建议</text>
<text x="1211.0" y="228.0" font-size="13" fill="#993C1D" text-anchor="start">X = 目标空闲沙箱数；有负载的沙箱还要更多</text>
<circle cx="63" cy="312" r="15" fill="#2C2C2A"/>
<text x="63.0" y="317.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="319.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">一个空闲沙箱的 350 MiB 记在两本账上</text>
<text x="464.1" y="318.0" font-size="14.5" fill="#888780" text-anchor="start">每段都是对 N = 1、10、50 拟合出的斜率</text>
