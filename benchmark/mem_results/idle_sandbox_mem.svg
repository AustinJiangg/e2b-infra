<rect x="356.2" y="611.0" width="1185.8" height="30.0" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="949.1" y="631.0" font-size="13.5" fill="#888780" text-anchor="middle">1891 MiB 映射了但客户机没碰过，不占物理内存（HugePages_Rsvd 增量 = 0）</text>
<circle cx="63" cy="687" r="15" fill="#2C2C2A"/>
<text x="63.0" y="692.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="694.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">为什么能按“每个沙箱”算，以及按这个速度多少个会出问题</text>
<text x="48.0" y="749.0" font-size="17" fill="#2C2C2A" font-weight="600" text-anchor="start">增量随 N 严格线性：斜率 = 每多一个沙箱的成本</text>
<text x="48.0" y="773.0" font-size="13.5" fill="#888780" text-anchor="start">每个点是一次实测（T2 时刻相对基线的增量）；直线是最小二乘拟合，截距 12 MiB ≈ 没有一次性开销</text>
<text x="828.0" y="749.0" font-size="17" fill="#2C2C2A" font-weight="600" text-anchor="start">沙箱越多，orchestrator cgroup 越接近 32 GiB</text>
<text x="828.0" y="773.0" font-size="13.5" fill="#888780" text-anchor="start">按 N=50 那次的基线：cgroup 里已有 14.8 GiB 可回收的旧缓存，0.24 GiB 匿名内存</text>
