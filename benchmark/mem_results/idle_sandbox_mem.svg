<text x="66.0" y="515.0" font-size="14.5" fill="#085041" font-weight="600" text-anchor="start">客户机内存（大页）  156.6 MiB</text>
<text x="66.0" y="539.0" font-size="13" fill="#5F5E5A" text-anchor="start">firecracker smaps 直接读到；72 个沙箱都</text>
<text x="66.0" y="558.0" font-size="13" fill="#5F5E5A" text-anchor="start">在 152–162</text>
<rect x="351.6" y="498.0" width="6.0" height="70.0" rx="3" fill="#7F77DD" stroke="#7F77DD" stroke-width="0"/>
<text x="369.6" y="515.0" font-size="14.5" fill="#3C3489" font-weight="600" text-anchor="start">沙箱目录文件页  62.4 MiB</text>
<text x="369.6" y="539.0" font-size="13" fill="#5F5E5A" text-anchor="start">orchestrator mmap 的</text>
<text x="369.6" y="558.0" font-size="13" fill="#5F5E5A" text-anchor="start">/orchestrator/sandbox 下每个沙箱的文</text>
<text x="369.6" y="577.0" font-size="13" fill="#5F5E5A" text-anchor="start">件，与目录大小一致</text>
<rect x="655.2" y="498.0" width="6.0" height="70.0" rx="3" fill="#BA7517" stroke="#BA7517" stroke-width="0"/>
<text x="673.2" y="515.0" font-size="14.5" fill="#633806" font-weight="600" text-anchor="start">其他 page cache  104.8 MiB</text>
<text x="673.2" y="539.0" font-size="13" fill="#5F5E5A" text-anchor="start">非 mmap 的文件缓存，推测来自 rootfs 读</text>
<text x="673.2" y="558.0" font-size="13" fill="#5F5E5A" text-anchor="start">写，未逐项确认</text>
<rect x="958.8" y="498.0" width="6.0" height="70.0" rx="3" fill="#378ADD" stroke="#378ADD" stroke-width="0"/>
<text x="976.8" y="515.0" font-size="14.5" fill="#0C447C" font-weight="600" text-anchor="start">匿名内存  22.3 MiB</text>
<text x="976.8" y="539.0" font-size="13" fill="#5F5E5A" text-anchor="start">orchestrator 堆约 20、firecracker 约</text>
<text x="976.8" y="558.0" font-size="13" fill="#5F5E5A" text-anchor="start">2；关闭后几分钟回落</text>
<rect x="1262.4" y="498.0" width="6.0" height="70.0" rx="3" fill="#B4B2A9" stroke="#B4B2A9" stroke-width="0"/>
<text x="1280.4" y="515.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">其他  4.2 MiB</text>
<text x="1280.4" y="539.0" font-size="13" fill="#5F5E5A" text-anchor="start">内核对象等，= current − anon − file</text>
<text x="48.0" y="624.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">客户机看到的 2048 MiB</text>
<text x="48.0" y="643.0" font-size="12.5" fill="#888780" text-anchor="start">memory_mb = 2048</text>
