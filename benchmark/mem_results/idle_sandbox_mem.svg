<text x="189.6" y="392.0" font-size="13.5" fill="#888780" text-anchor="start">不计入任何 cgroup</text>
<line x1="727.3" y1="404.0" x2="1551.0" y2="404.0" stroke="#378ADD" stroke-width="2"/>
