<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">x86 原生和本方案只把写过的页算脏；ARM 适配基线的判据塌缩成“常驻”，只读过的页也进了增量。这是修复 ARM 适配引入的退化，不是超越 x86 原生。</text>
