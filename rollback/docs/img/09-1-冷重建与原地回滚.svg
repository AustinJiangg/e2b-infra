<text x="68.0" y="1513.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">GIC 设备 fd</text>
<text x="542.5" y="1513.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">新建</text>
<text x="1209.5" y="1513.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">保留</text>
<rect x="62.0" y="1529.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="1557.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">eventfd / irqfd / ioeventfd 注册</text>
<text x="542.5" y="1557.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">全部重做</text>
<text x="1209.5" y="1557.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">保留</text>
<text x="68.0" y="1601.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">tap 设备、网络槽位</text>
<text x="542.5" y="1601.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">重建</text>
<text x="1209.5" y="1601.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">保留</text>
<rect x="62.0" y="1617.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="1645.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">guest 内存映射</text>
