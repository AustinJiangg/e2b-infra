<text x="1209.5" y="830.7" font-size="13" fill="#0F6E56" text-anchor="middle">只处理回滚集里的页</text>
<line x1="1209.5" y1="846.0" x2="1209.5" y2="873.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="878.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="903.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">vCPU / GIC / 设备状态写回既有对象</text>
