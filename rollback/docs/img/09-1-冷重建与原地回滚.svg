<text x="1209.5" y="604.8" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">校验、静默 I/O</text>
<text x="1209.5" y="631.7" font-size="13" fill="#0F6E56" text-anchor="middle">拓扑一致、内存文件覆盖回滚集；排空在途设备 I/O</text>
<line x1="1209.5" y1="647.0" x2="1209.5" y2="674.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="679.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="704.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">算回滚集</text>
<text x="1209.5" y="731.2" font-size="13" fill="#0F6E56" text-anchor="middle">活跃脏页 ∪ 调用方给的累积集合</text>
<line x1="1209.5" y1="746.5" x2="1209.5" y2="773.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
