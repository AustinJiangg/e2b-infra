<text x="542.5" y="1777.5" font-size="15" fill="#2C2C2A" text-anchor="middle">虚机规格与工作集</text>
<text x="1209.5" y="1777.5" font-size="15" fill="#2C2C2A" text-anchor="middle">回滚集大小</text>
<line x1="48" y1="1851.5" x2="1552" y2="1851.5" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1877.5" font-size="13" fill="#888780" text-anchor="start">注：原生 resume 适合跨节点迁移、长期持久化、进程崩溃后恢复、沙箱离场后再回来；原地回滚服务活沙箱内的高频回退。两者并存，本方案没有改动原生的恢复路径。</text>
