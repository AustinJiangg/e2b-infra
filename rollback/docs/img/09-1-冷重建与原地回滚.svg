<line x1="192.0" y1="125.0" x2="232.0" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="242.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">恢复之后仍要付的代价</text>
<line x1="417.0" y1="125.0" x2="457.0" y2="125.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="467.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">直接继续运行</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">两条恢复路径</text>
