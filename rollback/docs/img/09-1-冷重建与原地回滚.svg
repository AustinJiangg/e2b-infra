<rect x="220.0" y="224.0" width="645.0" height="62.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6"/>
<text x="542.5" y="252.0" font-size="19" fill="#712B13" font-weight="600" text-anchor="middle">冷重建：原生 resume</text>
<text x="542.5" y="274.0" font-size="13.5" fill="#993C1D" text-anchor="middle">Factory.ResumeSandbox 新建进程加载快照</text>
<rect x="887.0" y="224.0" width="645.0" height="62.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.6"/>
<text x="1209.5" y="252.0" font-size="19" fill="#085041" font-weight="600" text-anchor="middle">原地回滚：本方案 restore</text>
<text x="1209.5" y="274.0" font-size="13.5" fill="#0F6E56" text-anchor="middle">往活着的 Firecracker 进程里写回差异</text>
<text x="68.0" y="340.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">恢复前</text>
<rect x="260.0" y="302.0" width="565.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="327.8" font-size="16" fill="#712B13" font-weight="600" text-anchor="middle">沙箱已离场</text>
<text x="542.5" y="354.7" font-size="13" fill="#993C1D" text-anchor="middle">旧 Firecracker 进程已停，快照在本地缓存或对象存储</text>
<rect x="927.0" y="302.0" width="565.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="327.8" font-size="16" fill="#085041" font-weight="600" text-anchor="middle">沙箱活着，虚机已暂停</text>
<text x="1209.5" y="354.7" font-size="13" fill="#0F6E56" text-anchor="middle">同一个 Firecracker 进程，宿主资源都在</text>
<text x="68.0" y="429.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">触发</text>
<rect x="220.0" y="398.0" width="1312.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="876.0" y="430.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">回到一个快照：原生 Sandbox.connect() 触发 resume / 本方案调用 restore</text>
<text x="68.0" y="866.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">恢复做什么</text>
<rect x="220.0" y="480.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="505.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">新建 Firecracker 进程</text>
<text x="542.5" y="532.2" font-size="13" fill="#993C1D" text-anchor="middle">对外 SandboxID 不变，底下是全新进程</text>
<line x1="542.5" y1="547.5" x2="542.5" y2="574.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="220.0" y="579.5" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="617.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">建 KVM VM、vCPU、GIC、virtio 设备</text>
<line x1="542.5" y1="647.0" x2="542.5" y2="674.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="220.0" y="679.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="717.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">注册 eventfd / irqfd / ioeventfd</text>
<line x1="542.5" y1="746.5" x2="542.5" y2="773.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="220.0" y="778.5" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="816.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">建 tap、分配网络槽位</text>
<line x1="542.5" y1="846.0" x2="542.5" y2="873.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="220.0" y="878.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="903.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">起 UFFD handler，挂上 guest 内存</text>
<text x="542.5" y="930.2" font-size="13" fill="#993C1D" text-anchor="middle">新进程的 guest 内存映射是空的</text>
<line x1="542.5" y1="945.5" x2="542.5" y2="972.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="220.0" y="977.5" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="1002.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">建 NBD 设备 + Overlay</text>
<text x="542.5" y="1029.7" font-size="13" fill="#993C1D" text-anchor="middle">模板 rootfs + 新写层</text>
<line x1="542.5" y1="1045.0" x2="542.5" y2="1072.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="220.0" y="1077.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="1102.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">加载 snapfile</text>
<text x="542.5" y="1129.2" font-size="13" fill="#993C1D" text-anchor="middle">恢复 vCPU、GIC、设备状态</text>
<line x1="542.5" y1="1144.5" x2="542.5" y2="1171.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="220.0" y="1176.5" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
