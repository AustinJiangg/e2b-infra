<rect width="1600" height="1909" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">回到一个快照：原生 resume 重建整台虚机，原地回滚只写回差异</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">原生 resume 新建 Firecracker 进程，宿主资源全部重做，工作集靠缺页换回；原地回滚往同一个进程的活对象上写，代价正比于回滚集大小，与虚机规格无关。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
