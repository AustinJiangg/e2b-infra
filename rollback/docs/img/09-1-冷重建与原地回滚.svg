<text x="542.5" y="1689.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">靠缺页重新换入</text>
<text x="1209.5" y="1689.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">留在物理内存里</text>
<rect x="62.0" y="1705.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="1733.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">NBD 设备、Overlay</text>
<text x="542.5" y="1733.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">重建</text>
