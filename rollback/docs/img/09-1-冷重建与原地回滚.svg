<text x="1209.5" y="532.2" font-size="13" fill="#0F6E56" text-anchor="middle">回滚在 VMM 线程上执行</text>
<line x1="1209.5" y1="547.5" x2="1209.5" y2="574.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
