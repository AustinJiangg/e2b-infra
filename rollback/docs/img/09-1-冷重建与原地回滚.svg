<rect x="887.0" y="977.5" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="1002.8" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">切磁盘视图</text>
<text x="1209.5" y="1029.7" font-size="13" fill="#0F6E56" text-anchor="middle">NBD 设备、Overlay 保留，只换视图</text>
<line x1="1209.5" y1="1045.0" x2="1209.5" y2="1072.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="1077.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="1102.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">恢复运行</text>
<text x="1209.5" y="1129.2" font-size="13" fill="#0F6E56" text-anchor="middle">一个宿主资源都不重建</text>
<line x1="1209.5" y1="452.0" x2="1209.5" y2="475.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="68.0" y="1319.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">运行之后</text>
<rect x="220.0" y="1272.0" width="645.0" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="1297.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">guest 逐页缺页，把工作集换回内存</text>
<text x="542.5" y="1324.2" font-size="13" fill="#993C1D" text-anchor="middle">缺页 → UFFD handler → 查本地缓存 → 没有就按 header 从对象存储拉那一块；prefetch 按上次缺页</text>
<text x="542.5" y="1344.2" font-size="13" fill="#993C1D" text-anchor="middle">顺序提前拉，只能缓解</text>
<line x1="542.5" y1="1244.0" x2="542.5" y2="1267.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="554.5" y="1260.5" font-size="13" fill="#D85A30" font-weight="600" text-anchor="start">落在业务的第一批请求上</text>
<rect x="887.0" y="1272.0" width="645.0" height="85.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="1307.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">工作集留在物理内存里</text>
<text x="1209.5" y="1334.2" font-size="13" fill="#0F6E56" text-anchor="middle">没被回退的页原封不动，guest 访问它们不缺页</text>
<line x1="1209.5" y1="1144.5" x2="1209.5" y2="1267.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="1221.5" y="1210.8" font-size="13" fill="#0F6E56" font-weight="600" text-anchor="start">直接继续</text>
