<text x="542.5" y="953.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">写进本地 cache 文件</text>
<text x="542.5" y="980.2" font-size="13" fill="#993C1D" text-anchor="middle">脏了多少就拷多少</text>
<rect x="220.0" y="1027.5" width="645.0" height="165.0" rx="10" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
<text x="542.5" y="1104.0" font-size="15" fill="#993C1D" font-weight="600" text-anchor="middle">沙箱此时只是暂停</text>
<text x="542.5" y="1126.0" font-size="15" fill="#993C1D" font-weight="600" text-anchor="middle">导出完就是产物</text>
<line x1="542.5" y1="800.5" x2="542.5" y2="823.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="828.5" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1209.5" y="853.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">EjectLayers 摘出写层</text>
<text x="1209.5" y="880.7" font-size="13" fill="#993C1D" text-anchor="middle">Overlay 就此作废，之后任何写都没有去处</text>
<line x1="1209.5" y1="896.0" x2="1209.5" y2="923.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
