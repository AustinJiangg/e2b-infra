<text x="1209.5" y="685.0" font-size="13.5" fill="#993C1D" text-anchor="middle">pauseProcessRootfs → NBDProvider.ExportDiff</text>
<text x="68.0" y="760.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">哪些要存</text>
<rect x="220.0" y="713.0" width="645.0" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
