<text x="282.7" y="421.7" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">④ 取内存脏页集合</text>
<text x="282.7" y="449.5" font-size="14" fill="#993C1D" text-anchor="middle">问内存后端（UFFD）哪些页算脏</text>
<line x1="521.3" y1="414.2" x2="559.3" y2="414.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="565.3" y="341.5" width="469.3" height="145.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
