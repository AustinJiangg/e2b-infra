<text x="542.5" y="663.0" font-size="19" fill="#712B13" font-weight="600" text-anchor="middle">内存增量</text>
<text x="542.5" y="685.0" font-size="13.5" fill="#993C1D" text-anchor="middle">pauseProcessMemory</text>
<rect x="887.0" y="635.0" width="645.0" height="62.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6"/>
