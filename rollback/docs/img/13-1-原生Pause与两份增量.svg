<text x="1209.5" y="953.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">停沙箱，等 NBD 设备释放</text>
<text x="1209.5" y="980.2" font-size="13" fill="#993C1D" text-anchor="middle">closeSandbox 另起协程调 s.Close</text>
<line x1="1209.5" y1="995.5" x2="1209.5" y2="1022.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="1027.5" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
