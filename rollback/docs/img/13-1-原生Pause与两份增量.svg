<text x="542.5" y="765.2" font-size="13" fill="#993C1D" text-anchor="middle">present（bit 63）= 1 且 uffd-wp（bit 57）= 0；GET /memory/dirty 先用 mincore 筛常驻页再读</text>
<text x="542.5" y="785.2" font-size="13" fill="#993C1D" text-anchor="middle">pagemap</text>
<rect x="887.0" y="713.0" width="645.0" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1209.5" y="748.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">写层里写过的块</text>
<text x="1209.5" y="775.2" font-size="13" fill="#993C1D" text-anchor="middle">Overlay 的写层；打过本方案 checkpoint 的沙箱先把全部层压平</text>
<text x="68.0" y="1015.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">怎么搬</text>
