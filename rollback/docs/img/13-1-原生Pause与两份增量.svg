<text x="1142.5" y="232.5" font-size="12" fill="#993C1D" font-weight="500" text-anchor="middle">Firecracker</text>
<text x="1317.3" y="268.2" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">③ 写出 snapfile</text>
<text x="1317.3" y="296.0" font-size="14" fill="#993C1D" text-anchor="middle">vCPU、GIC、设备状态，不含内存</text>
<rect x="48.0" y="341.5" width="469.3" height="145.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
