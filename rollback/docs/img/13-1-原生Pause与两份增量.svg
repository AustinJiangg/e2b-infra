<text x="48.0" y="1666.0" font-size="13" fill="#888780" text-anchor="start">注：ResumeSandbox 新建 Firecracker 进程、按 header 取块、工作集靠缺页换回的逐步重建见图 09-1；本方案的 checkpoint 不停虚机，写层原地封存，不搬数据（第 7 章）。</text>
