<text x="1209.5" y="1079.7" font-size="13" fill="#993C1D" text-anchor="middle">全零块只在 empty 位图记一位；非零块紧凑追加</text>
<line x1="1209.5" y1="1095.0" x2="1209.5" y2="1122.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="1127.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1209.5" y="1165.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">关闭写层</text>
<line x1="1209.5" y1="800.5" x2="1209.5" y2="823.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="68.0" y="1260.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">产物</text>
