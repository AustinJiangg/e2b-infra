<text x="800.0" y="296.0" font-size="14" fill="#993C1D" text-anchor="middle">此后 guest 不再产生新状态；之后一直没有 resume</text>
<line x1="1038.7" y1="260.8" x2="1076.7" y2="260.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
