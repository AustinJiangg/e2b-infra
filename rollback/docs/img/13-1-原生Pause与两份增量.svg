<text x="1145.2" y="368.0" font-size="12" fill="#993C1D" font-weight="500" text-anchor="middle">orchestrator</text>
<rect x="1094.7" y="453.0" width="445.3" height="26.0" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="1317.3" y="470.0" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle">这一步关掉沙箱</text>
<text x="1317.3" y="403.7" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">⑥ 导出磁盘增量</text>
<text x="1317.3" y="431.5" font-size="14" fill="#993C1D" text-anchor="middle">把写层导出成紧凑 diff；参数之一就是关掉沙箱</text>
<rect x="48.0" y="503.0" width="1504.0" height="40.0" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="800.0" y="529.0" font-size="14.5" fill="#712B13" font-weight="600" text-anchor="middle">Pause 的语义是「沙箱到此为止」：两个 RPC 都 defer stopSandboxAsync；Checkpoint RPC 里的「继续跑」是从新快照另起一个新进程，LifecycleID 换新</text>
<circle cx="63" cy="589.0" r="15" fill="#2C2C2A"/>
<text x="63.0" y="594.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="596.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">两份增量各存什么</text>
<rect x="270.0" y="579.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="307.0" y="595.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
