<text x="800.0" y="1350.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">ARM 适配基线注释掉了填页时带写保护位的几行，bit 57 恒为 0，判据塌缩成「常驻即脏」；本书交付的代码在跟踪开着时改用写跟踪位图按 4 KiB 页判脏（第 14 章）</text>
<circle cx="63" cy="1410.0" r="15" fill="#2C2C2A"/>
<text x="63.0" y="1415.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="90.0" y="1417.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">链式 header：每一块指向写它的那一代</text>
<text x="465.6" y="1416.0" font-size="14.5" fill="#888780" text-anchor="start">恢复时按 header 逐块寻址</text>
<rect x="48.0" y="1473.0" width="420.0" height="96.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="1484.0" width="101.2" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="110.6" y="1499.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<text x="258.0" y="1528.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">新 build 的 header</text>
<text x="258.0" y="1556.3" font-size="14" fill="#5F5E5A" text-anchor="middle">本次 Pause 产出；按区间记录每一块在哪</text>
<rect x="608.0" y="1438.0" width="944.0" height="74.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1080.0" y="1467.4" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">本次写过的块 → 本次的 diff 文件</text>
<text x="1080.0" y="1495.3" font-size="14" fill="#993C1D" text-anchor="middle">这一代 Pause 导出的紧凑增量</text>
<line x1="472.0" y1="1521.0" x2="602.0" y2="1475.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="608.0" y="1530.0" width="944.0" height="74.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1080.0" y="1559.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">没写过的块 → 上一代 build</text>
<text x="1080.0" y="1587.3" font-size="14" fill="#5F5E5A" text-anchor="middle">上一代的 header 里，这一块可能再往上指</text>
<line x1="472.0" y1="1521.0" x2="602.0" y2="1567.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
