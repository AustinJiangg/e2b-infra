<rect width="1600" height="1698" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">原生 Sandbox.Pause：暂停之后不再恢复，内存增量从进程里拷出，磁盘增量要先关掉沙箱</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">六步按执行顺序；产物是一份 snapfile 加两份紧凑增量，靠 header 逐块寻址。Pause 要等上传完成才返回，所以客户端看到的耗时包含停沙箱、导出和上传。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
