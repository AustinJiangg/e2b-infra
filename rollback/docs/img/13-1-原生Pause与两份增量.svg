<text x="542.5" y="853.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">process_vm_readv 读 Firecracker 进程内存</text>
<text x="542.5" y="880.7" font-size="13" fill="#993C1D" text-anchor="middle">脏区间组织成 RemoteIovec，按 IOV_MAX 和单次上限分批</text>
<line x1="542.5" y1="896.0" x2="542.5" y2="923.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
