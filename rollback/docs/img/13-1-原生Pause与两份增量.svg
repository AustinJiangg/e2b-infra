<text x="542.5" y="1247.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">紧凑 diff + 链式 header</text>
<text x="542.5" y="1274.7" font-size="13" fill="#993C1D" text-anchor="middle">只含脏块，按顺序排列；ToDiffHeader 把原 header 与本次脏块合成新 header</text>
<rect x="887.0" y="1222.5" width="645.0" height="65.5" rx="10" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.2"/>
<text x="1209.5" y="1247.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">紧凑 diff + 映射表</text>
<text x="1209.5" y="1274.7" font-size="13" fill="#993C1D" text-anchor="middle">存储偏移 ≠ 设备偏移，必须靠映射表换算</text>
<line x1="1209.5" y1="1194.5" x2="1209.5" y2="1217.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
