<rect width="1600" height="1374" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">请求发往沙箱，由宿主完成：checkpoint / restore 经过的四个层次</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">SDK 发请求，orchestrator 编排并持有账本，分叉的 Firecracker 读写内存与设备状态，KVM 和硬件提供脏页信息。Firecracker 进程全程不重建；①～④ 是贯穿全书的四处设计。</text>
<rect x="48.0" y="119.0" width="30.0" height="18.0" rx="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="88.0" y="133.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">本方案的部件：checkpoint 接口、拦截、编排、账本、Firecracker 扩展、产物目录</text>
<rect x="648.8" y="119.0" width="30.0" height="18.0" rx="5" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="688.8" y="133.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">沙箱原有的部件</text>
