<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="908" viewBox="0 0 1600 908" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-back" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F6E56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="908" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">一个沙箱的 checkpoint 构成一棵树：restore 不剪枝，任意两点之间直接跳</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">从 deps 分出两条分支：try-A 直接拍；try-B 是 restore 到 deps 之后拍的，挂在 deps 下面。接口只返回按时间排序的平表，父子关系由调用方自己记。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">父节点 → 子节点</text>
<line x1="241.0" y1="125.0" x2="281.0" y2="125.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="291.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">restore：跳到另一个 checkpoint</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">树与 list() 看到的平表</text>
<rect x="324.8" y="168.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="361.8" y="184.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<rect x="48.0" y="210.0" width="1040.0" height="430.0" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<text x="72.0" y="242.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="start">checkpoint 之间的实际父子关系</text>
<rect x="428.0" y="270.0" width="280.0" height="76.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="568.0" y="300.4" font-size="16.5" fill="#085041" font-weight="600" text-anchor="middle">deps</text>
<text x="568.0" y="328.3" font-size="14" fill="#0F6E56" text-anchor="middle">第一次 checkpoint，full</text>
<rect x="118.0" y="406.0" width="280.0" height="76.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="258.0" y="436.4" font-size="16.5" fill="#085041" font-weight="600" text-anchor="middle">try-A</text>
<text x="258.0" y="464.3" font-size="14" fill="#0F6E56" text-anchor="middle">从 deps 往下接着做，分支 A</text>
<rect x="738.0" y="406.0" width="280.0" height="76.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="878.0" y="425.9" font-size="16.5" fill="#085041" font-weight="600" text-anchor="middle">try-B</text>
<text x="878.0" y="453.8" font-size="14" fill="#0F6E56" text-anchor="middle">restore 到 deps 之后拍的；</text>
<text x="878.0" y="474.8" font-size="14" fill="#0F6E56" text-anchor="middle">incremental：相对 deps 的增量</text>
<rect x="738.0" y="540.0" width="280.0" height="76.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="878.0" y="583.9" font-size="16.5" fill="#085041" font-weight="600" text-anchor="middle">try-B-fixed</text>
<line x1="488.0" y1="348.0" x2="298.0" y2="401.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="648.0" y1="348.0" x2="838.0" y2="401.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="878.0" y1="484.0" x2="878.0" y2="535.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="734.0" y1="578.0" x2="258.0" y2="487.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="508.0" y="592.0" font-size="13.5" fill="#0F6E56" font-weight="600" text-anchor="middle">restore(try-A)：跨分支直接跳</text>
<rect x="1116.0" y="210.0" width="436.0" height="430.0" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<text x="1140.0" y="242.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="start">sbx.checkpoint.list() 返回的</text>
<text x="1140.0" y="266.0" font-size="13" fill="#888780" text-anchor="start">按时间排序的平表，CheckpointInfo 里没有父节点字段</text>
<rect x="1140.0" y="292.0" width="388.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1334.0" y="312.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">deps</text>
<text x="1334.0" y="339.4" font-size="13" fill="#0F6E56" text-anchor="middle">mem_mode = full</text>
<rect x="1140.0" y="366.0" width="388.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1334.0" y="399.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">try-A</text>
<rect x="1140.0" y="440.0" width="388.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1334.0" y="460.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">try-B</text>
<text x="1334.0" y="487.4" font-size="13" fill="#0F6E56" text-anchor="middle">mem_mode = incremental</text>
<rect x="1140.0" y="514.0" width="388.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1334.0" y="547.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">try-B-fixed</text>
<text x="1140.0" y="598.0" font-size="13.5" fill="#5F5E5A" font-weight="600" text-anchor="start">调用方自己记：parent = {try-A: deps, try-B: deps}</text>
<circle cx="63" cy="686" r="15" fill="#2C2C2A"/>
<text x="63.0" y="691.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="693.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">四条规则</text>
<text x="190.0" y="692.0" font-size="14.5" fill="#888780" text-anchor="start">这几条决定树怎么长出来</text>
<rect x="48.0" y="714.0" width="358.0" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="227.0" y="746.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">父节点</text>
<text x="227.0" y="774.0" font-size="14" fill="#5F5E5A" text-anchor="middle">拍下时沙箱所处的那个点：上一个 checkpoint，或</text>
<text x="227.0" y="795.0" font-size="14" fill="#5F5E5A" text-anchor="middle">上一次 restore 的目标</text>
<rect x="430.0" y="714.0" width="358.0" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="609.0" y="746.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">restore 不剪枝</text>
<text x="609.0" y="774.0" font-size="14" fill="#5F5E5A" text-anchor="middle">比目标更新的 checkpoint 原样保留，仍然可以</text>
<text x="609.0" y="795.0" font-size="14" fill="#5F5E5A" text-anchor="middle">restore 过去（前滚）</text>
<rect x="812.0" y="714.0" width="358.0" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="991.0" y="756.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">restore 之后再 checkpoint</text>
<text x="991.0" y="784.5" font-size="14" fill="#5F5E5A" text-anchor="middle">新节点挂在 restore 目标下面，树长出一条新分支</text>
<rect x="1194.0" y="714.0" width="358.0" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1373.0" y="746.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">任意两点之间直接跳</text>
<text x="1373.0" y="774.0" font-size="14" fill="#5F5E5A" text-anchor="middle">不管在不在同一条分支上；代价取决于两点之间被改</text>
<text x="1373.0" y="795.0" font-size="14" fill="#5F5E5A" text-anchor="middle">过的页有多少</text>
<line x1="48" y1="850.5" x2="1552" y2="850.5" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="876.5" font-size="13" fill="#888780" text-anchor="start">注：树只属于这一个沙箱的这一代：沙箱销毁、orchestrator 重启、经原生 pause / resume 换代，树都随之作废。</text>
</svg>