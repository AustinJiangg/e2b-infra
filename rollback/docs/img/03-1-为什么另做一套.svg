<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1030" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">为什么另做一套：原生要停沙箱、成本随虚机规格，本方案绑定沙箱生命周期换来原地回滚</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">目标场景是高频、低延迟、沙箱不能中断。原生 pause / resume 的停沙箱、重建进程、换回工作集来自它的语义本身；本方案放弃产物自足性与账本持久化，换来零拷贝封存、原地回滚，以及只随回退跨度增长的成本。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">先后顺序</text>
<line x1="192.0" y1="125.0" x2="232.0" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="242.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">与目标场景冲突的代价</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">同样是“保存一个时刻、之后回到它”，两条路径各做什么</text>
<rect x="630.0" y="168.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="667.0" y="184.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<rect x="48.0" y="204.0" width="1504.0" height="732.5" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<rect x="220.0" y="224.0" width="645.0" height="62.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6"/>
<text x="542.5" y="252.0" font-size="19" fill="#712B13" font-weight="600" text-anchor="middle">原生 pause / resume</text>
<text x="542.5" y="274.0" font-size="13.5" fill="#993C1D" text-anchor="middle">Pause、Checkpoint 两个 RPC</text>
<rect x="887.0" y="224.0" width="645.0" height="62.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.6"/>
<text x="1209.5" y="252.0" font-size="19" fill="#085041" font-weight="600" text-anchor="middle">本方案 checkpoint / restore</text>
<text x="1209.5" y="274.0" font-size="13.5" fill="#0F6E56" text-anchor="middle">活沙箱上的高频回退</text>
<text x="68.0" y="340.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">保存之后的沙箱</text>
<rect x="260.0" y="302.0" width="565.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="327.8" font-size="16" fill="#712B13" font-weight="600" text-anchor="middle">沙箱被停掉</text>
<text x="542.5" y="354.7" font-size="13" fill="#993C1D" text-anchor="middle">导出磁盘增量要先摘出写层、停掉沙箱、等 NBD 设备释放</text>
<rect x="927.0" y="302.0" width="565.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="327.8" font-size="16" fill="#085041" font-weight="600" text-anchor="middle">沙箱继续运行</text>
<text x="1209.5" y="354.7" font-size="13" fill="#0F6E56" text-anchor="middle">同一个 Firecracker 进程，宿主资源都在</text>
<text x="68.0" y="435.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">产物</text>
<rect x="220.0" y="398.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="423.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">快照进持久化存储</text>
<text x="542.5" y="450.2" font-size="13" fill="#993C1D" text-anchor="middle">原生负责迁移、持久化和崩溃恢复</text>
<rect x="887.0" y="398.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="423.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">产物在宿主本地</text>
<text x="1209.5" y="450.2" font-size="13" fill="#0F6E56" text-anchor="middle">内存每代只存本代脏页；磁盘封存是改名，零数据搬运</text>
<text x="68.0" y="531.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">恢复做什么</text>
<rect x="220.0" y="493.5" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="518.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">新建 Firecracker 进程</text>
<text x="542.5" y="545.7" font-size="13" fill="#993C1D" text-anchor="middle">再靠缺页把整个工作集换回内存</text>
<line x1="542.5" y1="465.5" x2="542.5" y2="488.5" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="554.5" y="482.0" font-size="13" fill="#D85A30" font-weight="600" text-anchor="start">要新建进程</text>
<rect x="887.0" y="493.5" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="518.8" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">原地回滚</text>
<text x="1209.5" y="545.7" font-size="13" fill="#0F6E56" text-anchor="middle">按页写回回滚集；进程、KVM fd、tap、网络槽位、NBD 设备一个都不重建</text>
<line x1="1209.5" y1="465.5" x2="1209.5" y2="488.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="68.0" y="626.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">代价取决于</text>
<rect x="220.0" y="589.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="614.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">虚机多大</text>
<text x="542.5" y="641.2" font-size="13" fill="#993C1D" text-anchor="middle">回退只改了 40 MiB 的沙箱，和改了 2 GiB 的沙箱，花的时间几乎一样</text>
<rect x="887.0" y="589.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="614.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">回退跨度</text>
<text x="1209.5" y="641.2" font-size="13" fill="#0F6E56" text-anchor="middle">成本只与改动量挂钩；唯一保留的固定开销是全量根</text>
<line x1="68" y1="686.5" x2="1532" y2="686.5" stroke="#D3D1C7" stroke-width="1"/>
<text x="68.0" y="720.5" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="start">对照目标场景</text>
<rect x="62.0" y="738.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="766.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">沙箱不能中断</text>
<text x="542.5" y="766.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">要停沙箱、新建进程</text>
<text x="1209.5" y="766.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">沙箱不中断</text>
<text x="68.0" y="810.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">高频：单次改动量通常很小</text>
<text x="542.5" y="810.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">改动小时省不下任何东西</text>
<text x="1209.5" y="810.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">改动小，代价就小</text>
<rect x="62.0" y="826.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="854.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">迁移、持久化、崩溃恢复</text>
<text x="542.5" y="854.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">由原生负责</text>
<text x="1209.5" y="854.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">明确不做，交给原生 snapshot</text>
<text x="68.0" y="898.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">orchestrator 或宿主重启之后</text>
<text x="542.5" y="898.5" font-size="15" fill="#2C2C2A" text-anchor="middle">快照仍在持久化存储里</text>
<text x="1209.5" y="898.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">checkpoint 全部失效</text>
<line x1="48" y1="972.5" x2="1552" y2="972.5" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="998.5" font-size="13" fill="#888780" text-anchor="start">注：ARM 适配基线上原生的脏页判据退化（读也算脏），已在第 14、15 章单独修复；修复后上面两条代价不变，因为它们来自停沙箱、重建进程、换回工作集的语义，与判据是否精确无关。恢复的逐步对比见图 09-1，两条路径怎么交替使用见图 15-1。</text>
</svg>