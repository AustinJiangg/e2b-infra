<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">guest 的一次访存要查两张页表</text>
<rect x="48.0" y="206.0" width="268.8" height="163.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
