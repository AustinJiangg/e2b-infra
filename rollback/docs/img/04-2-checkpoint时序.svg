<text x="540.0" y="198.5" font-size="12.5" fill="#0F6E56" text-anchor="middle">Checkpoint Service</text>
<rect x="845.0" y="150.0" width="170.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="930.0" y="172.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="middle">Firecracker</text>
<text x="930.0" y="198.5" font-size="12.5" fill="#5F5E5A" text-anchor="middle">同一个进程</text>
<rect x="1165.0" y="150.0" width="170.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1250.0" y="172.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="middle">宿主本地存储</text>
<text x="1250.0" y="198.5" font-size="12.5" fill="#5F5E5A" text-anchor="middle">store 根</text>
