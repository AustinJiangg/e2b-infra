<text x="59.7" y="259.5" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">1</text>
<line x1="164.0" y1="264.0" x2="534.0" y2="264.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="350.0" y="255.0" font-size="14" fill="#2C2C2A" text-anchor="middle">CreateCheckpoint（端口 49984，宿主拦截）</text>
<rect x="48.0" y="308.5" width="43.4" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="69.7" y="324.0" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">2–12</text>
<rect x="250.0" y="284.0" width="580.0" height="71.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="540.0" y="311.9" font-size="15" fill="#085041" font-weight="600" text-anchor="middle">进入服务、决定与准备（窗口外）</text>
<text x="540.0" y="338.7" font-size="13" fill="#0F6E56" text-anchor="middle">鉴权 → 取沙箱操作锁 → 水位检查 → 决定全量 / 增量 → Prepare（个数与字节配额）</text>
<rect x="48.0" y="381.0" width="31.0" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
