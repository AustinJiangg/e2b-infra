<rect width="1600" height="1162" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">一次 checkpoint 的时序：冻结窗口里只有暂停、写快照、封存写层、恢复</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">编号对应 §7 的步骤表；右列是写进 timings.json 的计时键。Firecracker 进程全程不重建，封存层移入 store 和提交都在窗口外。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
