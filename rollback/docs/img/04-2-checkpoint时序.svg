<text x="63.5" y="438.5" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">14</text>
<text x="1356.0" y="438.5" font-size="12.5" fill="#888780" text-anchor="start">save_live_bitmap</text>
<line x1="544.0" y1="443.0" x2="924.0" y2="443.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="735.0" y="434.0" font-size="14" fill="#2C2C2A" text-anchor="middle">（仅全量）导出活跃脏页位图</text>
<rect x="48.0" y="475.0" width="31.0" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="63.5" y="490.5" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">15</text>
<text x="1356.0" y="490.5" font-size="12.5" fill="#888780" text-anchor="start">snapshot</text>
<line x1="544.0" y1="505.0" x2="924.0" y2="505.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="735.0" y="476.0" font-size="14" fill="#2C2C2A" text-anchor="middle">写快照（一次调用）</text>
<text x="735.0" y="496.0" font-size="14" fill="#2C2C2A" text-anchor="middle">vmstate + 稀疏内存差分 + 位图侧车</text>
<line x1="934.0" y1="567.0" x2="1244.0" y2="567.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1090.0" y="538.0" font-size="14" fill="#2C2C2A" text-anchor="middle">写出 snapfile、mem_diff、</text>
<text x="1090.0" y="558.0" font-size="14" fill="#2C2C2A" text-anchor="middle">mem_bitmap（先写成 .tmp）</text>
<line x1="102.0" y1="599.0" x2="1340.0" y2="599.0" stroke="#D85A30" stroke-width="1.6" stroke-dasharray="7 4"/>
<rect x="116.0" y="587.0" width="336.7" height="24.0" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="0.9"/>
<text x="284.3" y="604.0" font-size="13" fill="#712B13" font-weight="600" text-anchor="middle">纪元前进：此后失败不能简单删目录，走 failCreate</text>
<rect x="48.0" y="651.5" width="31.0" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="63.5" y="667.0" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">16</text>
<text x="1356.0" y="667.0" font-size="12.5" fill="#888780" text-anchor="start">seal</text>
<rect x="250.0" y="627.0" width="580.0" height="71.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="540.0" y="654.9" font-size="15" fill="#085041" font-weight="600" text-anchor="middle">封存写层</text>
<text x="540.0" y="681.7" font-size="13" fill="#0F6E56" text-anchor="middle">刷屏障 → 写层就地封存为只读层，挂上新的空写层；不搬运数据</text>
<rect x="48.0" y="716.0" width="31.0" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
