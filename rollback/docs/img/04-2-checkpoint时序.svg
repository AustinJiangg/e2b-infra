<line x1="544.0" y1="736.0" x2="924.0" y2="736.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="735.0" y="727.0" font-size="14" fill="#2C2C2A" text-anchor="middle">恢复虚机（defer，无条件）</text>
<rect x="48.0" y="770.0" width="31.0" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="63.5" y="785.5" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">18</text>
<text x="1356.0" y="785.5" font-size="12.5" fill="#888780" text-anchor="start">seal_move</text>
<line x1="544.0" y1="790.0" x2="1244.0" y2="790.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="895.0" y="781.0" font-size="14" fill="#2C2C2A" text-anchor="middle">封存层文件移入 store 的 layers 目录</text>
<rect x="48.0" y="834.5" width="31.0" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="63.5" y="850.0" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">19</text>
<text x="1356.0" y="841.5" font-size="12.5" fill="#888780" text-anchor="start">append_layer、</text>
<text x="1356.0" y="858.5" font-size="12.5" fill="#888780" text-anchor="start">append_lock_wait</text>
<rect x="250.0" y="810.0" width="580.0" height="71.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="540.0" y="837.9" font-size="15" fill="#085041" font-weight="600" text-anchor="middle">AppendLayer</text>
<text x="540.0" y="864.7" font-size="13" fill="#0F6E56" text-anchor="middle">锁内把新层折进合并映射；锁外写层 sidecar 与本条目的 rootfs.header</text>
<rect x="48.0" y="921.5" width="31.0" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="63.5" y="937.0" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">20</text>
<text x="1356.0" y="911.5" font-size="12.5" fill="#888780" text-anchor="start">commit_files、</text>
<text x="1356.0" y="928.5" font-size="12.5" fill="#888780" text-anchor="start">commit_manifest、</text>
<text x="1356.0" y="945.5" font-size="12.5" fill="#888780" text-anchor="start">commit_lock_wait、</text>
<text x="1356.0" y="962.5" font-size="12.5" fill="#888780" text-anchor="start">commit_index</text>
<rect x="250.0" y="897.0" width="580.0" height="71.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="540.0" y="924.9" font-size="15" fill="#085041" font-weight="600" text-anchor="middle">Commit</text>
<text x="540.0" y="951.7" font-size="13" fill="#0F6E56" text-anchor="middle">rename 到位（不 fsync）→ manifest 翻成 committed → 锁内发布，基准 ← 本条目</text>
<line x1="102.0" y1="996.0" x2="1340.0" y2="996.0" stroke="#E24B4A" stroke-width="1.6" stroke-dasharray="7 4"/>
<rect x="116.0" y="984.0" width="356.9" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.9"/>
<text x="294.5" y="1001.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">提交：条目从 prepared 变为 committed，可见、可恢复</text>
<rect x="48.0" y="1026.0" width="31.0" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="63.5" y="1041.5" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">21</text>
<text x="1356.0" y="1041.5" font-size="12.5" fill="#888780" text-anchor="start">total</text>
<line x1="536.0" y1="1046.0" x2="166.0" y2="1046.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="350.0" y="1037.0" font-size="14" fill="#2C2C2A" text-anchor="middle">{checkpointId, memMode}</text>
<line x1="48" y1="1104" x2="1552" y2="1104" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1130.0" font-size="13" fill="#888780" text-anchor="start">注：第 14 步只在全量时做。seal_move 登记在 resume 之前、按 defer 的倒序在它之后执行，所以落在窗口外；跨文件系统时它是一次拷贝。第 15 步成功后的三层降级见 §7.6。</text>
