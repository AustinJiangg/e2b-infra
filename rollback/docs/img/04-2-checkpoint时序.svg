<text x="1356.0" y="396.5" font-size="12.5" fill="#888780" text-anchor="start">pause</text>
<line x1="544.0" y1="401.0" x2="924.0" y2="401.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
