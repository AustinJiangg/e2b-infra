<text x="160.0" y="198.5" font-size="12.5" fill="#5F5E5A" text-anchor="middle">调用方</text>
<rect x="455.0" y="150.0" width="170.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
