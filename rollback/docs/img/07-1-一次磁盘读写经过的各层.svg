<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1384" viewBox="0 0 1600 1384" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1384" fill="#FFFFFF"/>
<rect x="48" y="150.0" width="1504" height="282.0" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<rect x="48" y="454.0" width="1504" height="836.0" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">一次 guest 磁盘读写经过的各层：从 ext4 到 Overlay 的活写层</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">Firecracker 负责虚拟磁盘的设备行为，orchestrator 经 NBD 提供磁盘的数据内容。读请求沿同一路径返回，写请求由 Overlay 写入当前活写层。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">请求方向</text>
<rect x="540.0" y="172.0" width="600.0" height="92.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="552.0" y="183.0" width="80.4" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="592.2" y="198.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">guest 内核</text>
<text x="840.0" y="225.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">ext4 文件系统驱动</text>
<text x="840.0" y="253.3" font-size="14" fill="#5F5E5A" text-anchor="middle">把文件读写转换为磁盘读写</text>
<rect x="540.0" y="322.0" width="600.0" height="92.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="552.0" y="333.0" width="80.4" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="592.2" y="348.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">guest 内核</text>
<text x="840.0" y="375.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">virtio-blk 驱动</text>
<text x="840.0" y="403.3" font-size="14" fill="#5F5E5A" text-anchor="middle">设备名 /dev/vda</text>
<line x1="840.0" y1="266.0" x2="840.0" y2="317.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="540.0" y="472.0" width="600.0" height="92.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="552.0" y="483.0" width="73.5" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="588.8" y="498.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">host 进程</text>
<text x="840.0" y="525.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">Firecracker</text>
<text x="840.0" y="553.3" font-size="14" fill="#5F5E5A" text-anchor="middle">模拟 virtio-blk 磁盘设备</text>
<line x1="840.0" y1="416.0" x2="840.0" y2="467.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="852.0" y="446.5" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">通过 virtio 队列提交请求</text>
<rect x="540.0" y="622.0" width="600.0" height="92.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="552.0" y="633.0" width="73.5" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="588.8" y="648.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">host 内核</text>
<text x="840.0" y="675.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">/dev/nbdX</text>
<text x="840.0" y="703.3" font-size="14" fill="#5F5E5A" text-anchor="middle">host 内核中的 NBD 块设备</text>
<line x1="840.0" y1="566.0" x2="840.0" y2="617.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="852.0" y="596.5" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">对配置的后端设备执行读写</text>
<rect x="540.0" y="772.0" width="600.0" height="92.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="552.0" y="783.0" width="101.2" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="602.6" y="798.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<text x="840.0" y="825.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">NBD dispatcher</text>
<text x="840.0" y="853.3" font-size="14" fill="#5F5E5A" text-anchor="middle">orchestrator 进程中</text>
<line x1="840.0" y1="716.0" x2="840.0" y2="767.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="852.0" y="746.5" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">NBD 驱动通过连接转发请求</text>
<rect x="540.0" y="922.0" width="600.0" height="92.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="552.0" y="933.0" width="101.2" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="602.6" y="948.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<text x="840.0" y="975.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">Overlay</text>
<text x="840.0" y="1003.3" font-size="14" fill="#5F5E5A" text-anchor="middle">读合并、写落上层</text>
<line x1="840.0" y1="866.0" x2="840.0" y2="917.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="852.0" y="896.5" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">调用 Overlay 的读写方法</text>
<rect x="616.0" y="1090.0" width="908.0" height="182.0" rx="14" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="5 4"/>
<text x="1506.0" y="1261.0" font-size="13.5" fill="#5F5E5A" font-weight="600" text-anchor="end">只读数据来源（o.device）</text>
<rect x="160.0" y="1134.0" width="400.0" height="100.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="360.0" y="1176.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">Cache（活写层）</text>
<text x="360.0" y="1204.3" font-size="14" fill="#5F5E5A" text-anchor="middle">稀疏文件 + mmap + 块位图；所有写入都进这里</text>
<polyline points="600.0,1016.0 600.0,1054.0 360.0,1054.0 360.0,1128.0" fill="none" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="372.0" y="1106.0" font-size="13.5" fill="#5F5E5A" font-weight="600" text-anchor="start">写；读 ①</text>
<rect x="640.0" y="1134.0" width="400.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="840.0" y="1176.4" font-size="16.5" fill="#085041" font-weight="600" text-anchor="middle">LayerStack</text>
<text x="840.0" y="1204.3" font-size="14" fill="#0F6E56" text-anchor="middle">封存层 + 块归属索引（封层后才有）</text>
<line x1="840.0" y1="1016.0" x2="840.0" y2="1128.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="852.0" y="1106.0" font-size="13.5" fill="#5F5E5A" font-weight="600" text-anchor="start">读 ②：活写层没有该块</text>
<rect x="1100.0" y="1134.0" width="400.0" height="100.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1300.0" y="1176.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">模板 rootfs</text>
<text x="1300.0" y="1204.3" font-size="14" fill="#5F5E5A" text-anchor="middle">经 chunker 按需拉取并在本地缓存</text>
<polyline points="1080.0,1016.0 1080.0,1054.0 1300.0,1054.0 1300.0,1128.0" fill="none" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1312.0" y="1106.0" font-size="13.5" fill="#5F5E5A" font-weight="600" text-anchor="start">读 ③：封存层也没有</text>
<text x="72.0" y="186.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">guest 内部</text>
<text x="72.0" y="490.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">host 上</text>
<rect x="1180.0" y="322.0" width="348.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1354.0" y="349.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">/dev/vda</text>
<text x="1354.0" y="377.8" font-size="14" fill="#5F5E5A" text-anchor="middle">guest 内核为 Firecracker 提供的 virtio-blk</text>
<text x="1354.0" y="398.8" font-size="14" fill="#5F5E5A" text-anchor="middle">虚拟磁盘命名的设备</text>
<rect x="1180.0" y="622.0" width="348.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1354.0" y="649.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">/dev/nbdX</text>
<text x="1354.0" y="677.8" font-size="14" fill="#5F5E5A" text-anchor="middle">host 上的块设备，作为这块虚拟磁盘的数据后</text>
<text x="1354.0" y="698.8" font-size="14" fill="#5F5E5A" text-anchor="middle">端；guest 不直接访问它</text>
<rect x="1180.0" y="922.0" width="348.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1354.0" y="949.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">换视图不换设备</text>
<text x="1354.0" y="977.8" font-size="14" fill="#5F5E5A" text-anchor="middle">后面的封层和换视图发生在 Overlay 内部，不需</text>
<text x="1354.0" y="998.8" font-size="14" fill="#5F5E5A" text-anchor="middle">要换 /dev/vda 或 /dev/nbdX</text>
<line x1="48" y1="1326" x2="1552" y2="1326" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1352.0" font-size="13" fill="#888780" text-anchor="start">注：读块时，活写层位图为 1 就用本层内容（即使内容全零），为 0 才继续往下查。没有保存过 checkpoint 时还没有 LayerStack，读不到就直接读模板。</text>
</svg>