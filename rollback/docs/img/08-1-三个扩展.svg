<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1409" viewBox="0 0 1600 1409" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1409" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">分叉 Firecracker 的三个扩展：orchestrator 在暂停期间调用，Firecracker 只做无状态的读写</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">一个可选字段加两个新端点，没有改动任何既有语义。哪些页该回滚、内容从哪一代取，由 orchestrator 算好再递过去；Firecracker 不知道 checkpoint 树是什么。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">调用顺序</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">checkpoint：快照与它写了哪些页，在同一次调用里交出</text>
<text x="625.5" y="184.0" font-size="14.5" fill="#888780" text-anchor="start">扩展一；第一个 checkpoint 另外先调扩展三</text>
<rect x="48.0" y="206.0" width="346.0" height="166.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="217.0" width="101.2" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="110.6" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<text x="221.0" y="296.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">暂停虚机</text>
<text x="221.0" y="324.5" font-size="14" fill="#5F5E5A" text-anchor="middle">PATCH /vm</text>
<line x1="398.0" y1="289.2" x2="428.0" y2="289.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="434.0" y="206.0" width="346.0" height="166.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="446.0" y="217.0" width="137.4" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="514.7" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator → FC</text>
<rect x="446.0" y="338.5" width="322.0" height="26.0" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
<text x="607.0" y="355.5" font-size="13" fill="#085041" font-weight="500" text-anchor="middle">扩展三</text>
<text x="607.0" y="268.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">PUT /snapshot/save-dirty-bitmap</text>
<text x="607.0" y="296.0" font-size="14" fill="#5F5E5A" text-anchor="middle">只在全量 checkpoint 之前：导出自启动以来的活</text>
<text x="607.0" y="317.0" font-size="14" fill="#5F5E5A" text-anchor="middle">跃脏图</text>
<line x1="784.0" y1="289.2" x2="814.0" y2="289.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
