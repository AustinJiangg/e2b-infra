<rect x="48.0" y="904.5" width="50.9" height="22.0" rx="11" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="73.5" y="920.0" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">22–23</text>
