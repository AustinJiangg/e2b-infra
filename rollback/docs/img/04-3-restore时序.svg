<text x="560.0" y="490.9" font-size="15" fill="#085041" font-weight="600" text-anchor="middle">物化回滚集</text>
<text x="560.0" y="517.7" font-size="13" fill="#0F6E56" text-anchor="middle">回滚集 = 树路径各代位图 ∪ 活跃脏页；沿目标祖先链物化内容</text>
