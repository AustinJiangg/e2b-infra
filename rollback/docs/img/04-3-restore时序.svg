<text x="365.0" y="1022.0" font-size="14" fill="#2C2C2A" text-anchor="middle">success</text>
<line x1="48" y1="1089" x2="1552" y2="1089" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1115.0" font-size="13" fill="#888780" text-anchor="start">注：第 14 步必须在 15、16 之前，物化的内容才覆盖 Firecracker 要写回的全部页；conntrack 必须在恢复之前清完。账本跟着状态走，不跟着 RPC 走。</text>
