<text x="221.0" y="1344.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">guest 运行</text>
<text x="221.0" y="1372.8" font-size="14" fill="#5F5E5A" text-anchor="middle">CPU 把脏 GPA 写进 buffer，无陷出</text>
<line x1="398.0" y1="1337.5" x2="428.0" y2="1337.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="434.0" y="1272.5" width="346.0" height="130.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="446.0" y="1283.5" width="95.6" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="493.8" y="1299.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">Firecracker</text>
<text x="607.0" y="1344.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">打快照、回滚前先暂停</text>
<text x="607.0" y="1372.8" font-size="14" fill="#5F5E5A" text-anchor="middle">暂停让每个 vCPU 退出 KVM_RUN</text>
<line x1="784.0" y1="1337.5" x2="814.0" y2="1337.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="820.0" y="1272.5" width="346.0" height="130.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="832.0" y="1283.5" width="42.9" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="853.5" y="1299.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">KVM</text>
<text x="993.0" y="1344.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">buffer 汇总进位图</text>
<text x="993.0" y="1372.8" font-size="14" fill="#5F5E5A" text-anchor="middle">VM-Exit 时刷新；dirty-log 同步时也处理</text>
<line x1="1170.0" y1="1337.5" x2="1200.0" y2="1337.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1206.0" y="1272.5" width="346.0" height="130.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1218.0" y="1283.5" width="95.6" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1265.8" y="1299.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">Firecracker</text>
<text x="1379.0" y="1344.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">取图</text>
<text x="1379.0" y="1372.8" font-size="14" fill="#5F5E5A" text-anchor="middle">KVM_GET_DIRTY_LOG 取走并清空位图</text>
<rect x="48.0" y="1418.5" width="1504.0" height="40.0" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
<text x="800.0" y="1444.5" font-size="14.5" fill="#085041" font-weight="600" text-anchor="middle">纯计算 guest 几乎不产生 VM-Exit，但「暂停之后取图」那一刻 buffer 里的记录也已经汇总进位图</text>
<line x1="48" y1="1494.5" x2="1552" y2="1494.5" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1520.5" font-size="13" fill="#888780" text-anchor="start">注：KVM_ENABLE_CAP 失败时，若要求必须 HDBSS（FC_HDBSS_REQUIRED）则构建失败，否则退回 kvm-wp。顺序错了 ioctl 照样返回成功，只是一条脏页都记不到。</text>
</svg>