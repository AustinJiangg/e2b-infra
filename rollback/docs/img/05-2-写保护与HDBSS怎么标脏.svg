<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1552" viewBox="0 0 1600 1552" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-async" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#1D9E75" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1552" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">写保护与 HDBSS 怎么标脏：HDBSS 去掉了为标脏而生的 VM-Exit</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">两种方式最后都汇总进标准 KVM memory-slot dirty bitmap，由 VMM 调用 KVM_GET_DIRTY_LOG 取走。语义一致，只差性能，所以降级是静默的。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">控制流</text>
<line x1="178.5" y1="125.0" x2="218.5" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="228.5" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">VM-Exit，虚机退出到宿主内核</text>
<line x1="460.3" y1="125.0" x2="500.3" y2="125.0" stroke="#1D9E75" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-async)"/>
<text x="510.3" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">稍后、批量汇总</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">guest 第一次写一个干净页</text>
<rect x="354.1" y="168.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="391.1" y="184.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<rect x="48.0" y="204.0" width="1504.0" height="770.5" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<rect x="220.0" y="224.0" width="645.0" height="62.0" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.6"/>
<text x="542.5" y="252.0" font-size="19" fill="#27500A" font-weight="600" text-anchor="middle">KVM 写保护</text>
<text x="542.5" y="274.0" font-size="13.5" fill="#3B6D11" text-anchor="middle">没有 HDBSS 时的退路</text>
<rect x="887.0" y="224.0" width="645.0" height="62.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.6"/>
<text x="1209.5" y="252.0" font-size="19" fill="#085041" font-weight="600" text-anchor="middle">HDBSS</text>
<text x="1209.5" y="274.0" font-size="13.5" fill="#0F6E56" text-anchor="middle">工作在 Stage-2 这一层</text>
<text x="68.0" y="332.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">干净页的状态</text>
<text x="68.0" y="351.0" font-size="12.5" fill="#888780" text-anchor="start">（取图之后、下一次写之前）</text>
<rect x="260.0" y="302.0" width="565.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#639922" stroke-width="1.2"/>
<text x="542.5" y="327.8" font-size="16" fill="#27500A" font-weight="600" text-anchor="middle">Stage-2 只读</text>
<text x="542.5" y="354.7" font-size="13" fill="#3B6D11" text-anchor="middle">KVM 把 Stage-2 页表里所有页设成只读</text>
<rect x="927.0" y="302.0" width="565.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="327.8" font-size="16" fill="#085041" font-weight="600" text-anchor="middle">Stage-2 PTE 启用 DBM</text>
<text x="1209.5" y="354.7" font-size="13" fill="#0F6E56" text-anchor="middle">Dirty Bit Modifier，没有写保护</text>
<text x="68.0" y="429.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">触发事件</text>
<rect x="220.0" y="398.0" width="1312.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="1.2"/>
<text x="876.0" y="430.0" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">guest 写入某个 GPA</text>
<text x="68.0" y="517.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">发现写</text>
<rect x="220.0" y="480.0" width="645.0" height="65.5" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
<text x="542.5" y="505.3" font-size="15.5" fill="#27500A" font-weight="600" text-anchor="middle">权限故障 → VM-Exit</text>
<text x="542.5" y="532.2" font-size="13" fill="#3B6D11" text-anchor="middle">每个干净页的第一次写付一次</text>
<line x1="542.5" y1="452.0" x2="542.5" y2="475.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="554.5" y="468.5" font-size="13" fill="#D85A30" font-weight="600" text-anchor="start">陷出</text>
<rect x="887.0" y="480.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="505.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">CPU 把脏 GPA 写进 HDBSS buffer</text>
<text x="1209.5" y="532.2" font-size="13" fill="#0F6E56" text-anchor="middle">硬件完成，无陷出；每个 vCPU 一个 buffer</text>
<line x1="1209.5" y1="452.0" x2="1209.5" y2="475.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="68.0" y="613.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">记进位图</text>
<rect x="220.0" y="575.5" width="645.0" height="65.5" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
<text x="542.5" y="600.8" font-size="15.5" fill="#27500A" font-weight="600" text-anchor="middle">KVM 在脏页位图里置位</text>
<text x="542.5" y="627.7" font-size="13" fill="#3B6D11" text-anchor="middle">把该页改回可写，返回 guest</text>
<line x1="542.5" y1="547.5" x2="542.5" y2="570.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="575.5" width="645.0" height="65.5" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1209.5" y="600.8" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">vCPU 发生 VM-Exit（任何原因）时</text>
<text x="1209.5" y="627.7" font-size="13" fill="#0F6E56" text-anchor="middle">KVM 遍历 HDBSS buffer，逐条 kvm_vcpu_mark_page_dirty()</text>
<line x1="1209.5" y1="547.5" x2="1209.5" y2="570.5" stroke="#1D9E75" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-async)"/>
<text x="68.0" y="708.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">结果</text>
<rect x="220.0" y="671.0" width="645.0" height="65.5" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.2"/>
<text x="542.5" y="696.3" font-size="15.5" fill="#27500A" font-weight="600" text-anchor="middle">标准 KVM memory-slot dirty bitmap</text>
<text x="542.5" y="723.2" font-size="13" fill="#3B6D11" text-anchor="middle">VMM 调用 KVM_GET_DIRTY_LOG 取走</text>
<line x1="542.5" y1="643.0" x2="542.5" y2="666.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="671.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="696.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">标准 KVM memory-slot dirty bitmap</text>
<text x="1209.5" y="723.2" font-size="13" fill="#0F6E56" text-anchor="middle">VMM 调用 KVM_GET_DIRTY_LOG 取走</text>
<line x1="1209.5" y1="643.0" x2="1209.5" y2="666.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="68" y1="768.5" x2="1532" y2="768.5" stroke="#D3D1C7" stroke-width="1"/>
<text x="68.0" y="802.5" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="start">对比小结</text>
<rect x="62.0" y="820.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="848.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">每个干净页首次写</text>
<text x="542.5" y="848.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">一次 VM-Exit</text>
<text x="1209.5" y="848.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">没有为标脏而生的 VM-Exit</text>
<text x="68.0" y="892.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">上层拿到的</text>
<text x="542.5" y="892.5" font-size="15" fill="#2C2C2A" text-anchor="middle">同一个位图</text>
<text x="1209.5" y="892.5" font-size="15" fill="#2C2C2A" text-anchor="middle">同一个位图</text>
<rect x="62.0" y="908.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="936.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">额外开销</text>
<text x="542.5" y="936.5" font-size="15" fill="#2C2C2A" text-anchor="middle">之后该页一直可写，直到下一次取位图</text>
<text x="1209.5" y="936.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">buffer 有容量上限，写满触发额外处理</text>
<circle cx="63" cy="1020.5" r="15" fill="#2C2C2A"/>
<text x="63.0" y="1026.0" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="1027.5" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">HDBSS 怎么被启用</text>
<text x="285.6" y="1026.5" font-size="14.5" fill="#888780" text-anchor="start">以已武装跟踪为前提；冷启动和从快照加载两条路径都要做</text>
<rect x="48.0" y="1048.5" width="346.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="1059.5" width="101.2" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="110.6" y="1075.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<text x="221.0" y="1120.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">探测能力</text>
<text x="221.0" y="1148.3" font-size="14" fill="#5F5E5A" text-anchor="middle">KVM_CHECK_EXTENSION(502)，在 /dev/kvm</text>
<text x="221.0" y="1169.3" font-size="14" fill="#5F5E5A" text-anchor="middle">上只查询，不建 VM</text>
<line x1="398.0" y1="1123.5" x2="428.0" y2="1123.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="434.0" y="1048.5" width="346.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="446.0" y="1059.5" width="95.6" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="493.8" y="1075.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">Firecracker</text>
<text x="607.0" y="1120.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">建 vCPU、注册 memslot</text>
<text x="607.0" y="1148.3" font-size="14" fill="#5F5E5A" text-anchor="middle">KVM_CREATE_VCPU × N 之后，注册带</text>
<text x="607.0" y="1169.3" font-size="14" fill="#5F5E5A" text-anchor="middle">KVM_MEM_LOG_DIRTY_PAGES 的 memslot</text>
<line x1="784.0" y1="1123.5" x2="814.0" y2="1123.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="820.0" y="1048.5" width="346.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="832.0" y="1059.5" width="95.6" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="879.8" y="1075.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">Firecracker</text>
<rect x="832.0" y="1164.5" width="322.0" height="26.0" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="993.0" y="1181.5" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle">必须在 vCPU 创建之后调用</text>
<text x="993.0" y="1112.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">KVM_ENABLE_CAP(502)</text>
<text x="993.0" y="1140.8" font-size="14" fill="#5F5E5A" text-anchor="middle">args[0] 是大小编码，默认 1 = 每 vCPU 8 KiB</text>
<line x1="1170.0" y1="1123.5" x2="1200.0" y2="1123.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1206.0" y="1048.5" width="346.0" height="150.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1218.0" y="1059.5" width="95.6" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1265.8" y="1075.0" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">Firecracker</text>
<text x="1379.0" y="1120.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">自报所用方式</text>
<text x="1379.0" y="1148.3" font-size="14" fill="#5F5E5A" text-anchor="middle">instance info 的 dirty_tracking：hdbss /</text>
<text x="1379.0" y="1169.3" font-size="14" fill="#5F5E5A" text-anchor="middle">kvm-wp / off</text>
<circle cx="63" cy="1244.5" r="15" fill="#2C2C2A"/>
<text x="63.0" y="1250.0" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
<text x="90.0" y="1251.5" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">运行与收集</text>
<rect x="48.0" y="1272.5" width="346.0" height="130.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
