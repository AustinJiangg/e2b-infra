<text x="1334.7" y="392.3" font-size="14" fill="#5F5E5A" text-anchor="middle">后续新写入的位置</text>
<text x="1137.3" y="444.0" font-size="13.5" fill="#5F5E5A" font-weight="600" text-anchor="start">o.device → LayerStack（c1 的层清单）</text>
