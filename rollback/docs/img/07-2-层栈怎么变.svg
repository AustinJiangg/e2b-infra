<text x="1233.0" y="762.8" font-size="14" fill="#993C1D" text-anchor="middle">件一起删</text>
<rect x="1340.7" y="672.0" width="191.3" height="120.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
