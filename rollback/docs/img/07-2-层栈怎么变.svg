<text x="1436.3" y="741.8" font-size="14" fill="#5F5E5A" text-anchor="middle">Close()：只解映射，文</text>
<text x="1436.3" y="762.8" font-size="14" fill="#5F5E5A" text-anchor="middle">件留给 store</text>
<rect x="48.0" y="820.0" width="1504.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
