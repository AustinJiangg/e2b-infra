<text x="48.0" y="1394.0" font-size="13" fill="#888780" text-anchor="start">注：层栈不是 checkpoint 树，所以不能“删一个叶子就删它封存的那一层”：appendLocked 不看 ParentID，全量根的视图也叠在此前每一层上。跟踪关闭时层文件随 checkpoint 次数累积，直到 restore 替换活栈或沙箱销毁；层合并见 §5。</text>
