<rect x="1300.0" y="265.0" width="101.2" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1350.6" y="280.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<text x="1420.0" y="337.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">等 guest 的 envd 应答</text>
<text x="1420.0" y="365.0" font-size="14" fill="#5F5E5A" text-anchor="middle">宿主侧已完成，虚机在目标时刻</text>
<line x1="952.0" y1="210.0" x2="952.0" y2="846.5" stroke="#D85A30" stroke-width="2.4" stroke-dasharray="10 6"/>
