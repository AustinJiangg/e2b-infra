<rect x="48.0" y="862.5" width="1504.0" height="40.0" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="800.0" y="888.5" font-size="14.5" fill="#712B13" font-weight="600" text-anchor="middle">rollback 调用超时也算撕裂：判断不了 Firecracker 停在提交点哪一侧，恢复运行一个可能半新半旧的 guest，会让它把说不清的状态写进磁盘</text>
<circle cx="63" cy="948.5" r="15" fill="#2C2C2A"/>
<text x="63.0" y="954.0" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="955.5" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">两半各怎么收尾</text>
<text x="250.0" y="954.5" font-size="14.5" fill="#888780" text-anchor="start">Firecracker 的 match 是穷尽的，新错误变体必须归入其中一半</text>
<rect x="48.0" y="974.5" width="1504.0" height="500.5" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<rect x="220.0" y="994.5" width="645.0" height="62.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.6"/>
<text x="542.5" y="1022.5" font-size="19" fill="#2C2C2A" font-weight="600" text-anchor="middle">提交点之前</text>
<text x="542.5" y="1044.5" font-size="13.5" fill="#5F5E5A" text-anchor="middle">chain_broken、internal</text>
<rect x="887.0" y="994.5" width="645.0" height="62.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6"/>
<text x="1209.5" y="1022.5" font-size="19" fill="#712B13" font-weight="600" text-anchor="middle">提交点之后</text>
<text x="1209.5" y="1044.5" font-size="13.5" fill="#993C1D" text-anchor="middle">torn</text>
<text x="68.0" y="1120.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">Firecracker 侧</text>
<rect x="220.0" y="1072.5" width="645.0" height="85.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="542.5" y="1097.8" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">faults_vm() 返回 false</text>
<text x="542.5" y="1124.7" font-size="13" fill="#5F5E5A" text-anchor="middle">NotPaused、Faulted、SnapshotFile、Validation、RevertBitmap、MemoryFile、</text>
<text x="542.5" y="1144.7" font-size="13" fill="#5F5E5A" text-anchor="middle">MemoryFileCoverage、DirtyBitmap、BitmapWrite</text>
<rect x="887.0" y="1072.5" width="645.0" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1209.5" y="1107.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">faults_vm() 返回 true，虚机标记 Faulted</text>
<text x="1209.5" y="1134.7" font-size="13" fill="#993C1D" text-anchor="middle">Memory、Vcpu、Gic、Devices</text>
<text x="68.0" y="1225.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">虚机</text>
<rect x="220.0" y="1188.0" width="645.0" height="65.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="542.5" y="1213.3" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">恢复运行</text>
<text x="542.5" y="1240.2" font-size="13" fill="#5F5E5A" text-anchor="middle">resumeOnError：先 conntrack.join() 等清表完成，再 ResumeVM；恢复也失败时两个错误一起返回</text>
<line x1="542.5" y1="1160.0" x2="542.5" y2="1183.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<rect x="887.0" y="1188.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1209.5" y="1213.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">保持暂停</text>
<text x="1209.5" y="1240.2" font-size="13" fill="#993C1D" text-anchor="middle">它持有回滚写到一半的内容，是事后分析唯一的材料；恢复运行会让半新半旧的 guest 写它的磁盘</text>
<line x1="1209.5" y1="1160.0" x2="1209.5" y2="1183.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="68.0" y="1316.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">账本</text>
<text x="542.5" y="1316.5" font-size="15" fill="#888780" text-anchor="middle">—</text>
<rect x="887.0" y="1283.5" width="645.0" height="56.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1209.5" y="1317.1" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">标记断链，磁盘账本 poisoned</text>
<line x1="1209.5" y1="1255.5" x2="1209.5" y2="1278.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="68.0" y="1417.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">撕裂标记</text>
<text x="542.5" y="1417.2" font-size="15" fill="#888780" text-anchor="middle">—</text>
<rect x="887.0" y="1369.5" width="645.0" height="85.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1209.5" y="1394.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">按代记，不按沙箱 id</text>
<text x="1209.5" y="1421.7" font-size="13" fill="#993C1D" text-anchor="middle">记在 Sandbox.LifecycleID 下（refuseIfTorn、markTorn）；同一个 id 经原生 pause / resume</text>
<text x="1209.5" y="1441.7" font-size="13" fill="#993C1D" text-anchor="middle">换了新进程后从干净状态开始</text>
<line x1="1209.5" y1="1341.5" x2="1209.5" y2="1364.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="48" y1="1511.0" x2="1552" y2="1511.0" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1537.0" font-size="13" fill="#888780" text-anchor="start">注：reason 是 restore 失败应答里的字段；调用方如何处理错误、SDK 的超时与重试见第 24 章。envd 的 45 s 要明显短于 SDK 通用请求超时 60 s，保证这一档由服务端报告，而不是变成客户端的读超时。</text>
