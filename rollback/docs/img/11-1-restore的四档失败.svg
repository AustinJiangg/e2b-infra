<rect x="668.0" y="265.0" width="95.6" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="715.8" y="280.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">Firecracker</text>
<text x="788.0" y="326.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">Firecracker 提交点之前</text>
<text x="788.0" y="354.5" font-size="14" fill="#5F5E5A" text-anchor="middle">校验、静默 I/O、取活跃脏图：不改</text>
<text x="788.0" y="375.5" font-size="14" fill="#5F5E5A" text-anchor="middle">guest 状态</text>
<line x1="924.0" y1="329.8" x2="978.0" y2="329.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
