<text x="952.0" y="444.5" font-size="14" fill="#712B13" font-weight="600" text-anchor="middle">提交点</text>
<rect x="48.0" y="475.5" width="424.0" height="363.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="260.0" y="507.5" font-size="17" fill="#2C2C2A" font-weight="600" text-anchor="middle">chain_broken</text>
<line x1="66.0" y1="523.5" x2="454.0" y2="523.5" stroke="#B4B2A9" stroke-width="0.8" stroke-opacity="0.6"/>
<text x="66.0" y="547.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">情形</text>
<text x="66.0" y="569.5" font-size="14" fill="#2C2C2A" text-anchor="start">checkpoint 树解析不了这次 restore：目标没有磁盘视图、</text>
<text x="66.0" y="590.5" font-size="14" fill="#2C2C2A" text-anchor="start">祖先缺失、当前基准不在库里、丢过纪元（断链）</text>
<text x="66.0" y="623.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">沙箱</text>
<text x="66.0" y="645.5" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="start">原状态，继续可用</text>
<text x="66.0" y="678.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">调用方</text>
<text x="66.0" y="700.5" font-size="14" fill="#2C2C2A" text-anchor="start">不要重试；先打一个新 checkpoint 起新链</text>
<rect x="496.0" y="475.5" width="424.0" height="363.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="708.0" y="507.5" font-size="17" fill="#2C2C2A" font-weight="600" text-anchor="middle">internal</text>
<line x1="514.0" y1="523.5" x2="902.0" y2="523.5" stroke="#B4B2A9" stroke-width="0.8" stroke-opacity="0.6"/>
<text x="514.0" y="547.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">情形</text>
<text x="514.0" y="569.5" font-size="14" fill="#2C2C2A" text-anchor="start">提交点之前的其它失败：读 sidecar、装配视图、物化回滚</text>
<text x="514.0" y="590.5" font-size="14" fill="#2C2C2A" text-anchor="start">集、Firecracker 在提交点前报错</text>
<text x="514.0" y="623.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">沙箱</text>
<text x="514.0" y="645.5" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="start">虚机原样恢复；消息里明说「沙箱仍在当前状态运行」</text>
<text x="514.0" y="678.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">调用方</text>
<text x="514.0" y="700.5" font-size="14" fill="#2C2C2A" text-anchor="start">换目标重试，或先打一个新 checkpoint</text>
<rect x="984.0" y="475.5" width="264.0" height="363.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.4"/>
<text x="1116.0" y="507.5" font-size="17" fill="#712B13" font-weight="600" text-anchor="middle">torn</text>
<line x1="1002.0" y1="523.5" x2="1230.0" y2="523.5" stroke="#D85A30" stroke-width="0.8" stroke-opacity="0.6"/>
<text x="1002.0" y="547.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">情形</text>
<text x="1002.0" y="569.5" font-size="14" fill="#2C2C2A" text-anchor="start">应答带 "fault": true；rollback</text>
<text x="1002.0" y="590.5" font-size="14" fill="#2C2C2A" text-anchor="start">调用超过</text>
<text x="1002.0" y="611.5" font-size="14" fill="#2C2C2A" text-anchor="start">CHECKPOINT_FC_CALL_TIMEOUT</text>
<text x="1002.0" y="632.5" font-size="14" fill="#2C2C2A" text-anchor="start">未应答；ResetView 或之后的</text>
<text x="1002.0" y="653.5" font-size="14" fill="#2C2C2A" text-anchor="start">resume 失败</text>
<text x="1002.0" y="686.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">沙箱</text>
<text x="1002.0" y="708.5" font-size="14" fill="#712B13" font-weight="600" text-anchor="start">撕裂；这一代的 checkpoint 与</text>
<text x="1002.0" y="729.5" font-size="14" fill="#712B13" font-weight="600" text-anchor="start">restore 一律被拒，list / delete</text>
<text x="1002.0" y="750.5" font-size="14" fill="#712B13" font-weight="600" text-anchor="start">仍可用</text>
<text x="1002.0" y="783.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">调用方</text>
<text x="1002.0" y="805.5" font-size="14" fill="#2C2C2A" text-anchor="start">只能销毁重建沙箱</text>
<rect x="1288.0" y="475.5" width="264.0" height="363.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.4"/>
<text x="1420.0" y="507.5" font-size="17" fill="#2C2C2A" font-weight="600" text-anchor="middle">guest_unresponsive</text>
<line x1="1306.0" y1="523.5" x2="1534.0" y2="523.5" stroke="#B4B2A9" stroke-width="0.8" stroke-opacity="0.6"/>
<text x="1306.0" y="547.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">情形</text>
<text x="1306.0" y="569.5" font-size="14" fill="#2C2C2A" text-anchor="start">回滚成功，但 envd 在 45 s 内不</text>
<text x="1306.0" y="590.5" font-size="14" fill="#2C2C2A" text-anchor="start">应答</text>
<text x="1306.0" y="623.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">沙箱</text>
<text x="1306.0" y="645.5" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="start">不是撕裂；虚机在目标时刻</text>
<text x="1306.0" y="678.5" font-size="12.5" fill="#888780" font-weight="600" text-anchor="start">调用方</text>
<text x="1306.0" y="700.5" font-size="14" fill="#2C2C2A" text-anchor="start">按业务决定：稍后重试命令，或销</text>
<text x="1306.0" y="721.5" font-size="14" fill="#2C2C2A" text-anchor="start">毁重建</text>
<path d="M68.0 409.5 V423.5 H900.0 V409.5" fill="none" stroke="#888780" stroke-width="1.4"/>
<line x1="260.0" y1="425.5" x2="260.0" y2="469.5" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
