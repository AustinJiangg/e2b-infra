<text x="414.6" y="280.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<text x="484.0" y="326.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">暂停，物化回滚集</text>
<text x="484.0" y="354.5" font-size="14" fill="#5F5E5A" text-anchor="middle">MaterializeRevert：查断链、算</text>
<text x="484.0" y="375.5" font-size="14" fill="#5F5E5A" text-anchor="middle">回滚路径、写物化文件</text>
