<rect x="996.0" y="265.0" width="191.1" height="22.0" rx="11" fill="#FFFFFF" stroke="#D85A30" stroke-width="0.8"/>
<text x="1091.6" y="280.5" font-size="12" fill="#993C1D" font-weight="500" text-anchor="middle">Firecracker / orchestrator</text>
<text x="1116.0" y="326.7" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">Firecracker 提交点之后</text>
<text x="1116.0" y="354.5" font-size="14" fill="#993C1D" text-anchor="middle">写内存、vCPU、GIC、设备；再</text>
<text x="1116.0" y="375.5" font-size="14" fill="#993C1D" text-anchor="middle">ResetView 切磁盘、resume</text>
<line x1="1252.0" y1="329.8" x2="1282.0" y2="329.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
