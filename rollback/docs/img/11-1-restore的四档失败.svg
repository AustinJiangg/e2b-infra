<text x="180.0" y="316.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">读磁盘视图、装配视图</text>
<text x="180.0" y="344.0" font-size="14" fill="#5F5E5A" text-anchor="middle">DiskViewForEntry、</text>
<text x="180.0" y="365.0" font-size="14" fill="#5F5E5A" text-anchor="middle">AssembleView，在暂停虚机之前</text>
<text x="180.0" y="386.0" font-size="14" fill="#5F5E5A" text-anchor="middle">完成</text>
