<rect width="1600" height="1569" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">restore 的四档失败：落在提交点哪一侧，决定沙箱还能不能用</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">提交点之前失败，guest 一个字节都没动，虚机恢复运行；之后失败，虚机是两个时刻的混合体，按撕裂处理；回滚完成后 guest 不应答，宿主侧已完成，不是撕裂。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">执行顺序</text>
<line x1="192.0" y1="125.0" x2="232.0" y2="125.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="242.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">失败后恢复运行</text>
<line x1="376.5" y1="125.0" x2="416.5" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="426.5" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">撕裂：虚机保持暂停</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">一次 restore 走过的阶段，以及每段失败落在哪一档</text>
<rect x="583.5" y="168.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="620.5" y="184.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<text x="673.5" y="184.0" font-size="14.5" fill="#888780" text-anchor="start">orchestrator 侧 RollbackInPlace，Firecracker 侧 faults_vm()</text>
<text x="484.0" y="228.0" font-size="14" fill="#888780" font-weight="600" text-anchor="middle">提交点之前：guest 状态没动</text>
<line x1="48.0" y1="238.0" x2="920.0" y2="238.0" stroke="#D3D1C7" stroke-width="1.2"/>
<text x="1116.0" y="228.0" font-size="14" fill="#888780" font-weight="600" text-anchor="middle">提交点之后：guest 已改</text>
