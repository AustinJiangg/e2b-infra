<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">950 HDBSS 写密集基准：连续页与随机散页的 checkpoint、restore 墙钟</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">950（slot6，Kunpeng 950 7592C），2026-10-13 HDBSS 专项（20261013-165204-hdbss），默认 order 1；arena 1024 MiB，每页写 1 字节，每组合 n = 3 取中位数。只画单写者，双写者见正文表。</text>
