<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1260" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">两种快照的根本差别：产物是否自足，恢复是否依赖原来那个活着的进程</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">原生快照选“自足 + 重建”，服务沙箱离场之后；本方案选“活体 + 原地”，服务活沙箱里的高频回退。各自的长处和边界都从这一个选择推出来。逐步的恢复过程见图 09-1。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">先后顺序</text>
<line x1="192.0" y1="125.0" x2="232.0" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="242.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">停机、重建的代价</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">各解决什么问题，怎样拍、怎样恢复</text>
<rect x="430.0" y="168.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="467.0" y="184.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<rect x="48.0" y="204.0" width="1504.0" height="906.5" rx="16" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<rect x="220.0" y="224.0" width="645.0" height="62.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6"/>
<text x="542.5" y="252.0" font-size="19" fill="#712B13" font-weight="600" text-anchor="middle">原生快照：自足 + 重建</text>
<text x="542.5" y="274.0" font-size="13.5" fill="#993C1D" text-anchor="middle">Pause / Checkpoint RPC / resume</text>
<rect x="887.0" y="224.0" width="645.0" height="62.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.6"/>
<text x="1209.5" y="252.0" font-size="19" fill="#085041" font-weight="600" text-anchor="middle">本方案：活体 + 原地</text>
<text x="1209.5" y="274.0" font-size="13.5" fill="#0F6E56" text-anchor="middle">checkpoint / restore</text>
<text x="68.0" y="340.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">面向的需求</text>
<rect x="260.0" y="302.0" width="565.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="327.8" font-size="16" fill="#712B13" font-weight="600" text-anchor="middle">沙箱离场之后</text>
<text x="542.5" y="354.7" font-size="13" fill="#993C1D" text-anchor="middle">离场再回来、长期保存、跨节点迁移、崩溃恢复、冷启动</text>
<rect x="927.0" y="302.0" width="565.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="327.8" font-size="16" fill="#085041" font-weight="600" text-anchor="middle">活沙箱里的高频快速回退</text>
<text x="1209.5" y="354.7" font-size="13" fill="#0F6E56" text-anchor="middle">高频、低延迟、沙箱不能中断</text>
<text x="68.0" y="435.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">拍快照</text>
<rect x="220.0" y="398.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="423.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">停掉沙箱，导出内存与磁盘差分</text>
<text x="542.5" y="450.2" font-size="13" fill="#993C1D" text-anchor="middle">Checkpoint RPC 再从新快照拉起新进程：SandboxID / ExecutionID 不变，LifecycleID 换新</text>
<rect x="887.0" y="398.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="423.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">一次短暂停，然后继续跑</text>
<text x="1209.5" y="450.2" font-size="13" fill="#0F6E56" text-anchor="middle">Firecracker 写本代脏页的稀疏差分，磁盘写层原地封存</text>
<text x="68.0" y="531.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">产物</text>
<rect x="220.0" y="493.5" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="518.8" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">自足：snapfile、内存差分、磁盘差分、header 映射链</text>
<text x="542.5" y="545.7" font-size="13" fill="#993C1D" text-anchor="middle">进对象存储或本地模板存储，任何节点都能据此新建进程</text>
<line x1="542.5" y1="465.5" x2="542.5" y2="488.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="887.0" y="493.5" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="518.8" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">相对模板的增量，宿主本地</text>
<text x="1209.5" y="545.7" font-size="13" fill="#0F6E56" text-anchor="middle">随这一代 Firecracker 进程回收</text>
<line x1="1209.5" y1="465.5" x2="1209.5" y2="488.5" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="68.0" y="626.8" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">恢复</text>
<rect x="220.0" y="589.0" width="645.0" height="65.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="614.3" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">新建进程</text>
<text x="542.5" y="641.2" font-size="13" fill="#993C1D" text-anchor="middle">建 KVM 虚机、vCPU、中断控制器、virtio 设备、tap、uffd，加载 snapfile，缺页换回工作集</text>
<line x1="542.5" y1="561.0" x2="542.5" y2="584.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<rect x="887.0" y="589.0" width="645.0" height="65.5" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="614.3" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">一次暂停里写回同一个进程</text>
<text x="1209.5" y="641.2" font-size="13" fill="#0F6E56" text-anchor="middle">回滚集的页、vCPU、中断控制器、设备状态；磁盘视图原地切换</text>
<line x1="1209.5" y1="561.0" x2="1209.5" y2="584.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="68.0" y="717.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">边界</text>
<rect x="220.0" y="684.5" width="645.0" height="56.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="542.5" y="718.1" font-size="15.5" fill="#712B13" font-weight="600" text-anchor="middle">每次拍都停机导出，每次恢复都重建、重新换入工作集</text>
<rect x="887.0" y="684.5" width="645.0" height="56.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="1209.5" y="718.1" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">产物离开这个进程就没有意义</text>
<line x1="68" y1="772.5" x2="1532" y2="772.5" stroke="#D3D1C7" stroke-width="1"/>
<text x="68.0" y="806.5" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="start">逐项对比</text>
<rect x="62.0" y="824.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="852.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">打快照 · guest 停顿</text>
<text x="542.5" y="852.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">整个操作</text>
<text x="1209.5" y="852.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">O(D) 的冻结窗口</text>
<text x="68.0" y="896.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">恢复 · 进程与设备</text>
<text x="542.5" y="896.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">全部重建</text>
<text x="1209.5" y="896.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">零</text>
<rect x="62.0" y="912.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="940.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">恢复 · 内存</text>
<text x="542.5" y="940.5" font-size="15" fill="#2C2C2A" text-anchor="middle">O(W) 缺页换入</text>
<text x="1209.5" y="940.5" font-size="15" fill="#2C2C2A" text-anchor="middle">O(R) 写回</text>
<text x="68.0" y="984.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">历史结构</text>
<text x="542.5" y="984.5" font-size="15" fill="#2C2C2A" text-anchor="middle">线性链</text>
<text x="1209.5" y="984.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">树，可前滚、可跨分支</text>
<rect x="62.0" y="1000.5" width="1476.0" height="44.0" rx="6" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="68.0" y="1028.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">跨节点 / 崩溃恢复</text>
<text x="542.5" y="1028.5" font-size="15" fill="#0F6E56" font-weight="600" text-anchor="middle">可以</text>
<text x="1209.5" y="1028.5" font-size="15" fill="#A32D2D" font-weight="600" text-anchor="middle">不可以</text>
<text x="68.0" y="1072.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="start">典型频次</text>
<text x="542.5" y="1072.5" font-size="15" fill="#2C2C2A" text-anchor="middle">一个沙箱一两次</text>
<text x="1209.5" y="1072.5" font-size="15" fill="#2C2C2A" text-anchor="middle">一个任务里十几次</text>
<rect x="48.0" y="1126.5" width="1504.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="800.0" y="1152.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">要让 checkpoint 脱离活沙箱，需补齐全量产物、压平磁盘层、从文件重建账本、恢复改成新建进程；补齐之后就是原生 snapshot，沿途丢掉的正是本方案的全部收益（第 12 章 §15）</text>
<line x1="48" y1="1202.5" x2="1552" y2="1202.5" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1228.5" font-size="13" fill="#888780" text-anchor="start">注：D = 本次改动量，R = 回退跨度，W = 工作集（§3.2 成本模型）。完整的机制对比见 §3.1 表。</text>
</svg>