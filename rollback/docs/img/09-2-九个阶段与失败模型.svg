<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1534" viewBox="0 0 1600 1534" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-back" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#0F6E56" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1534" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">原地回滚的九个阶段：提交点把失败分成两半</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">阶段 1–3 失败时 guest 一个字节都没动，恢复运行即可；阶段 4 起改 guest 状态，此后失败虚机是两个时刻的混合体，标记 Faulted，只能重建沙箱。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">执行顺序</text>
<line x1="192.0" y1="125.0" x2="232.0" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="242.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">提交点之后失败</text>
<line x1="376.5" y1="125.0" x2="416.5" y2="125.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<text x="426.5" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">提交点之前失败：恢复运行</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">九个阶段与各段失败时虚机的状态</text>
<rect x="410.0" y="168.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="447.0" y="184.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<text x="500.0" y="184.0" font-size="14.5" fill="#888780" text-anchor="start">虚机全程暂停，在 VMM 线程上执行（rollback_snapshot_inner）</text>
<text x="100.0" y="230.0" font-size="14" fill="#888780" font-weight="600" text-anchor="start">阶段 · 做什么</text>
<text x="728.0" y="230.0" font-size="14" fill="#888780" font-weight="600" text-anchor="start">副作用</text>
<text x="994.0" y="230.0" font-size="14" fill="#888780" font-weight="600" text-anchor="start">计时键</text>
<text x="1220.0" y="230.0" font-size="14" fill="#888780" font-weight="600" text-anchor="start">这一段失败时</text>
<rect x="100.0" y="246.0" width="600.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="271.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 1 · 校验</text>
<text x="400.0" y="298.4" font-size="13" fill="#0F6E56" text-anchor="middle">状态、快照可读、拓扑、内存文件长度、位图几何</text>
<text x="728.0" y="284.0" font-size="14" fill="#5F5E5A" text-anchor="start">无</text>
<text x="994.0" y="284.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">fc_validate</text>
<rect x="100.0" y="338.0" width="600.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="363.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 2 · 静默</text>
<text x="400.0" y="390.4" font-size="13" fill="#0F6E56" text-anchor="middle">排空在途设备 I/O</text>
<text x="728.0" y="376.0" font-size="14" fill="#5F5E5A" text-anchor="start">丢弃 tap 缓存帧，不改 guest 状态</text>
<text x="994.0" y="376.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">fc_quiesce</text>
<rect x="100.0" y="430.0" width="600.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="455.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 3 · 取活跃脏图</text>
<text x="400.0" y="482.4" font-size="13" fill="#0F6E56" text-anchor="middle">取 KVM 脏页日志折回用户态位图，与调用方给的位图求并；校验内存文件覆盖回滚集</text>
<text x="728.0" y="468.0" font-size="14" fill="#5F5E5A" text-anchor="start">只改 Firecracker 自己的账</text>
<text x="994.0" y="468.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">fc_bitmap</text>
<rect x="100.0" y="586.0" width="600.0" height="66.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="611.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 4 · 内存</text>
<text x="400.0" y="638.4" font-size="13" fill="#0F6E56" text-anchor="middle">按回滚集把页写回活映射</text>
<text x="728.0" y="624.0" font-size="14" fill="#993C1D" font-weight="600" text-anchor="start">改 guest 状态</text>
<text x="994.0" y="624.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">fc_memory</text>
<rect x="100.0" y="678.0" width="600.0" height="66.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="703.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 5 · vCPU</text>
<text x="400.0" y="730.4" font-size="13" fill="#0F6E56" text-anchor="middle">排干挂起 MMIO → 复位 → 全寄存器恢复 → 读回比对</text>
<text x="728.0" y="716.0" font-size="14" fill="#993C1D" font-weight="600" text-anchor="start">改 guest 状态</text>
<text x="994.0" y="716.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">fc_vcpus</text>
<rect x="100.0" y="770.0" width="600.0" height="66.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="795.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 6 · 中断控制器</text>
<text x="400.0" y="822.4" font-size="13" fill="#0F6E56" text-anchor="middle">对既有 GIC fd 绝对写回；清串口那根 SPI</text>
<text x="728.0" y="808.0" font-size="14" fill="#993C1D" font-weight="600" text-anchor="start">改 guest 状态</text>
<text x="994.0" y="808.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">fc_gic</text>
<rect x="100.0" y="862.0" width="600.0" height="66.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="887.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 7 · 设备</text>
<text x="400.0" y="914.4" font-size="13" fill="#0F6E56" text-anchor="middle">virtio 队列、协商特性、中断状态；串口复位；RX 缓存；tap offload</text>
<text x="728.0" y="900.0" font-size="14" fill="#993C1D" font-weight="600" text-anchor="start">改 guest 状态</text>
<text x="994.0" y="900.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">fc_devices</text>
<rect x="100.0" y="954.0" width="600.0" height="66.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="979.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 8 · VMGenID</text>
<text x="400.0" y="1006.4" font-size="13" fill="#0F6E56" text-anchor="middle">写入新代号，通知 guest 时间被回拨</text>
<text x="728.0" y="992.0" font-size="14" fill="#993C1D" font-weight="600" text-anchor="start">改 guest 状态</text>
<text x="994.0" y="992.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">计入 fc_devices</text>
<rect x="100.0" y="1046.0" width="600.0" height="66.0" rx="10" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2"/>
<text x="400.0" y="1071.6" font-size="15.5" fill="#085041" font-weight="600" text-anchor="middle">阶段 9 · 重置基线</text>
<text x="400.0" y="1098.4" font-size="13" fill="#0F6E56" text-anchor="middle">清用户态脏页位图，重新标脏队列页</text>
<text x="728.0" y="1084.0" font-size="14" fill="#5F5E5A" text-anchor="start">改 Firecracker 的账</text>
<text x="994.0" y="1084.0" font-size="13.5" fill="#2C2C2A" text-anchor="start">计入 fc_total</text>
<line x1="140.0" y1="314.0" x2="140.0" y2="333.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="140.0" y1="406.0" x2="140.0" y2="425.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="140.0" y1="498.0" x2="140.0" y2="581.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="140.0" y1="654.0" x2="140.0" y2="673.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="140.0" y1="746.0" x2="140.0" y2="765.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="140.0" y1="838.0" x2="140.0" y2="857.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="140.0" y1="930.0" x2="140.0" y2="949.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="140.0" y1="1022.0" x2="140.0" y2="1041.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="48" y1="543.0" x2="1552" y2="543.0" stroke="#D85A30" stroke-width="2.4" stroke-dasharray="10 6"/>
<rect x="190.0" y="528.0" width="554.6" height="30.0" rx="15" fill="#FFFFFF" stroke="#D85A30" stroke-width="1.2"/>
<text x="467.3" y="548.5" font-size="15" fill="#712B13" font-weight="600" text-anchor="middle">提交点：此后 guest 内存开始改变（faults_vm 的穷尽匹配把错误分成两半）</text>
<rect x="1220.0" y="246.0" width="332.0" height="250.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1386.0" y="352.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">虚机原封不动</text>
<text x="1386.0" y="380.8" font-size="14" fill="#5F5E5A" text-anchor="middle">HTTP 400；orchestrator 恢复运行，沙箱继</text>
<text x="1386.0" y="401.8" font-size="14" fill="#5F5E5A" text-anchor="middle">续可用。拓扑校验、覆盖校验的拒绝都在这一段</text>
<rect x="1220.0" y="586.0" width="332.0" height="526.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="1386.0" y="830.9" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">标记 Faulted</text>
<text x="1386.0" y="858.8" font-size="14" fill="#993C1D" text-anchor="middle">HTTP 500 且响应体 "fault": true；拒绝</text>
<text x="1386.0" y="879.8" font-size="14" fill="#993C1D" text-anchor="middle">resume 与 snapshot；只能重建沙箱</text>
<line x1="1102.0" y1="371.0" x2="1214.0" y2="371.0" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#ar-back)"/>
<line x1="1102.0" y1="849.0" x2="1214.0" y2="849.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<rect x="190.0" y="746.0" width="795.0" height="22.0" rx="11" fill="#FFFFFF" stroke="#D85A30" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="587.5" y="761.5" font-size="12.5" fill="#993C1D" font-weight="600" text-anchor="middle">测试注入点：FC_ROLLBACK_FAULT_INJECT=post_commit 在此注入 RollbackError::Gic（仅 rollback-fault-inject 构建）</text>
<line x1="140.0" y1="1114.0" x2="140.0" y2="1148.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="100.0" y="1152.0" width="600.0" height="58.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="400.0" y="1173.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">resume_vm：踢设备重新处理队列</text>
<text x="400.0" y="1200.4" font-size="13" fill="#5F5E5A" text-anchor="middle">每次恢复都会无条件做，回滚本身不必为此多做什么</text>
<circle cx="63" cy="1256" r="15" fill="#2C2C2A"/>
<text x="63.0" y="1261.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="1263.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">orchestrator 怎样处理（RollbackInPlace）</text>
<text x="555.1" y="1262.0" font-size="14.5" fill="#888780" text-anchor="start">internal/sandbox/checkpoint.go</text>
<rect x="48.0" y="1284.0" width="358.0" height="100.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="227.0" y="1316.2" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">响应体 fault 为 true</text>
<text x="227.0" y="1344.0" font-size="14" fill="#993C1D" text-anchor="middle">RollbackFaultedError →</text>
<text x="227.0" y="1365.0" font-size="14" fill="#993C1D" text-anchor="middle">RollbackTornError</text>
<rect x="430.0" y="1284.0" width="358.0" height="100.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="609.0" y="1316.2" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">rollback 调用超时</text>
<text x="609.0" y="1344.0" font-size="14" fill="#993C1D" text-anchor="middle">CHECKPOINT_FC_CALL_TIMEOUT 内没应答，</text>
<text x="609.0" y="1365.0" font-size="14" fill="#993C1D" text-anchor="middle">判断不了停在提交点哪一侧，同样按撕裂处理</text>
<rect x="812.0" y="1284.0" width="358.0" height="100.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="991.0" y="1316.2" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">磁盘 ResetView 失败</text>
<text x="991.0" y="1344.0" font-size="14" fill="#993C1D" text-anchor="middle">内存已在目标时刻、磁盘还不是：也在提交点之后，</text>
<text x="991.0" y="1365.0" font-size="14" fill="#993C1D" text-anchor="middle">返回 RollbackTornError</text>
<rect x="1194.0" y="1284.0" width="358.0" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1373.0" y="1316.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">其余错误</text>
<text x="1373.0" y="1344.0" font-size="14" fill="#5F5E5A" text-anchor="middle">join conntrack 清理后恢复虚机，按普通失败返</text>
<text x="1373.0" y="1365.0" font-size="14" fill="#5F5E5A" text-anchor="middle">回，沙箱在原状态继续运行</text>
<rect x="48.0" y="1400.5" width="1504.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="800.0" y="1426.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">磁盘视图的装配（AssembleView）在暂停之前完成，装配失败只是一次普通的失败 restore</text>
<line x1="48" y1="1476.5" x2="1552" y2="1476.5" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1502.5" font-size="13" fill="#888780" text-anchor="start">注：Faulted 由 rollback_snapshot 自己标记（brand_vm_on_faulting_failure），不依赖 HTTP 层。各阶段计时单位为微秒，orchestrator 把它们摊平进自己的 timings。</text>
</svg>