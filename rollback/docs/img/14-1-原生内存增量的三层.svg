<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="715" viewBox="0 0 1600 715" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#D85A30" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="715" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">原生内存增量的三层：判据再精细，也被 2 MiB 的 guest 页锁在 2 MiB 块上</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">修复前原生 pause 的内存路径按“谁决定粒度”切成判、存、填三层。③ 的硬检查要求 guest 页大小等于 header 的 BlockSize，把三层的粒度连在一起。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">执行顺序</text>
<line x1="192.0" y1="125.0" x2="232.0" y2="125.0" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<text x="242.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">粒度约束的传递方向</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">三层按执行顺序</text>
<text x="250.0" y="184.0" font-size="14.5" fill="#888780" text-anchor="start">pause 时做 ① ②，恢复时做 ③</text>
<rect x="48.0" y="206.0" width="469.3" height="184.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="60.0" y="217.0" width="95.6" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="107.8" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">Firecracker</text>
<rect x="60.0" y="338.5" width="445.3" height="44.0" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="282.7" y="355.5" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle">修复前：GET /memory/dirty，mincore 驻留 ∧ pagemap bit 57 未置</text>
<text x="282.7" y="373.5" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle">位，按 BlockSize 取</text>
<text x="282.7" y="278.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">① 判：哪些页要导出</text>
<text x="282.7" y="306.5" font-size="14" fill="#5F5E5A" text-anchor="middle">粒度由判据接口返回的位图决定</text>
<line x1="521.3" y1="298.2" x2="559.3" y2="298.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="565.3" y="206.0" width="469.3" height="184.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="577.3" y="217.0" width="101.2" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="627.9" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<rect x="577.3" y="356.5" width="445.3" height="26.0" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="800.0" y="373.5" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle">修复前：模板 header 是 2 MiB，之后每代都是 2 MiB</text>
<text x="800.0" y="277.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">② 存：按块拷进紧凑差分文件</text>
<text x="800.0" y="305.0" font-size="14" fill="#5F5E5A" text-anchor="middle">header 记下每一块在哪一代的哪个偏移；粒度由 header 的</text>
<text x="800.0" y="326.0" font-size="14" fill="#5F5E5A" text-anchor="middle">BlockSize 决定，逐代继承</text>
<line x1="1038.7" y1="298.2" x2="1076.7" y2="298.2" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1082.7" y="206.0" width="469.3" height="184.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1094.7" y="217.0" width="101.2" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1145.2" y="232.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">orchestrator</text>
<rect x="1094.7" y="338.5" width="445.3" height="44.0" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="1317.3" y="355.5" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle">NewUserfaultfdFromFd 硬性要求 guest 页大小 == BlockSize，否</text>
<text x="1317.3" y="373.5" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle">则拒绝启动</text>
<text x="1317.3" y="268.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">③ 填：恢复时 uffd 缺页</text>
<text x="1317.3" y="296.0" font-size="14" fill="#5F5E5A" text-anchor="middle">按 guest 页从映射链取内容，UFFDIO_COPY 进去；粒度是 guest</text>
<text x="1317.3" y="317.0" font-size="14" fill="#5F5E5A" text-anchor="middle">页大小（hugetlbfs 2 MiB）</text>
<circle cx="63" cy="436.5" r="15" fill="#2C2C2A"/>
<text x="63.0" y="442.0" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="443.5" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">粒度怎样被锁在一起</text>
<rect x="290.0" y="426.5" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="327.0" y="442.5" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<text x="380.0" y="442.5" font-size="14.5" fill="#888780" text-anchor="start">从 guest 页出发，约束一路传到判据</text>
<rect x="48.0" y="464.5" width="265.6" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="180.8" y="507.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">guest 页 = 2 MiB</text>
<text x="180.8" y="535.0" font-size="14" fill="#5F5E5A" text-anchor="middle">hugetlbfs 大页背衬</text>
<line x1="317.6" y1="514.8" x2="351.6" y2="514.8" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<rect x="357.6" y="464.5" width="265.6" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="490.4" y="496.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">③ 一次缺页填一整页</text>
<text x="490.4" y="524.5" font-size="14" fill="#5F5E5A" text-anchor="middle">只能按 2 MiB 填，UFFDIO_COPY</text>
<text x="490.4" y="545.5" font-size="14" fill="#5F5E5A" text-anchor="middle">必须给满</text>
<line x1="627.2" y1="514.8" x2="661.2" y2="514.8" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<rect x="667.2" y="464.5" width="265.6" height="100.5" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="800.0" y="507.2" font-size="16.5" fill="#712B13" font-weight="600" text-anchor="middle">③ 的硬检查</text>
<text x="800.0" y="535.0" font-size="14" fill="#993C1D" text-anchor="middle">guest 页大小 == BlockSize</text>
<line x1="936.8" y1="514.8" x2="970.8" y2="514.8" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<rect x="976.8" y="464.5" width="265.6" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1109.6" y="507.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">② BlockSize = 2 MiB</text>
<text x="1109.6" y="535.0" font-size="14" fill="#5F5E5A" text-anchor="middle">写在 header 里，逐代继承</text>
<line x1="1246.4" y1="514.8" x2="1280.4" y2="514.8" stroke="#D85A30" stroke-width="1.8" marker-end="url(#ar-warn)"/>
<rect x="1286.4" y="464.5" width="265.6" height="100.5" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1419.2" y="507.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">① 位图再精细</text>
<text x="1419.2" y="535.0" font-size="14" fill="#5F5E5A" text-anchor="middle">也要归并到 2 MiB 块导出</text>
<rect x="48.0" y="581.0" width="1504.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="800.0" y="607.0" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">① 决定“读算不算脏”，② 和 ③ 决定“最小能存多细”：两件事要分开治</text>
<line x1="48" y1="657.0" x2="1552" y2="657.0" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="683.0" font-size="13" fill="#888780" text-anchor="start">注：修复后 ① 换成写跟踪位图（4 KiB），② 的 BlockSize 降到 4 KiB，③ 的硬检查从“相等”放宽为“整除”，缺页仍按 2 MiB，内容从 4 KiB 映射拼（§8）。</text>
</svg>