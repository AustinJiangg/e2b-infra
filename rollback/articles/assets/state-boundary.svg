<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 422" role="img" aria-labelledby="title desc"><title id="title">沙箱级恢复的边界</title><desc id="desc">沙箱内部状态共同恢复；外部控制程序、数据库、API 与消息不随之撤销。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657c72"/></marker></defs><rect width="800" height="422" fill="#fafaf7"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="36" y="42" font-size="23" fill="#25333b" font-weight="700" text-anchor="start">保存与恢复，覆盖同一个沙箱内部</text><rect x="36" y="72" width="728" height="201" rx="12" fill="#edf4ee" stroke="#88b5a5"/><text x="58" y="106" font-size="17" fill="#216357" font-weight="650" text-anchor="start">同一个活沙箱 · 同一协调恢复点</text><rect x="58" y="131" width="212" height="100" rx="10" fill="#ffffff" stroke="#d2dcd7"/><text x="76" y="164" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">内存与进程</text><text x="76" y="192" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">变量、任务、内核缓存</text><rect x="294" y="131" width="212" height="100" rx="10" fill="#ffffff" stroke="#d2dcd7"/><text x="312" y="164" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">CPU 与设备</text><text x="312" y="192" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">执行与设备逻辑状态</text><rect x="530" y="131" width="212" height="100" rx="10" fill="#ffffff" stroke="#d2dcd7"/><text x="548" y="164" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">根文件系统</text><text x="548" y="192" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">依赖、配置、文件</text><text x="58" y="255" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">操作期间短暂冻结；跨恢复连接需要重建</text><path d="M 36 301 H 764" stroke="#a8b8b0" stroke-dasharray="5 5"/><text x="36" y="332" font-size="17" fill="#25333b" font-weight="650" text-anchor="start">外部世界</text><text x="174" y="332" font-size="17" fill="#25333b" font-weight="400" text-anchor="start">Agent 控制程序　／　外部数据库　／　API 与消息</text><text x="174" y="366" font-size="15" fill="#53665e" font-weight="400" text-anchor="start">已发生的变化仍然存在，由业务协调记录、去重或补偿。</text></g></svg>
