<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">从保存点重新尝试</title><desc id="desc">准备完成后保存 S，尝试 A 失败，恢复 S 后尝试 B。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657c72"/></marker></defs><rect width="800" height="360" fill="#fafaf7"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="36" y="42" font-size="23" fill="#25333b" font-weight="700" text-anchor="start">保留已有进展，再选择一条路</text><rect x="36" y="88" width="216" height="86" rx="10" fill="#e8f2ec" stroke="#88b5a5"/><text x="54" y="121" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">准备完成 · 保存 S</text><text x="54" y="149" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">依赖、服务、数据已就绪</text><rect x="292" y="88" width="210" height="86" rx="10" fill="#ffffff" stroke="#d2dcd7"/><text x="310" y="121" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">尝试 A</text><text x="310" y="149" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">修改依赖与配置</text><rect x="542" y="88" width="222" height="86" rx="10" fill="#ffffff" stroke="#d2dcd7"/><text x="560" y="121" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">验证失败</text><text x="560" y="149" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">当前环境已被改变</text><path d="M 252 131 H 286" fill="none" stroke="#657c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M 502 131 H 536" fill="none" stroke="#657c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M 653 174 V 213 H 144 V 180" fill="none" stroke="#657c72" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="399" y="204" font-size="15" fill="#216357" font-weight="650" text-anchor="middle">恢复 S</text><path d="M 144 174 V 275 H 286" fill="none" stroke="#657c72" stroke-width="2" marker-end="url(#arrow)"/><rect x="292" y="232" width="210" height="86" rx="10" fill="#e8f2ec" stroke="#88b5a5"/><text x="310" y="265" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">尝试 B</text><text x="310" y="293" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">从同一保存点开始</text><path d="M 502 275 H 536" fill="none" stroke="#657c72" stroke-width="2" marker-end="url(#arrow)"/><rect x="542" y="232" width="222" height="86" rx="10" fill="#e8f2ec" stroke="#88b5a5"/><text x="560" y="265" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">验证通过</text><text x="560" y="293" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">保留结果，继续推进</text></g></svg>
