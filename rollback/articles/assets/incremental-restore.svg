<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 468" role="img" aria-labelledby="title desc"><title id="title">增量保存与活体原地恢复</title><desc id="desc">完整基点与后续差分组成历史，计算回滚集并在原虚拟机内恢复。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657c72"/></marker></defs><rect width="800" height="468" fill="#fafaf7"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="36" y="42" font-size="23" fill="#25333b" font-weight="700" text-anchor="start">尽量只处理本次变化，复用活沙箱资源</text><rect x="36" y="80" width="216" height="88" rx="10" fill="#e8f2ec" stroke="#88b5a5"/><text x="54" y="113" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">首次保存 · S</text><text x="54" y="141" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">完整内存基点 + 磁盘视图</text><rect x="292" y="80" width="216" height="88" rx="10" fill="#ffffff" stroke="#d2dcd7"/><text x="310" y="113" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">后续保存 · A</text><text x="310" y="141" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">内存差分 + 封存磁盘层</text><rect x="548" y="80" width="216" height="88" rx="10" fill="#ffffff" stroke="#d2dcd7"/><text x="566" y="113" font-size="19" fill="#25333b" font-weight="650" text-anchor="start">当前运行状态</text><text x="566" y="141" font-size="14" fill="#53665e" font-weight="400" text-anchor="start">还可能有未保存的改动</text><path d="M 252 123 H 286" fill="none" stroke="#657c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M 508 123 H 542" fill="none" stroke="#657c72" stroke-width="2" marker-end="url(#arrow)"/><path d="M 144 168 V 200 H 400 V 224" fill="none" stroke="#657c72" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 400 168 V 224" fill="none" stroke="#657c72" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 656 168 V 200 H 400" fill="none" stroke="#657c72" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="212" y="230" width="376" height="73" rx="10" fill="#ffffff" stroke="#d2dcd7"/><text x="400" y="261" font-size="18" fill="#25333b" font-weight="650" text-anchor="middle">计算从当前状态回到 S 的回滚集</text><text x="400" y="286" font-size="14" fill="#53665e" font-weight="400" text-anchor="middle">按历史取得目标页，准备目标磁盘视图</text><path d="M 400 303 V 330" fill="none" stroke="#657c72" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="336" width="728" height="98" rx="12" fill="#e8f2ec" stroke="#88b5a5"/><text x="400" y="369" font-size="21" fill="#216357" font-weight="650" text-anchor="middle">在同一个 Firecracker 进程中恢复</text><text x="400" y="401" font-size="16" fill="#25333b" font-weight="400" text-anchor="middle">协调暂停 → 切换磁盘视图、写回内存与执行状态 → 继续运行</text></g></svg>
