<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">920B 同平台：两套方案的增量 checkpoint 与 restore 客户端墙钟随档位变化</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">新 920B，客户端墙钟，单位 ms。沙箱级 2026-09-29；进程级 2026-10-16、2026-11-06 两轮，取三轮中位数。沙箱级每档 n = 100（0～64 MiB）、60（128、256 MiB）；进程级每档</text>
<text x="48.0" y="120.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">n = 3。两侧的内存与文件负载、沙箱与次序、缓存状态、模板和脏页后端（kvm-wp 与 soft-dirty）都不同（§4.6），图中的高低只描述这组实测。</text>
