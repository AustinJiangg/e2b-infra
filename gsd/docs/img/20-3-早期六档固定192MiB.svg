<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="774" viewBox="0 0 1400 774" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
