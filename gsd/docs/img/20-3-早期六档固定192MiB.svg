<rect width="1400" height="774" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">早期六档，固定 192 MiB 进程：checkpoint 与 restore 随改动量的变化</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">920B，2026-10-08，2026-10-16 之前的测法：一个预分配 192 MiB 的常驻进程按六档依次改写内存并写文件，每档一次 checkpoint，最后逐个 restore 回去。脚本连跑三次，取三次</text>
<text x="48.0" y="120.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">的中位数，每次运行每档一个样本。</text>
