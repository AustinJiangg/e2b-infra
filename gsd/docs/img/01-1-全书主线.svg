<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="860" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">全书主线：一次 checkpoint、一次 restore 各经过哪几章</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">每个框是主线上的一段，左上角是讲它的章（原理与实现）。全书各章是在放大这两条路径上的某一步；把两条路径完整走一遍、标出每个计时字段落在哪一步的是第 13 章。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">执行顺序</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">一次 checkpoint</text>
<text x="271.8" y="184.0" font-size="14.5" fill="#888780" text-anchor="start">§4.1 的第 1～10 步</text>
<rect x="48.0" y="206.0" width="268.8" height="151.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="60.0" y="217.0" width="112.5" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="116.2" y="232.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">05 · 14 · 15 · 25</text>
<text x="182.4" y="278.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">请求进到 gsd</text>
<text x="182.4" y="306.5" font-size="14" fill="#534AB7" text-anchor="middle">SDK 发到 49984 端口，宿主代理转</text>
<text x="182.4" y="327.5" font-size="14" fill="#534AB7" text-anchor="middle">进沙箱；gsd 校验 token，取串行锁</text>
<line x1="320.8" y1="281.8" x2="350.8" y2="281.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="356.8" y="206.0" width="268.8" height="151.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="368.8" y="217.0" width="59.1" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="398.3" y="232.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">10 · 15</text>
<text x="491.2" y="268.2" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">扫描与预检</text>
<text x="491.2" y="296.0" font-size="14" fill="#534AB7" text-anchor="middle">扫一次 /proc 找出全部树的根；树之</text>
<text x="491.2" y="317.0" font-size="14" fill="#534AB7" text-anchor="middle">间有没有共用的管道或 socket，镜像</text>
<text x="491.2" y="338.0" font-size="14" fill="#534AB7" text-anchor="middle">放不放得下</text>
<line x1="629.6" y1="281.8" x2="659.6" y2="281.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="665.6" y="206.0" width="268.8" height="151.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="677.6" y="217.0" width="59.1" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="707.1" y="232.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">03 · 11</text>
<text x="800.0" y="278.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">逐树 CRIU dump</text>
<text x="800.0" y="306.5" font-size="14" fill="#534AB7" text-anchor="middle">做完的树停在原地；能做增量的树只</text>
<text x="800.0" y="327.5" font-size="14" fill="#534AB7" text-anchor="middle">写脏页</text>
<line x1="938.4" y1="281.8" x2="968.4" y2="281.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="974.4" y="206.0" width="268.8" height="151.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="986.4" y="217.0" width="85.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="1029.3" y="232.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">07 · 08 · 09</text>
<text x="1108.8" y="278.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">沉层、换新可写层</text>
<text x="1108.8" y="306.5" font-size="14" fill="#534AB7" text-anchor="middle">所有树都停住之后，当前可写层沉成</text>
<text x="1108.8" y="327.5" font-size="14" fill="#534AB7" text-anchor="middle">只读层</text>
<line x1="1247.2" y1="281.8" x2="1277.2" y2="281.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1283.2" y="206.0" width="268.8" height="151.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="1295.2" y="217.0" width="112.5" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="1351.5" y="232.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">03 · 11 · 15 · 28</text>
<text x="1417.6" y="278.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">重清 soft-dirty，继续运行</text>
<text x="1417.6" y="306.5" font-size="14" fill="#534AB7" text-anchor="middle">记录 checkpoint、写状态文件，各</text>
<text x="1417.6" y="327.5" font-size="14" fill="#534AB7" text-anchor="middle">阶段耗时随响应返回</text>
<rect x="665.6" y="373.5" width="886.4" height="40.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="1108.8" y="399.5" font-size="14.5" fill="#3C3489" font-weight="600" text-anchor="middle">第 3～5 段在同一段“进程全部停着”的窗口里：进程镜像与沉下去的文件系统是同一时刻</text>
<rect x="48.0" y="429.5" width="1504.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="800.0" y="455.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">任何一步失败：放开已停住的进程，删掉这次的镜像，沙箱回到原状（第 14 章）</text>
<circle cx="63" cy="515.5" r="15" fill="#2C2C2A"/>
<text x="63.0" y="521.0" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="522.5" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">一次 restore</text>
<rect x="237.2" y="505.5" width="178.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="326.1" y="521.5" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">提交点：杀掉当前用户进程</text>
<text x="431.1" y="521.5" font-size="14.5" fill="#888780" text-anchor="start">§4.2 的第 1～8 步</text>
<rect x="48.0" y="543.5" width="268.8" height="166.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="60.0" y="554.5" width="59.1" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="89.5" y="570.0" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">05 · 15</text>
<text x="182.4" y="623.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">请求进到 gsd</text>
<text x="182.4" y="651.5" font-size="14" fill="#534AB7" text-anchor="middle">校验 token、取串行锁，找到目标</text>
<text x="182.4" y="672.5" font-size="14" fill="#534AB7" text-anchor="middle">checkpoint</text>
<line x1="320.8" y1="626.8" x2="350.8" y2="626.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="356.8" y="543.5" width="268.8" height="166.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="368.8" y="554.5" width="32.4" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="385.0" y="570.0" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">12</text>
<rect x="368.8" y="676.0" width="244.8" height="26.0" rx="6" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="491.2" y="693.0" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="middle">到这里为止失败：什么都没动</text>
<text x="491.2" y="605.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">杀进程前先查完</text>
<text x="491.2" y="633.5" font-size="14" fill="#534AB7" text-anchor="middle">每棵树的镜像和依赖的父镜像都在；</text>
<text x="491.2" y="654.5" font-size="14" fill="#534AB7" text-anchor="middle">切层要用的目录建好</text>
<line x1="629.6" y1="626.8" x2="659.6" y2="626.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="665.6" y="543.5" width="268.8" height="166.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="677.6" y="554.5" width="59.1" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="707.1" y="570.0" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">10 · 12</text>
<rect x="677.6" y="676.0" width="244.8" height="26.0" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="800.0" y="693.0" font-size="13" fill="#712B13" font-weight="500" text-anchor="middle">restore 的提交点</text>
<text x="800.0" y="605.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">扫描并杀掉用户进程</text>
<text x="800.0" y="633.5" font-size="14" fill="#534AB7" text-anchor="middle">先冻住、确认没有新进程冒出来、</text>
<text x="800.0" y="654.5" font-size="14" fill="#534AB7" text-anchor="middle">再杀</text>
<line x1="938.4" y1="626.8" x2="968.4" y2="626.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="974.4" y="543.5" width="268.8" height="166.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="986.4" y="554.5" width="59.1" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="1015.9" y="570.0" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">07 · 08</text>
<text x="1108.8" y="623.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">切回层栈</text>
<text x="1108.8" y="651.5" font-size="14" fill="#534AB7" text-anchor="middle">换回目标 checkpoint 的层栈，换上</text>
<text x="1108.8" y="672.5" font-size="14" fill="#534AB7" text-anchor="middle">全新的可写层</text>
<line x1="1247.2" y1="626.8" x2="1277.2" y2="626.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1283.2" y="543.5" width="268.8" height="166.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="1295.2" y="554.5" width="85.8" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="1338.1" y="570.0" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">03 · 12 · 15</text>
<text x="1417.6" y="613.2" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">逐树 CRIU restore</text>
<text x="1417.6" y="641.0" font-size="14" fill="#534AB7" text-anchor="middle">按保存时的顺序，进程用原来的 PID</text>
<text x="1417.6" y="662.0" font-size="14" fill="#534AB7" text-anchor="middle">继续运行；记下下一次增量的父，后</text>
<text x="1417.6" y="683.0" font-size="14" fill="#534AB7" text-anchor="middle">台回收目录</text>
<rect x="665.6" y="726.0" width="886.4" height="40.0" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.8"/>
<text x="1108.8" y="752.0" font-size="14.5" fill="#712B13" font-weight="600" text-anchor="middle">提交点之后失败：进程已经没了，沙箱进入降级状态，只能再 restore 一次（第 14 章）</text>
<line x1="48" y1="802.0" x2="1552" y2="802.0" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="828.0" font-size="13" fill="#888780" text-anchor="start">注：框左上角的数字是章号。两条路径都不暂停虚拟机，范围外的进程一直在运行（第 08、09 章）。第 01～04 章是导论与基础，第 17 章是代价模型，第 18～23 章是验证与实测，第 24 章与沙箱级对比，第 25～30 章是使用与运维。</text>
</svg>