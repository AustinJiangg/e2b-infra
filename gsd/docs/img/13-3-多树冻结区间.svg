<rect x="1108.0" y="332.0" width="110.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1163.0" y="359.0" font-size="14" fill="#0F6E56" font-weight="600" text-anchor="middle">放开，运行</text>
<text x="48.0" y="417.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">树 C</text>
<text x="48.0" y="435.0" font-size="12.5" fill="#888780" text-anchor="start">根进程号最大</text>
<rect x="198.0" y="398.0" width="500.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="448.0" y="425.0" font-size="14" fill="#5F5E5A" text-anchor="middle">运行</text>
