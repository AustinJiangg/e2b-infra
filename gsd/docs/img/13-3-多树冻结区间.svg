<rect x="198.0" y="332.0" width="250.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="323.0" y="359.0" font-size="14" fill="#5F5E5A" text-anchor="middle">运行</text>
