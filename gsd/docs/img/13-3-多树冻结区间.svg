<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="778" viewBox="0 0 1600 778" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
</defs>
<rect width="1600" height="778" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">三棵树的 checkpoint：先 dump 的树停得最久</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">根进程号从小到大是 A、B、C，各自的 dump 耗时是 dA、dB、dC。CRIU 一次 dump 一棵，dump 完的树被 --leave-stopped 留在停止状态，直到全部下沉、重写 clear_refs 之后一起放开。</text>
<rect x="48.0" y="116.0" width="34.0" height="16.0" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="92.0" y="129.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">运行</text>
<rect x="159.0" y="116.0" width="34.0" height="16.0" rx="3" fill="#7F77DD" stroke="#7F77DD" stroke-width="1.2"/>
<text x="203.0" y="129.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">被 CRIU 冻结（自己的 dump）</text>
<rect x="432.4" y="116.0" width="34.0" height="16.0" rx="3" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="476.4" y="129.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">停着（--leave-stopped）</text>
<text x="48.0" y="199.0" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start">gsd 在做什么</text>
<rect x="201.0" y="172.0" width="244.0" height="40.0" rx="6" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="323.0" y="197.0" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="middle">criu dump A</text>
<rect x="451.0" y="172.0" width="244.0" height="40.0" rx="6" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="573.0" y="197.0" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="middle">criu dump B</text>
<rect x="701.0" y="172.0" width="244.0" height="40.0" rx="6" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="823.0" y="197.0" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="middle">criu dump C</text>
<rect x="951.0" y="172.0" width="154.0" height="40.0" rx="6" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.1"/>
<text x="1028.0" y="197.0" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="middle">下沉 + clear_refs</text>
<rect x="1111.0" y="172.0" width="104.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.1"/>
<text x="1163.0" y="197.0" font-size="14" fill="#0F6E56" font-weight="600" text-anchor="middle">SIGCONT</text>
<text x="323.0" y="244.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle">← dA →</text>
<text x="573.0" y="244.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle">← dB →</text>
<text x="823.0" y="244.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle">← dC →</text>
<text x="1028.0" y="244.0" font-size="14" fill="#5F5E5A" font-weight="600" text-anchor="middle">下沉 + clear_refs</text>
