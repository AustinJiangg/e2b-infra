<text x="823.0" y="425.0" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">冻结</text>
<rect x="948.0" y="398.0" width="160.0" height="44.0" rx="4" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="1028.0" y="425.0" font-size="14" fill="#3C3489" font-weight="600" text-anchor="middle">停着</text>
<rect x="1108.0" y="398.0" width="110.0" height="44.0" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1163.0" y="425.0" font-size="14" fill="#0F6E56" font-weight="600" text-anchor="middle">放开，运行</text>
<text x="448.0" y="492.0" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="middle">tFirstStopped</text>
<text x="1108.0" y="492.0" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="middle">SIGCONT</text>
<path d="M198 526 V534 H948 V526" fill="none" stroke="#2C2C2A" stroke-width="1.8"/>
<text x="962.0" y="539.0" font-size="14" fill="#2C2C2A" font-weight="600" text-anchor="start">criu_dump_ms = dA + dB + dC</text>
<path d="M448 566 V574 H1108 V566" fill="none" stroke="#3C3489" stroke-width="1.8"/>
<text x="1122.0" y="579.0" font-size="14" fill="#3C3489" font-weight="600" text-anchor="start">stopped_ms = dB + dC + 下沉 + clear_refs</text>
<path d="M198 606 V614 H1108 V606" fill="none" stroke="#3C3489" stroke-width="1.8"/>
<text x="1122.0" y="619.0" font-size="14" fill="#3C3489" font-weight="600" text-anchor="start">A 不在运行 = dA + stopped_ms，约等于整个 criu_dump_ms</text>
<path d="M698 646 V654 H1108 V646" fill="none" stroke="#3C3489" stroke-width="1.8"/>
<text x="1122.0" y="659.0" font-size="14" fill="#3C3489" font-weight="600" text-anchor="start">C 不在运行 ≈ dC + 零头</text>
<line x1="48" y1="700" x2="1552" y2="700" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="726.0" font-size="13" fill="#888780" text-anchor="start">注：各段宽度只表示先后，不按比例。2026-10-08 一轮多树测量（新 920B，每棵 64 MiB，首次全量，8 轮中位数，早于最终提交）：三棵树时 criu_dump_ms 138.87、stopped_ms 91.82，差约 47 ms，与单棵全量 dump 的 49.66 ms 相近，差的正是 A 自</text>
<text x="48.0" y="746.0" font-size="13" fill="#888780" text-anchor="start">己的 dump 时间。</text>
