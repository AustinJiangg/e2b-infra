<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1145" viewBox="0 0 1600 1145" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1145" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">删除一个 checkpoint：被依赖的只隐藏，依赖删光后先改记录、再收目录</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">以 15 §4.2 验证过的序列为例：先建 A，再建 B，B 的进程镜像以 A 为父。state.json 是 gsd 眼里的全部事实，它引用 tmpfs 上的镜像目录和根盘上的层目录，还必须与内核里实际挂着的层栈一致。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">引用</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">三处存储和它们之间的引用</text>
<rect x="350.0" y="168.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="387.0" y="184.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<text x="440.0" y="184.0" font-size="14.5" fill="#888780" text-anchor="start">父镜像必须活得比所有子镜像久</text>
<rect x="48.0" y="214.0" width="1000.0" height="500.0" rx="14" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<text x="68.0" y="244.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">tmpfs：/var/lib/gsd/snapshots/</text>
<text x="68.0" y="266.0" font-size="13" fill="#888780" text-anchor="start">guest 这一次开机期间存在</text>
<rect x="1108.0" y="214.0" width="444.0" height="190.0" rx="14" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<text x="1128.0" y="244.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">内核内存：当前挂着的层栈</text>
<text x="1128.0" y="266.0" font-size="13" fill="#888780" text-anchor="start">无法反过来查询，/proc/mounts 只显示开机时那几层</text>
<rect x="1108.0" y="434.0" width="444.0" height="280.0" rx="14" fill="#FBFBF9" stroke="#D3D1C7" stroke-width="1"/>
<text x="1128.0" y="464.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">根盘 ext4：/overlay/layers/</text>
<text x="1128.0" y="486.0" font-size="13" fill="#888780" text-anchor="start">guest 重启后仍在</text>
<rect x="72.0" y="334.0" width="250.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="197.0" y="372.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">ckpt_A_mem/t0</text>
<text x="197.0" y="399.4" font-size="13" fill="#5F5E5A" text-anchor="middle">全量镜像</text>
<rect x="72.0" y="544.0" width="250.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="197.0" y="582.6" font-size="15.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">ckpt_B_mem/t0</text>
<text x="197.0" y="609.4" font-size="13" fill="#5F5E5A" text-anchor="middle">增量镜像：没写的页在父镜像里</text>
<line x1="197.0" y1="540.0" x2="197.0" y2="432.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="209.0" y="491.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">parent 符号链接</text>
<rect x="392.0" y="286.0" width="642.0" height="410.0" rx="12" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.2"/>
<text x="408.0" y="312.0" font-size="15" fill="#3C3489" font-weight="600" text-anchor="start">state.json（同一个 tmpfs 上）</text>
<rect x="408.0" y="334.0" width="610.0" height="92.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="713.0" y="372.6" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">条目 A</text>
<text x="713.0" y="399.4" font-size="13" fill="#534AB7" text-anchor="middle">layers: L1, /mnt/lower；trees: t0（无父）</text>
<rect x="408.0" y="544.0" width="610.0" height="92.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="713.0" y="582.6" font-size="15.5" fill="#3C3489" font-weight="600" text-anchor="middle">条目 B</text>
<text x="713.0" y="609.4" font-size="13" fill="#534AB7" text-anchor="middle">layers: L2, L1, /mnt/lower；trees: t0（parent_id = A）</text>
<text x="713.0" y="462.0" font-size="13.5" fill="#534AB7" font-weight="600" text-anchor="middle">池给 A 记子节点计数 = 1</text>
<text x="713.0" y="484.0" font-size="13" fill="#5F5E5A" text-anchor="middle">last_trees：下一次增量以哪个镜像目录为父</text>
<rect x="768.0" y="294.0" width="250.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.2"/>
<text x="893.0" y="313.7" font-size="13" fill="#3C3489" font-weight="600" text-anchor="middle">overlay：当前 upper、层栈、序号</text>
<line x1="404.0" y1="380.0" x2="328.0" y2="380.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="404.0" y1="590.0" x2="328.0" y2="590.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1132.0" y="508.0" width="396.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1330.0" y="533.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">当前 upper / work</text>
<rect x="1132.0" y="562.0" width="396.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1330.0" y="587.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">L2</text>
<rect x="1132.0" y="616.0" width="396.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1330.0" y="641.2" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">L1</text>
<text x="1132.0" y="684.0" font-size="12.5" fill="#888780" text-anchor="start">/mnt/lower 是基础层，开机时挂好，不归 gsd 管</text>
<line x1="1022.0" y1="380.0" x2="1126.0" y2="630.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="1022.0" y1="580.0" x2="1126.0" y2="588.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<line x1="1022.0" y1="600.0" x2="1126.0" y2="644.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1132.0" y="288.0" width="91.0" height="34.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="1177.5" y="310.0" font-size="12.5" fill="#3C3489" font-weight="600" text-anchor="middle">upper</text>
<rect x="1231.0" y="288.0" width="91.0" height="34.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="1276.5" y="310.0" font-size="12.5" fill="#3C3489" font-weight="600" text-anchor="middle">L2</text>
<rect x="1330.0" y="288.0" width="91.0" height="34.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="1375.5" y="310.0" font-size="12.5" fill="#3C3489" font-weight="600" text-anchor="middle">L1</text>
<rect x="1429.0" y="288.0" width="91.0" height="34.0" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
<text x="1474.5" y="310.0" font-size="12.5" fill="#3C3489" font-weight="600" text-anchor="middle">/mnt/lower</text>
<text x="1132.0" y="354.0" font-size="13" fill="#5F5E5A" text-anchor="start">overlay 记录必须与它一致：gsd 每次切换都按记录拼完整的层栈</text>
<text x="1132.0" y="376.0" font-size="13" fill="#5F5E5A" text-anchor="start">拼错一层，轻则 ioctl 失败，重则切到内容不对的文件系统</text>
<line x1="1022.0" y1="309.0" x2="1124.0" y2="305.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="48.0" y="730.0" width="1504.0" height="40.0" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.8"/>
<text x="800.0" y="756.0" font-size="14.5" fill="#3C3489" font-weight="600" text-anchor="middle">guest 重启时内核层栈和 tmpfs 一起归零，state.json 不存在可以无歧义地当成“刚开机”；gsd 进程重启时两者都在，加载 state.json 回到重启前</text>
<circle cx="63" cy="816" r="15" fill="#2C2C2A"/>
<text x="63.0" y="821.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
<text x="90.0" y="823.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">删除与回收：先 A 后 B</text>
<text x="316.6" y="822.0" font-size="14.5" fill="#888780" text-anchor="start">删除一个 checkpoint 不保证立刻腾出空间</text>
<rect x="48.0" y="844.0" width="346.0" height="151.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="60.0" y="855.0" width="92.1" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="106.0" y="870.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">pool.remove</text>
<text x="221.0" y="906.2" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">删 A</text>
<text x="221.0" y="934.0" font-size="14" fill="#534AB7" text-anchor="middle">A 还有子节点 B：只打“已删除”标记。list 只</text>
<text x="221.0" y="955.0" font-size="14" fill="#534AB7" text-anchor="middle">剩 B，restore A 得到 not_found；A 的镜像目</text>
<text x="221.0" y="976.0" font-size="14" fill="#534AB7" text-anchor="middle">录和层都保留</text>
<line x1="398.0" y1="919.8" x2="428.0" y2="919.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="434.0" y="844.0" width="346.0" height="151.5" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="446.0" y="855.0" width="92.1" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="492.0" y="870.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">pool.remove</text>
<text x="607.0" y="916.7" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">删 B</text>
<text x="607.0" y="944.5" font-size="14" fill="#534AB7" text-anchor="middle">B 没有子节点：从池里摘掉；A 的计数减到 0，A</text>
<text x="607.0" y="965.5" font-size="14" fill="#534AB7" text-anchor="middle">已标记删除，一并摘掉</text>
<line x1="784.0" y1="919.8" x2="814.0" y2="919.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="820.0" y="844.0" width="346.0" height="151.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="832.0" y="855.0" width="131.7" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="897.8" y="870.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">DeleteCheckpoint</text>
<text x="993.0" y="916.7" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">先写 state.json</text>
<text x="993.0" y="944.5" font-size="14" fill="#5F5E5A" text-anchor="middle">写成功才删目录；写失败就不删，留给下一次</text>
<text x="993.0" y="965.5" font-size="14" fill="#5F5E5A" text-anchor="middle">delete 或重启时回收</text>
<line x1="1170.0" y1="919.8" x2="1200.0" y2="919.8" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<rect x="1206.0" y="844.0" width="346.0" height="151.5" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="1218.0" y="855.0" width="42.0" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1239.0" y="870.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">回收</text>
<text x="1379.0" y="906.2" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">锁内改名进 .trash</text>
<text x="1379.0" y="934.0" font-size="14" fill="#5F5E5A" text-anchor="middle">镜像目录：ckpt_A_mem、ckpt_B_mem 已无条目</text>
<text x="1379.0" y="955.0" font-size="14" fill="#5F5E5A" text-anchor="middle">引用。层目录：不在当前层栈、也不被任何条目引</text>
<text x="1379.0" y="976.0" font-size="14" fill="#5F5E5A" text-anchor="middle">用的才算</text>
<rect x="48.0" y="1011.5" width="732.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="414.0" y="1037.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">被删的如果正是 last_trees 指向的父，那几棵树的记录清掉、下一次全量——即使它只是被隐藏</text>
<rect x="820.0" y="1011.5" width="732.0" height="40.0" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="1186.0" y="1037.5" font-size="14.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">放锁后在后台 goroutine 里清空 .trash；上图里 L2、L1 仍在当前层栈中，所以留下</text>
<line x1="48" y1="1087.5" x2="1552" y2="1087.5" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1113.5" font-size="13" fill="#888780" text-anchor="start">注：反过来先删目录后写状态，两步之间崩溃会留下指向已删目录的条目，重启后一 restore 就失败；按现在的顺序崩溃只会多出无主目录，重启后由回收收掉。</text>
</svg>