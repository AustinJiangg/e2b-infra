<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1378" viewBox="0 0 1600 1378" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
