<rect width="1600" height="1378" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">沙箱级在虚拟机外恢复整台虚拟机，进程级在虚拟机里只恢复用户进程和文件</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">SDK 入口和端口号相同，请求在宿主的代理处由不同组件应答。沙箱级的 Firecracker 操作整个“沙箱内部”方框；进程级只触及方框里的用户进程树和文件系统。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
