<text x="980.0" y="1060.3" font-size="14" fill="#534AB7" text-anchor="middle">保存与重建用户进程</text>
<rect x="1216.0" y="988.0" width="280.0" height="104.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="1356.0" y="1032.4" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">guest 内核（打了补丁）</text>
<text x="1356.0" y="1060.3" font-size="14" fill="#534AB7" text-anchor="middle">soft-dirty 与 overlay 热切层</text>
