<text x="416.0" y="1226.3" font-size="14" fill="#5F5E5A" text-anchor="middle">进程级不动，照常运行；沙箱级 restore 时随整台虚拟机一起恢复</text>
<rect x="840.0" y="1154.0" width="656.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.2"/>
