<text x="48.0" y="1346.0" font-size="13" fill="#888780" text-anchor="start">注：两套的入口是同一个端口，同一时刻一台宿主上的这个端口只能由其中一套应答（§8）。沙箱级的事实以沙箱级手册为准。</text>
