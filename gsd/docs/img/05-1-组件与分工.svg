<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1306" viewBox="0 0 1600 1306" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC',sans-serif">
<defs>
<marker id="ar-build" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#B4B2A9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1L8.5 5L1.5 9" fill="none" stroke="#5F5E5A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1306" fill="#FFFFFF"/>
<text x="48.0" y="62.0" font-size="30" fill="#2C2C2A" font-weight="600" text-anchor="start">进程级 checkpoint 的组件：编排只在 guest 里的 gsd 一处</text>
<text x="48.0" y="96.0" font-size="15.5" fill="#5F5E5A" text-anchor="start">SDK 的请求经宿主代理原样转进 guest，由 gsd 鉴权并编排 CRIU 与 overlayfs 热切层。orchestrator 只在建模板时出现，沙箱运行期间的请求路径上没有它的专用代码。</text>
<line x1="48.0" y1="125.0" x2="88.0" y2="125.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="98.0" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">请求与调用</text>
<line x1="205.5" y1="125.0" x2="245.5" y2="125.0" stroke="#B4B2A9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-build)"/>
<text x="255.5" y="130.0" font-size="13.5" fill="#5F5E5A" text-anchor="start">仅建模板时：注入并自检</text>
<circle cx="63" cy="178" r="15" fill="#2C2C2A"/>
<text x="63.0" y="183.5" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
<text x="90.0" y="185.0" font-size="20" fill="#2C2C2A" font-weight="600" text-anchor="start">组件在哪、谁调用谁</text>
<rect x="290.0" y="168.0" width="74.0" height="24.0" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
<text x="327.0" y="184.0" font-size="13" fill="#A32D2D" font-weight="600" text-anchor="middle">本图重点</text>
<rect x="48.0" y="214.0" width="1504.0" height="136.0" rx="12" fill="#FAFAF7" stroke="#E2E0D8" stroke-width="1"/>
<text x="66.0" y="242.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">调用方</text>
<rect x="816.0" y="236.0" width="360.0" height="92.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="996.0" y="274.4" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">Python SDK</text>
<text x="996.0" y="302.3" font-size="14" fill="#5F5E5A" text-anchor="middle">四个 RPC 与 /health，带沙箱的 access token</text>
<rect x="48.0" y="396.0" width="1504.0" height="172.0" rx="12" fill="#FAFAF7" stroke="#E2E0D8" stroke-width="1"/>
<text x="66.0" y="424.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">宿主</text>
<rect x="88.0" y="442.0" width="380.0" height="104.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="278.0" y="475.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">orchestrator 模板构建</text>
<text x="278.0" y="503.8" font-size="14" fill="#5F5E5A" text-anchor="middle">放入 gsd、gsd.service、overlay-init，内核参数</text>
<text x="278.0" y="524.8" font-size="14" fill="#5F5E5A" text-anchor="middle">init= 指向 overlay-init</text>
<rect x="816.0" y="442.0" width="360.0" height="104.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="996.0" y="475.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">client-proxy 与 orchestrator 沙箱代理</text>
<text x="996.0" y="503.8" font-size="14" fill="#5F5E5A" text-anchor="middle">按“端口 + 沙箱 id”把请求转进 guest，不理解</text>
<text x="996.0" y="524.8" font-size="14" fill="#5F5E5A" text-anchor="middle">checkpoint 语义</text>
<line x1="996.0" y1="332.0" x2="996.0" y2="436.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1008.0" y="389.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">HTTP 49984</text>
<rect x="48.0" y="620.0" width="1504.0" height="592.0" rx="12" fill="#FAFAF7" stroke="#E2E0D8" stroke-width="1"/>
<text x="66.0" y="648.0" font-size="16" fill="#2C2C2A" font-weight="600" text-anchor="start">guest 沙箱</text>
<rect x="88.0" y="670.0" width="280.0" height="116.0" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.2"/>
<rect x="100.0" y="681.0" width="189.7" height="22.0" rx="11" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="194.8" y="696.5" font-size="12" fill="#5F5E5A" font-weight="500" text-anchor="middle">PID 1 的前身，只在开机时运行</text>
<text x="228.0" y="724.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">overlay-init</text>
<text x="228.0" y="752.8" font-size="14" fill="#5F5E5A" text-anchor="middle">开机时挂好 overlay 根，chroot 后</text>
<text x="228.0" y="773.8" font-size="14" fill="#5F5E5A" text-anchor="middle">exec systemd</text>
<rect x="472.0" y="670.0" width="1048.0" height="116.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="484.0" y="681.0" width="134.0" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="551.0" y="696.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">root，systemd 服务</text>
<text x="996.0" y="735.4" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">gsd 守护进程</text>
<text x="996.0" y="763.3" font-size="14" fill="#534AB7" text-anchor="middle">鉴权、串行化、找用户进程树、编排 CRIU 与热切层的先后、失败分级、状态持久化、回收</text>
<rect x="472.0" y="856.0" width="280.0" height="116.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="612.0" y="895.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">snapshot store 与层目录</text>
<text x="612.0" y="923.8" font-size="14" fill="#5F5E5A" text-anchor="middle">/var/lib/gsd/snapshots（2 GiB</text>
<text x="612.0" y="944.8" font-size="14" fill="#5F5E5A" text-anchor="middle">tmpfs）与 /overlay/layers</text>
<rect x="856.0" y="856.0" width="280.0" height="116.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<rect x="868.0" y="867.0" width="90.6" height="22.0" rx="11" fill="#FFFFFF" stroke="#7F77DD" stroke-width="0.8"/>
<text x="913.3" y="882.5" font-size="12" fill="#534AB7" font-weight="500" text-anchor="middle">gsd 的子进程</text>
<text x="996.0" y="921.4" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">CRIU 4.x</text>
<text x="996.0" y="949.3" font-size="14" fill="#534AB7" text-anchor="middle">一次 dump 或 restore 一棵进程树</text>
<rect x="1240.0" y="856.0" width="280.0" height="116.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
<text x="1380.0" y="895.9" font-size="16.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">用户进程树</text>
<text x="1380.0" y="923.8" font-size="14" fill="#5F5E5A" text-anchor="middle">被 dump、被杀掉、被 CRIU 重建的</text>
<text x="1380.0" y="944.8" font-size="14" fill="#5F5E5A" text-anchor="middle">对象</text>
<rect x="72.0" y="1022.0" width="1080.0" height="168.0" rx="12" fill="#FFFFFF" stroke="#7F77DD" stroke-width="1.2"/>
<text x="90.0" y="1050.0" font-size="16" fill="#3C3489" font-weight="600" text-anchor="start">补丁内核</text>
<rect x="88.0" y="1068.0" width="280.0" height="100.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="228.0" y="1110.4" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">overlayfs 热切层 ioctl</text>
<text x="228.0" y="1138.3" font-size="14" fill="#534AB7" text-anchor="middle">把层栈换成 gsd 给的一串目录</text>
<rect x="856.0" y="1068.0" width="280.0" height="100.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.2"/>
<text x="996.0" y="1110.4" font-size="16.5" fill="#3C3489" font-weight="600" text-anchor="middle">soft-dirty</text>
<text x="996.0" y="1138.3" font-size="14" fill="#534AB7" text-anchor="middle">arm64 上靠补丁加；记录哪些页被写过</text>
<line x1="996.0" y1="550.0" x2="996.0" y2="664.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1008.0" y="612.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">按端口原样转发</text>
<line x1="228.0" y1="550.0" x2="228.0" y2="664.0" stroke="#B4B2A9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-build)"/>
<path d="M472.0 494.0 L612.0 494.0 L612.0 664.0" fill="none" stroke="#B4B2A9" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar-build)"/>
<text x="242.0" y="582.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">仅建模板时注入并自检</text>
<line x1="228.0" y1="790.0" x2="228.0" y2="1062.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="240.0" y="931.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">开机时挂好 overlay 根</text>
<path d="M468.0 760.0 L420.0 760.0 L420.0 1118.0 L374.0 1118.0" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar-flow)"/>
<text x="430.0" y="1108.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">ioctl</text>
<line x1="612.0" y1="790.0" x2="612.0" y2="850.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="624.0" y="825.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">读写状态与镜像</text>
<line x1="996.0" y1="790.0" x2="996.0" y2="850.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1008.0" y="825.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">fork 并等待</text>
<line x1="1380.0" y1="790.0" x2="1380.0" y2="850.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1392.0" y="825.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">信号与 proc 扫描</text>
<line x1="852.0" y1="914.0" x2="758.0" y2="914.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="805.0" y="906.0" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">读写镜像</text>
<line x1="1140.0" y1="914.0" x2="1234.0" y2="914.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1187.0" y="906.0" font-size="12.5" fill="#5F5E5A" font-weight="600" text-anchor="middle">dump、restore</text>
<line x1="996.0" y1="976.0" x2="996.0" y2="1062.0" stroke="#5F5E5A" stroke-width="1.8" marker-end="url(#ar-flow)"/>
<text x="1008.0" y="1004.0" font-size="13" fill="#5F5E5A" font-weight="600" text-anchor="start">读 pagemap</text>
<rect x="472.0" y="1068.0" width="280.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="612.0" y="1110.0" font-size="13.5" fill="#5F5E5A" text-anchor="middle">不记录有哪些 checkpoint</text>
<text x="612.0" y="1134.0" font-size="13.5" fill="#5F5E5A" text-anchor="middle">不决定切到哪个层栈</text>
<line x1="48" y1="1248" x2="1552" y2="1248" stroke="#E5E3DB" stroke-width="1"/>
<text x="48.0" y="1274.0" font-size="13" fill="#888780" text-anchor="start">注：CRIU 每次只收到“dump 这棵树到这个目录”或“从这个目录 restore”，内核每次只收到“把层栈换成这一串目录”；哪几棵树算用户进程、增量的父镜像是谁、checkpoint 对应哪个层栈，只有 gsd 知道。</text>
</svg>